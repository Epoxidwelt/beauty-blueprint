    if (el) el.parentNode.removeChild(el);
    el = document.createElement('div');
    el.id = 'best-preview-root'; el.className = 'best-preview';
    el.innerHTML = '<div style="width:100%;max-width:780px"><div class="best-previewbar"><button class="best-secondary" onclick="__bb.select(\'best-preview-close\')">Schließen</button>' +
      '<button class="best-primary" onclick="__bb.select(\'best-print\')">Drucken / Als PDF sichern</button></div>' +
      '<div class="best-paper"><img class="logo" src="' + LOGO_SRC + '" alt="Beauty Lounge" /><h1>Bestellformular ' + esc(o.id) + '</h1>' +
      '<p>Bestellt von <b>' + esc(o.besteller || '—') + '</b> · ' + esc(formatDateDE(new Date(o.createdAt))) + ' · Status: ' + (o.status === 'completed' ? 'abgeschlossen' : 'Entwurf') + '</p>' +
      '<div class="best-h2">Positionen</div><table class="best-table"><tr><th class="r">Menge</th><th class="r">Gratis</th><th>Art.-Nr.</th><th>Bezeichnung</th><th>Verwendung</th><th>Aktion</th><th class="r">EK</th><th class="r">Gesamt</th></tr>' + rows + '</table>' +
      (wrows ? '<div class="best-h2">WKZ-Ware</div><table class="best-table"><tr><th class="r">Menge</th><th>Art.-Nr.</th><th>Bezeichnung</th><th class="r">EK</th><th class="r">Gesamt</th></tr>' + wrows + '</table>' : '') +
      bestSummaryBlocks(o) + '</div></div>';
    document.body.appendChild(el);
  }
  function bestPreviewClose() { var el = document.getElementById('best-preview-root'); if (el) el.parentNode.removeChild(el); }

  // ---------- Eingaben ----------
  function bestSetQty(key, wkz, qty) {
    var parts = String(key).split('|'), productId = parts[0], purpose = parts[1] || '';
    var p = bestProduct(productId);
    if (!p) return;
    purpose = purpose || 'sale';
    if (bestPurposesFor(p.brand).indexOf(purpose) === -1) return; // nur erlaubte Verwendungen je Marke
    if (wkz && !bestHasWkz(p.brand)) return;                      // WKZ-Ware nur bei KLAPP
    qty = Math.max(0, Math.floor(Number(qty)) || 0);
    var list = wkz ? BEST.wkzItems : BEST.items;
    var it = bestFind(key, wkz), oldQ = it ? (wkz ? it.quantity : it.quantityPaid) : 0;
    if (!it && qty > 0) {
      if (wkz) { it = { id: bestUid('wi-'), productId: p.id, product: p, purpose: purpose, quantity: qty, unitPurchasePrice: bestItemPrice(p, purpose) }; }
      else { it = { id: bestUid('oi-'), productId: p.id, product: p, purpose: purpose, quantityPaid: qty, quantityFree: 0, promotionType: 'none', unitPurchasePrice: bestItemPrice(p, purpose) }; }
      list.push(it); if (!wkz) bestTouch(it, 0, qty);
    } else if (it && qty === 0) {
      list.splice(list.indexOf(it), 1);
    } else if (it) {
      if (wkz) it.quantity = qty; else { it.quantityPaid = qty; bestTouch(it, oldQ, qty); }
    }
    if (it && !wkz) bestRecalc(it);
    if (!wkz) BEST.pick = null;
    BEST.wkzOverrunConfirmed = 0;
    bestPersist(); bestRefresh();
  }
  function bestInput(name, value, id) {
    if (name === 'search') { BEST.search = value; BEST.limit = BEST_CONFIG.pageSize; var l = document.getElementById('best-list'); if (l) l.innerHTML = bestListHtml(); }
    else if (name === 'group') { BEST.group = value; BEST.limit = BEST_CONFIG.pageSize; render(); }
    else if (name === 'qty') { bestSetQty(id, false, value); }
    else if (name === 'qtyw') { bestSetQty(id, true, value); }
  }
  var BEST_PROMO_CYCLE = ['none', '6+1', '5+1', '3+1'];
  var BEST_PROMO_PICK = ['6+1', '5+1', '3+1', 'none'];
  function bestellungHandler(kind, key, extra) {
    if (kind === 'best-besteller') { BEST.besteller = key; bestPersist(); render(); }
    else if (kind === 'best-tab') {
      bestScanStop();
      BEST.tab = key; BEST.limit = BEST_CONFIG.pageSize; BEST.pick = null;
      if (key === 'wkz') { BEST.brand = 'KLAPP'; BEST.category = ''; BEST.catOpen = false; BEST.favOnly = false; BEST.search = ''; }   // WKZ nur KLAPP, immer zurück zur Rubrikenübersicht
      render();
    }
    else if (kind === 'best-cat') { BEST.category = (BEST.category === key) ? '' : key; BEST.catOpen = false; BEST.limit = BEST_CONFIG.pageSize; render(); }
    else if (kind === 'best-brand') { bestEnterBrand(key); }
    else if (kind === 'best-hub') { bestLeaveBrand(); render(); }
    else if (kind === 'best-back') {   // genau ein Schritt zurück: WKZ-Ware → Bestellung → Produkte → Produktlinien → Marke → Hauptbildschirm
      BEST.pick = null; BEST.limit = BEST_CONFIG.pageSize;
      if (BEST.tab === 'wkz' || BEST.tab === 'scan') { bestScanStop(); BEST.tab = 'order'; }
      else if (BEST.favOnly) BEST.favOnly = false;
      else if (BEST.category) { BEST.category = ''; BEST.catOpen = false; }
      else if (BEST.workBrand) { bestLeaveBrand(); }   // zurück zur Hersteller-Übersicht
      else { replaceTop('kunde-wahl'); return; }   // von der Hersteller-Übersicht: Hauptbildschirm
      render();
    }
    else if (kind === 'best-cat-toggle') { BEST.catOpen = !BEST.catOpen; render(); }
    else if (kind === 'best-filter-brand') { BEST.brand = key || null; BEST.group = ''; BEST.category = ''; BEST.catOpen = false; BEST.limit = BEST_CONFIG.pageSize; render(); }
    else if (kind === 'best-toggle') { BEST[key] = !BEST[key]; BEST.limit = BEST_CONFIG.pageSize; render(); }
    else if (kind === 'best-more') { BEST.limit += BEST_CONFIG.pageSize; bestRefresh(); }
    else if (kind === 'best-fav') {
      var fi = BEST_FAVS.indexOf(key); if (fi > -1) BEST_FAVS.splice(fi, 1); else BEST_FAVS.push(key);
      bestSave(BEST_KEYS.favs, BEST_FAVS); bestRefresh();
    }
    else if (kind === 'best-pick') { BEST.pick = (BEST.pick === key) ? null : key; BEST.pickPromo = 'none'; bestRefresh(); }
    else if (kind === 'best-pickpromo') { BEST.pickPromo = key; bestRefresh(); }
    else if (kind === 'best-add-purpose') {   // Button Tester / Kabinenware: eigene Zeile mit eigener Menge öffnen
      if (!bestFind(key, false)) { bestellungHandler('best-add', key); }
      setTimeout(function () { var el = document.querySelector('input[data-k="' + key + '"]'); if (el) { el.focus(); el.select(); try { el.scrollIntoView({ block: 'center' }); } catch (x) { /* egal */ } } }, 60);
    }
    else if (kind === 'best-scan-toggle') { if (SCAN.running) bestScanStop(); else bestScanStart(); }
    else if (kind === 'best-scan-manual') {
      var ei = document.getElementById('bst-ean'), cv = ei ? ei.value.trim() : '';
      if (!/^\d{8,14}$/.test(cv)) { bestScanMsg('Bitte einen EAN-Code mit 8–13 Ziffern eingeben.'); return; }
      SCAN.last = ''; bestScanCode(cv); if (ei) { ei.value = ''; ei.focus(); }
    }
    else if (kind === 'best-add-purpose-w') {
      if (!bestFind(key, true)) bestSetQty(key, true, 1);
      setTimeout(function () { var el = document.querySelector('input[data-k="' + key + '"]'); if (el) { el.focus(); el.select(); try { el.scrollIntoView({ block: 'center' }); } catch (x) { /* egal */ } } }, 60);
    }
    else if (kind === 'best-add-next') {   // + : erst Verkauf, dann Tester, dann Kabinenware; sind alle drei da, Verkauf +1
      var seq = ['sale', 'tester', 'cabin'], nx = seq.filter(function (k) { return !bestFind(key + '|' + k, false); })[0] || 'sale';
      return bestellungHandler('best-add', key + '|' + nx);
    }
    else if (kind === 'best-add') {
      var ap = String(key).split('|'), apr = bestProduct(ap[0]);
      if (apr && BEST_PURPOSES.some(function (x) { return x.key === ap[1]; })) {
        var promo = 'none';
        var pkg = 1;   // 6+1 → gleich 6 bezahlt + 1 gratis = 7 Stück
        var line = bestFind(key, false);
        if (line) { line.quantityPaid += 1; bestTouch(line, line.quantityPaid - 1, line.quantityPaid); }
        else { line = { id: bestUid('oi-'), productId: apr.id, product: apr, purpose: ap[1], quantityPaid: pkg, quantityFree: 0, promotionType: promo, unitPurchasePrice: bestItemPrice(apr, ap[1]) }; BEST.items.push(line); bestTouch(line, 0, pkg); }
        bestRecalc(line); BEST.pick = null; BEST.wkzOverrunConfirmed = 0; bestPersist(); bestRefresh();
      }
    }
    else if (kind === 'best-set-purpose') {   // Verwendung einer Zeile nachträglich ändern (Standard beim + ist Verkauf)
      var sp = String(key).split('|'), cur = bestFind(sp[0] + '|' + sp[1], false);
      if (cur && sp[2] !== sp[1] && bestPurposesFor(cur.product.brand).indexOf(sp[2]) > -1) {
        var tgt = bestFind(sp[0] + '|' + sp[2], false);
        cur.purpose = sp[2]; cur.unitPurchasePrice = bestItemPrice(cur.product, sp[2]);
        if (sp[2] !== 'sale') cur.promotionType = 'none';   // Aktion nur auf Verkaufsware
        if (tgt) { Object.keys(cur.contrib || {}).forEach(function (k) { tgt.contrib = tgt.contrib || {}; tgt.contrib[k] = (tgt.contrib[k] || 0) + cur.contrib[k]; }); tgt.quantityPaid += cur.quantityPaid; BEST.items.splice(BEST.items.indexOf(cur), 1); bestRecalc(tgt); } else bestRecalc(cur);
        BEST.wkzOverrunConfirmed = 0; bestPersist(); bestRefresh();
      }
    }
    else if (kind === 'best-q') { var it = bestFind(key, false); bestSetQty(key, false, bestQtyOf(it, false) + extra); }
    else if (kind === 'best-qw') { var iw = bestFind(key, true); bestSetQty(key, true, bestQtyOf(iw, true) + extra); }
    else if (kind === 'best-cyc-promo') {
      var im = bestFind(key, false);
      if (im && im.purpose === 'sale') {
        var cyc = bestPromosFor(im.product.brand), pi = cyc.indexOf(im.promotionType);
        im.promotionType = cyc[(pi + 1) % cyc.length];
        var psz = bestPromoSize(im.promotionType), oq = im.quantityPaid; if (psz) { im.quantityPaid = psz; bestTouch(im, oq, psz); } /* 6+1 → 6 bezahlt + 1 gratis = 7 Stück, 10+2 → 12 Stück */
        bestRecalc(im); BEST.wkzOverrunConfirmed = 0; bestPersist(); bestRefresh();
      }
    }
    else if (kind === 'best-next') { goTo('best-pruefen'); }
    else if (kind === 'best-overrun-ok') { BEST.wkzOverrunConfirmed = bestOverrun(bestTotals()); bestPersist(); render(); }
    else if (kind === 'best-delete-order') {   // nur Inhaberin: abgeschlossene/gespeicherte Bestellung endgültig löschen
      var dord = bestFindOrder(key);
      if (!dord || !bestIsApprover()) return;
      bestAsk('Bestellung löschen?', 'Bist du sicher, dass du die Bestellung ' + dord.id + ' löschen möchtest? Das kann nicht rückgängig gemacht werden.', 'Ja, endgültig löschen', function () {
        bestSave(BEST_KEYS.orders, bestLoad(BEST_KEYS.orders, []).filter(function (x) { return x.id !== dord.id; }));
        if (BEST.editingId === dord.id) { BEST.editingId = null; BEST.items = []; BEST.wkzItems = []; bestPersist(); }
        BEST.completedId = null; BEST.flash = 'Bestellung ' + dord.id + ' wurde gelöscht.'; replaceTop('bestellung');
      });
    }
    else if (kind === 'best-discard-collective') {   // nur Inhaberin: aktuelle Sammelbestellung verwerfen
      if (!bestIsApprover() || !BEST.items.length) return;
      bestAsk('Sammelbestellung verwerfen?', 'Bist du sicher, dass du die Sammelbestellung ' + BEST.workBrand + ' mit allen Einträgen verwerfen möchtest? Das kann nicht rückgängig gemacht werden.', 'Ja, endgültig verwerfen', function () {
        BEST.items = []; BEST.wkzItems = []; BEST.editingId = null; BEST.wkzOverrunConfirmed = 0; BEST.flash = 'Sammelbestellung ' + BEST.workBrand + ' wurde verworfen.'; bestLeaveBrand(); render();
      });
    }
    else if (kind === 'best-save') {   // Mitarbeiterin: Eintrag ist Teil der gemeinsamen Sammelbestellung (liegt schon im gemeinsamen Entwurf)
      bestPersist(); BEST.flash = '✓ Gespeichert — offene Bestellung ' + BEST.workBrand + '.'; bestLeaveBrand();
      path = ['login', 'kunde-wahl', 'bestellung']; pointer = 2; render();
    }
    else if (kind === 'best-finish') { if (bestIsApprover()) bestCommitOrder('completed'); }
    else if (kind === 'best-approve') {   // gespeicherte Bestellung freigeben & abschließen (nur Freigabe-Person)
      var ao = bestFindOrder(key);
      if (ao && bestIsApprover() && ao.status !== 'completed') {
        ao.status = 'completed'; ao.approvedBy = STATE.mitarbeiterin; ao.approvedAt = new Date().toISOString(); ao.emailSent = {};
        bestSave(BEST_KEYS.orders, bestLoad(BEST_KEYS.orders, []).map(function (x) { return x.id === ao.id ? ao : x; }));
        BEST.completedId = ao.id; render();
      }
    }
    else if (kind === 'best-edit-order') {
      var eo = bestFindOrder(key);
      if (!eo || (eo.status === 'completed' && !bestIsApprover())) return;   // abgeschlossene Bestellungen nur durch die Freigabe-Person änderbar
      var eb = (eo.items[0] || eo.wkzItems[0] || {}).product; eb = eb ? eb.brand : null;
      bestMerge();
      if (eb && BEST.items.some(function (i) { return i.product.brand === eb; }) && !BEST.editingId && !window.confirm('Die aktuelle Sammelbestellung ' + eb + ' wird durch diese Bestellung ersetzt. Fortfahren?')) return;
      if (eb) { bestSplit(eb); BEST.brand = eb; }
      BEST.items = JSON.parse(JSON.stringify(eo.items)); BEST.wkzItems = JSON.parse(JSON.stringify(eo.wkzItems)); BEST.wkzRate = eo.wkzRate;
      BEST.editingId = eo.id; BEST.tab = 'order'; BEST.category = ''; BEST.catOpen = false; BEST.pick = null; BEST.wkzOverrunConfirmed = 0; BEST.completedId = null; bestPersist();
      path = ['login', 'kunde-wahl', 'bestellung']; pointer = 2; render();
    }
    else if (kind === 'best-edit-cancel') {
      BEST.editingId = null; BEST.items = []; BEST.wkzItems = []; BEST.wkzRate = BEST_CONFIG.defaultWkzRate; BEST.wkzOverrunConfirmed = 0; bestLeaveBrand(); render();
    }
    else if (kind === 'best-new') { BEST.completedId = null; replaceTop('bestellung'); }
    else if (kind === 'best-view-order') { BEST.completedId = key; goTo('best-fertig'); }
    else if (kind === 'best-preview') { if (bestIsApprover()) bestPreview(key); }
    else if (kind === 'best-preview-close') { bestPreviewClose(); }
    else if (kind === 'best-print') { try { window.print(); } catch (e) { /* Drucken evtl. gesperrt */ } }
    else if (kind === 'best-export') { if (bestIsApprover()) bestExport(key); }
    else if (kind === 'best-email' && !bestIsApprover()) { /* nur Freigabe-Person */ }
    else if (kind === 'best-email') {
      var all2 = bestLoad(BEST_KEYS.orders, []), eo = key === 'Entwurf' ? bestDraftOrder() : all2.filter(function (x) { return x.id === key; })[0];
      if (eo) {
        if (key !== 'Entwurf') { eo.emailSent = eo.emailSent || {}; eo.emailSent[extra] = new Date().toISOString(); bestSave(BEST_KEYS.orders, all2); }
        window.location.href = bestBrandHref(eo, extra);
        render();
      }
    }
    else if (kind === 'best-email-intern') { var ei = bestFindOrder(key); if (ei && bestIsApprover()) window.location.href = bestEmailHref(ei); }
  }

  function render() {
    var id = path[pointer];
    if (id === 'login') return renderLogin();
    if (id === 'kunde-wahl') return renderKundeWahl();
    if (id === 'aktionen-uebersicht') return renderAktionenUebersicht();
    if (id === 'kunde-bestehend') return renderKundeBestehend();
    if (id === 'kunde-neu') return renderKundeNeu();
    if (id === 'ziel') return renderZiel();
    if (id === 'painpoint') return renderPainpoint();
    if (id === 'anlass') return renderAnlass();
    if (id.indexOf('lifestyle:') === 0) return renderYesNoStep('lifestyle', LIFESTYLE_ITEMS, 'lifestyle', 'Lifestyle & Pflege');
    if (id.indexOf('sicherheit:') === 0) return renderYesNoStep('sicherheit', SAFETY_ITEMS, 'sicherheit', 'Sicherheitscheck');
    if (id === 'sicherheit-summary') return renderSicherheitSummary();
    if (id.indexOf('analyse:') === 0) return renderAnalyseStep();
    if (id === 'auswertung') return renderAuswertung();
    if (id === 'empfehlungen') return renderEmpfehlungen();
    if (id === 'blueprint') return renderBlueprint();
    if (id === 'abschluss') return renderAbschluss();
    if (id === 'bestellung') return renderBestMain();
    if (id === 'best-pruefen') return renderBestPruefen();
    if (id === 'best-fertig') return renderBestDone();
    if (id === 'admin-login') return renderAdminLogin();
    if (id === 'admin-dashboard') return STATE.isAdmin ? renderAdminDashboard() : renderAdminLogin();
  }

  function renderInitialLoading() {
    var el = document.getElementById('screen');
    el.setAttribute('data-mode', 'brand');
    el.innerHTML = '<div class="content center"><div class="loading-wrap"><div class="spinner"></div>' +
      '<p style="font-size:.875rem;color:var(--text-soft)">Beratungsinhalte werden geladen …</p></div></div>';
  }

  var sheetsConfigured = Object.keys(SHEET_CONFIG).some(function (k) { return SHEET_CONFIG[k]; });
  if (sheetsConfigured) renderInitialLoading();
  // applyAdminOverrides() erst NACH einem eventuellen Sheet-Load, damit eine vom Admin
  // gespeicherte Ziele-Liste in jedem Fall das letzte Wort hat (siehe Kommentar dort).
  loadSheetData().then(function () { applyAdminOverrides(); render(); }).catch(function (e) {
    console.warn('Sheet-Daten konnten nicht vollständig geladen werden, nutze Standardwerte.', e);
    applyAdminOverrides();
    render();
  });
})();
</script>
