<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Beauty Blueprint">
<link rel="apple-touch-icon" href="../assets/logo/beauty-lounge-logo.png">
<title>Beauty Blueprint — Klickbarer Prototyp</title>
<style>
  @font-face {
    font-family: 'Iowan Old Style';
    src: local('Iowan Old Style');
  }

  :root {
    /* Exakt aus dem Original-Logo (Beauty_Lounge_Logo Transparent.png) extrahiert */
    --warmweiss: #FFFFFF;
    --rose-pale: #ECD9DF;
    --rose-wash: #DCB9C5;
    --rose: #C4879C;
    --rose-deep: #9A4B66;
    --anthrazit: #3F3F41;
    --anthrazit-soft: #7A7A7C;
    --surface: var(--warmweiss);
    --surface-raised: #FFFFFF;
    --border: rgba(63, 63, 65, 0.14);
    --border-strong: rgba(63, 63, 65, 0.26);
    --text: var(--anthrazit);
    --text-soft: var(--anthrazit-soft);
    --danger: #A6473E;
    --warn: #A97A2E;
    --good: #52704F;

    --backdrop: #FFFFFF;
    --backdrop-ink: #3A3638;
    --backdrop-ink-soft: rgba(58, 54, 56, 0.6);

    --font-display: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root { --backdrop: #FFFFFF; --backdrop-ink: #3A3638; --backdrop-ink-soft: rgba(58, 54, 56, 0.6); }
  }
  :root[data-theme="dark"] { --backdrop: #FFFFFF; --backdrop-ink: #3A3638; --backdrop-ink-soft: rgba(58, 54, 56, 0.6); }
  :root[data-theme="light"] { --backdrop: #FFFFFF; --backdrop-ink: #3A3638; --backdrop-ink-soft: rgba(58, 54, 56, 0.6); }

  * { box-sizing: border-box; }
  html { font-size: 16px; }

  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    background: var(--backdrop);
    color: var(--backdrop-ink);
    font-family: var(--font-body);
    display: flex;
    overflow: hidden;
  }

  .brand-logo { display: block; margin: 0 auto 1.1rem; }
  .brand-logo.lg { height: 126px; width: auto; }
  .brand-logo.md { height: 84px; width: auto; }

  .device {
    width: 100%;
    max-width: 1280px;
    height: 100%;
    margin: 0 auto;
    display: flex;
  }

  .screen {
    flex: 1;
    background: var(--surface);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: background-color .35s ease;
  }

  .screen[data-mode="dezent"], .screen[data-mode="brand"] { background: var(--warmweiss); }

  .topbar {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 1rem 1.3rem 0.3rem;
    flex-shrink: 0;
  }
  .back-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.5);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  .back-btn:hover { border-color: var(--border-strong); }
  .back-btn[disabled] { visibility: hidden; }
  .topbar-logo { height: 48px; width: auto; flex-shrink: 0; }
  .topbar-spacer { flex: 1; }
  .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.15rem; }
  .step-label {
    font-family: var(--font-body);
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-soft);
    white-space: nowrap;
  }
  .context-label {
    font-size: 0.625rem;
    color: var(--text-soft);
    opacity: 0.75;
    white-space: nowrap;
    flex-shrink: 0;
    max-width: 9rem;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stepper {
    display: flex;
    align-items: center;
    padding: 0.5rem 1.6rem 1.1rem;
    flex-shrink: 0;
  }
  .stepper .seg { flex: 1; height: 1px; background: var(--border-strong); }
  .stepper .step-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--surface-raised);
    border: 1.5px solid var(--border-strong);
    flex-shrink: 0;
    transition: all .2s ease;
  }
  .stepper .step-dot.done { background: var(--rose); border-color: var(--rose); }
  .stepper .step-dot.current { width: 13px; height: 13px; background: var(--rose-deep); border-color: var(--rose-deep); }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 2.2rem 2rem;
    display: flex;
    flex-direction: column;
  }
  .content.center { justify-content: center; }

  .eyebrow {
    font-size: 0.6875rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-soft);
    margin: 0 0 0.4rem;
  }
  .section-label {
    font-family: var(--font-body);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--rose-deep);
    margin: 1.3rem 0 0.6rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--border);
  }
  .section-label:first-of-type { margin-top: 0.9rem; padding-top: 0; border-top: none; }
  h1.q, h2.q {
    font-family: var(--font-body);
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--text);
    margin: 0 0 1.1rem;
    text-wrap: balance;
    line-height: 1.2;
  }
  h1.q { font-size: 1.75rem; }
  h2.q { font-size: 1.35rem; }
  p.sub {
    font-size: 0.875rem;
    color: var(--text-soft);
    margin: -0.6rem 0 1.2rem;
    max-width: 34rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 0.6rem;
  }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

  .card {
    font-family: var(--font-body);
    text-align: left;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    font-size: 0.9rem;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    transition: border-color .15s ease, background-color .15s ease, transform .1s ease;
  }
  .card:hover { border-color: var(--rose-deep); }
  .card:active { transform: scale(0.98); }
  .card.selected {
    border-color: var(--rose-deep);
    background: color-mix(in srgb, var(--rose-pale) 55%, white);
  }
  .card .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--rose-deep);
    flex-shrink: 0;
    opacity: 0;
    transition: opacity .15s ease;
  }
  .card.selected .dot { opacity: 1; }
  .card.disabled { opacity: 0.45; cursor: not-allowed; }
  .card.disabled:hover { border-color: var(--border); }

  .card.center-tap { justify-content: center; text-align: center; font-size: 0.95rem; padding: 1.2rem 1rem; }

  .row-choice {
    display: flex;
    gap: 0.6rem;
  }
  .row-choice .card { flex: 1; justify-content: center; text-align: center; }

  .scale4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
  }
  .scale4 .card { flex-direction: column; gap: 0.5rem; text-align: center; justify-content: center; padding: 1rem 0.5rem; }
  .scale4 .level-fill { display: flex; gap: 3px; }
  .scale4 .level-fill span { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); }
  .scale4 .card.selected .level-fill span.on { background: var(--rose-deep); }

  .btn-primary, .btn-ghost, .btn-link {
    width: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    font-family: var(--font-body);
    font-size: 0.9375rem;
    font-weight: 600;
    border-radius: 8px;
    padding: 0.85rem 1.3rem;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }
  .btn-primary {
    letter-spacing: 0.01em;
    background: var(--anthrazit);
    color: var(--warmweiss);
    border: none;
    transition: transform .1s ease, opacity .15s ease;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary[disabled] { opacity: 0.35; cursor: not-allowed; }

  .btn-ghost {
    font-weight: 500;
    background: transparent;
    color: var(--text-soft);
    border: 1.5px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--border-strong); color: var(--text); }

  .btn-link {
    background: transparent;
    color: var(--rose-deep);
    border: 1.5px solid var(--rose-deep);
  }
  .btn-link:hover { background: var(--rose-pale); }

  .welcome-title {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--text);
    text-align: center;
    margin: 0 0 1.6rem;
  }

  .stack {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  .stack-btn {
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
    background: var(--surface-raised);
    color: var(--text);
    border: 1.5px solid var(--border-strong);
    border-radius: 12px;
    padding: 1.1rem 1rem;
    cursor: pointer;
    transition: border-color .15s ease, background-color .15s ease, transform .1s ease;
  }
  .stack-btn:hover { border-color: var(--rose-deep); }
  .stack-btn:active { transform: scale(0.99); }
  .stack-btn.primary {
    background: var(--rose-pale);
    border-color: var(--rose-deep);
    color: var(--rose-deep);
  }
  .stack-btn[disabled] {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .stack-btn .hint {
    display: block;
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--text-soft);
    margin-top: 0.15rem;
  }

  .footer-actions {
    margin-top: auto;
    padding-top: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    flex-shrink: 0;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.35rem 0.7rem;
    border-radius: 999px;
    width: fit-content;
  }
  .badge.gruen { background: rgba(82,112,79,0.14); color: var(--good); }
  .badge.gelb { background: rgba(169,122,46,0.14); color: var(--warn); }
  .badge.rot { background: rgba(166,71,62,0.14); color: var(--danger); }
  .badge .dot2 { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .text-input {
    font-family: var(--font-body);
    font-size: 1rem;
    padding: 0.85rem 1rem;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--surface-raised);
    color: var(--text);
    width: 100%;
    max-width: 22rem;
  }
  .text-input:focus { outline: 2px solid var(--rose-deep); outline-offset: 1px; }

  .avatar-row { display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center; }
  .avatar-card {
    width: 108px;
    display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    background: transparent; border: none; cursor: pointer; font-family: var(--font-body);
  }
  .avatar-circle {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--surface-raised);
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 1.4rem; color: var(--rose-deep);
    transition: border-color .15s ease, transform .15s ease;
    overflow: hidden;
  }
  .avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-card:hover .avatar-circle { border-color: var(--rose-deep); transform: translateY(-2px); }
  .avatar-name { font-size: 0.8125rem; color: var(--text); }

  .summary-list { display: flex; flex-direction: column; gap: 0.55rem; margin: 0 0 1rem; }
  .summary-row {
    display: flex; justify-content: space-between; gap: 1rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.875rem;
  }
  .summary-row .k { color: var(--text-soft); }
  .summary-row .v { color: var(--text); font-weight: 600; text-align: right; }

  .rec-card {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .rec-kicker { font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rose-deep); }
  .rec-name { font-family: var(--font-display); font-size: 1.15rem; color: var(--text); }
  .rec-toggle {
    display: flex; gap: 0.4rem; margin-top: 0.2rem;
  }
  .rec-toggle button {
    font-family: var(--font-body);
    font-size: 0.75rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-soft);
    border-radius: 999px;
    padding: 0.3rem 0.7rem;
    cursor: pointer;
  }
  .rec-toggle button.active { background: var(--anthrazit); color: var(--warmweiss); border-color: var(--anthrazit); }

  .product-search { margin-top: 0.3rem; padding-top: 0.6rem; border-top: 1px solid var(--border); }
  .product-search .text-input { font-size: 0.875rem; padding: 0.55rem 0.7rem; }
  .product-results { display: flex; flex-direction: column; gap: 0.15rem; margin-top: 0.4rem; max-height: 220px; overflow-y: auto; }
  .product-result {
    display: flex; justify-content: space-between; align-items: center; gap: 0.6rem;
    width: 100%; text-align: left;
    font-family: var(--font-body); font-size: 0.8125rem; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.5rem 0.65rem; cursor: pointer;
  }
  .product-result:hover, .product-result:focus { border-color: var(--rose-deep); background: var(--surface-raised); }
  .product-result span:first-child { flex: 1; }

  .blueprint-hero {
    font-family: var(--font-display);
    font-size: 2rem;
    font-style: italic;
    color: var(--anthrazit);
    margin: 0.2rem 0 0.1rem;
    text-wrap: balance;
  }
  .divider { height: 1px; background: var(--border-strong); margin: 1.1rem 0; border: none; }

  .routine-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
  .kur-warning {
    background: rgba(169,122,46,0.12);
    color: var(--warn);
    border: 1px solid rgba(169,122,46,0.3);
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
    font-size: 0.8125rem;
    margin: 0.6rem 0 0;
  }
  .routine-col h3 { font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--rose-deep); margin: 0 0 0.5rem; }
  .routine-col ol { margin: 0; padding-left: 1.1rem; font-size: 0.875rem; color: var(--text); display: flex; flex-direction: column; gap: 0.3rem; }

  .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; flex: 1; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2.5px solid var(--border);
    border-top-color: var(--rose-deep);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
    * { transition-duration: 0.01ms !important; }
  }

  @media (max-width: 640px) {
    html { font-size: 17.5px; }
    .content { padding: 0.5rem 1.2rem 1.6rem; }
    .grid.cols-3, .grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
    .routine-cols { grid-template-columns: 1fr; }
    .topbar-logo { height: 57px; }
    .back-btn { width: 34px; height: 34px; }
    .step-label { font-size: 0.8125rem; }
    .context-label { font-size: 0.75rem; }
    .brand-logo.lg { height: 138px; }
    .brand-logo.md { height: 102px; }
  }

  /* iPad Pro & größere Tablets (Höhe mitgeprüft, damit ein Iphone im Querformat nicht
     mit hineinfällt): größere Grundschrift skaliert alle rem-Maße automatisch mit,
     dazu gezielt größere Touch-Ziele und ein deutlich präsenteres Logo. */
  @media (min-width: 800px) and (min-height: 700px) {
    html { font-size: 19px; }
    .topbar { padding: 1.4rem 1.8rem 0.5rem; gap: 0.9rem; }
    .topbar-logo { height: 78px; }
    .back-btn { width: 40px; height: 40px; font-size: 1.05rem; }
    .stepper { padding: 0.6rem 1.8rem 1.3rem; }
    .stepper .step-dot { width: 12px; height: 12px; }
    .stepper .step-dot.current { width: 17px; height: 17px; }
    .brand-logo.lg { height: 195px; }
    .brand-logo.md { height: 144px; }
    .avatar-card { width: 138px; }
    .avatar-circle { width: 96px; height: 96px; }
    .card .dot { width: 10px; height: 10px; }
  }
</style>

<div class="device"><div class="screen" id="screen"></div></div>

<script>
(function () {
  // ---------- Google Sheet als zentrale Inhaltsquelle ----------
  // Jede URL kommt aus Google Sheets: Datei > Freigeben > Im Web veröffentlichen >
  // gewünschtes Tabellenblatt auswählen > Format "CSV" > Link kopieren.
  // Bleibt ein Feld leer, nutzt der Prototyp die eingebauten Beispieldaten (DEFAULT_*) als Fallback,
  // damit die Demo auch ohne Sheet sofort funktioniert.
  var SHEET_CONFIG = {
    ziele: '',
    painpoints: '',
    anlass: '',
    lifestyle: '',
    sicherheitscheck: '',
    hautanalyse: '',
    beautyneeds: ''
  };

  var DEFAULT_ZIELE = [
    { key: 'glow', label: 'Mehr Feuchtigkeit & Glow' },
    { key: 'juenger', label: 'Jünger & frischer aussehen' },
    { key: 'rein', label: 'Reinere Haut' },
    { key: 'pigment', label: 'Weniger Pigmentflecken' },
    { key: 'sensibel', label: 'Empfindliche Haut beruhigen' },
    { key: 'poren', label: 'Feinere Poren' },
    { key: 'struktur', label: 'Bessere Hautstruktur' },
    { key: 'straffung', label: 'Straffung' },
    { key: 'allgemein', label: 'Allgemeine Hautverbesserung' }
  ];
  var DEFAULT_PAIN_POINTS = [
    { key: 'muede', label: 'Haut sieht müde aus' },
    { key: 'makeup', label: 'Fühlt sich ohne Make-up unwohl' },
    { key: 'spannung', label: 'Spannungsgefühl' },
    { key: 'unreinheiten', label: 'Unreinheiten belasten sie' },
    { key: 'aelter', label: 'Fühlt sich älter' },
    { key: 'unruhig', label: 'Hautbild wirkt unruhig' },
    { key: 'ereignis', label: 'Ein bestimmtes Ereignis steht bevor' }
  ];
  var DEFAULT_ANLASS = [
    { key: 'alltag', label: 'Alltag' },
    { key: 'hochzeit', label: 'Hochzeit' },
    { key: 'urlaub', label: 'Urlaub' },
    { key: 'event', label: 'Event' },
    { key: 'beruflich', label: 'Beruflicher Anlass' },
    { key: 'praevention', label: 'Prävention' },
    { key: 'langfristig', label: 'Langfristige Verbesserung' }
  ];
  var DEFAULT_LIFESTYLE_ITEMS = [
    { key: 'sonnenschutz', frage: 'Nutzt die Kundin täglich Sonnenschutz?', type: 'yesno' },
    { key: 'routine', frage: 'Hat sie aktuell eine feste Pflegeroutine?', type: 'yesno' },
    { key: 'stress', frage: 'Wie hoch ist ihr aktuelles Stresslevel?', type: 'scale3', options: ['Niedrig', 'Mittel', 'Hoch'] },
    { key: 'schlaf', frage: 'Wie ist ihre Schlafqualität?', type: 'scale3', options: ['Gut', 'Wechselhaft', 'Schlecht'] },
    { key: 'trinkmenge', frage: 'Trinkt sie ausreichend Wasser am Tag?', type: 'yesno' },
    { key: 'sonne', frage: 'Ist sie regelmäßig starker Sonne ausgesetzt?', type: 'yesno' },
    { key: 'rauchen', frage: 'Raucht die Kundin?', type: 'yesno' },
    { key: 'vorbehandlungen', frage: 'Gab es bereits professionelle Behandlungen?', type: 'yesno' }
  ];
  var DEFAULT_SAFETY_ITEMS = [
    { key: 'schwanger', frage: 'Schwangerschaft oder Stillzeit?', risk: 'rot',
      hinweis: 'Viele Wirkstoffe (z. B. Fruchtsäure, Retinoide) und Geräte (z. B. Radiofrequenz, Laser) sind in Schwangerschaft/Stillzeit nicht freigegeben.' },
    { key: 'medikamente', frage: 'Einnahme bestimmter Medikamente?', risk: 'gelb',
      hinweis: 'Manche Medikamente (z. B. Blutverdünner, Retinoide, Antibiotika) verändern die Verträglichkeit einzelner Behandlungen.' },
    { key: 'allergien', frage: 'Bekannte Allergien?', risk: 'gelb',
      hinweis: 'Prüfen, ob verwendete Inhaltsstoffe oder Produkte die genannte Allergie betreffen könnten.' },

  // ---------- CSV laden & parsen ----------
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
        } else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
      } else field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    if (!rows.length) return [];
    var headers = rows[0].map(function (h) { return h.trim(); });
    return rows.slice(1).filter(function (r) { return r.some(function (v) { return v.trim() !== ''; }); }).map(function (r) {
      var obj = {};
      headers.forEach(function (h, i) { obj[h] = (r[i] || '').trim(); });
      return obj;
    });
  }

  function isActive(row) {
    var v = (row.aktiv || '').toLowerCase();
    return v === '' || v === 'ja' || v === 'true' || v === '1' || v === 'yes';
  }

  function fetchSheet(url) {
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    }).then(parseCSV);
  }

  function renderAnlass() {

      '<p class="eyebrow">Anlass & Zeitrahmen</p>' +

  function renderYesNoStep(prefix, items, phase, title) {
    var idx = currentFlowScreen(prefix);

    var current = STATE[prefix][item.key];

    if (item.type === 'yesno') {

          var sel = current === opt;

    screenWrap('neutral', phasePercent(phase, idx, items.length), contextLabel(), body, true);
  }

  function computeRiskDetails() {
    var maxRisk = 'gruen';
    var triggers = [];
    SAFETY_ITEMS.forEach(function (it) {
      if (STATE.sicherheit[it.key] === 'Ja') {
        triggers.push(it);
        if (it.risk === 'rot') maxRisk = 'rot';
        else if (it.risk === 'gelb' && maxRisk !== 'rot') maxRisk = 'gelb';
      }
    });
    triggers.sort(function (a, b) { return (a.risk === 'rot' ? 0 : 1) - (b.risk === 'rot' ? 0 : 1); });
    return { level: maxRisk, triggers: triggers };
  }

  var RISK_EXPLAIN = {
    gruen: 'Keiner der geprüften Punkte wurde bejaht. Die Behandlung kann wie geplant vorbereitet werden.',
    gelb: 'Mindestens ein Punkt erfordert deine fachliche Einschätzung, bevor du die Behandlung bestätigst — sieh dir die Gründe unten an und entscheide, ob die Behandlung wie geplant, angepasst oder verschoben werden sollte.',
    rot: 'Mindestens ein Ausschlusskriterium liegt vor. Diese Behandlung darf ohne Rücksprache (z. B. mit der Studioleitung) nicht automatisch freigegeben werden.'
  };

  function renderSicherheitSummary() {
    var d = computeRiskDetails();
    var label = { gruen: 'Grundsätzlich geeignet', gelb: 'Fachlich prüfen', rot: 'Keine automatische Freigabe' }[d.level];
    var body = '' +
      '<p class="eyebrow">Sicherheitscheck · Ergebnis</p>' +
      '<h1 class="q">Sicherheitsstufe</h1>' +
      '<div class="badge ' + d.level + '"><span class="dot2"></span>' + label + '</div>' +
      '<p class="sub" style="margin-top:.9rem">' + RISK_EXPLAIN[d.level] + '</p>' +
      (d.triggers.length ? '<div class="summary-list" style="margin-top:.5rem">' +
        d.triggers.map(function (t) {
          return '<div class="summary-row" style="align-items:flex-start;flex-direction:column;gap:.25rem">' +
            '<span class="badge ' + t.risk + '" style="margin:0"><span class="dot2"></span>' + esc(t.frage) + '</span>' +
            '<span class="k" style="font-size:.8125rem">' + esc(t.hinweis || '') + '</span>' +
          '</div>';
        }).join('') +
      '</div>' : '') +
      '<p class="sub" style="margin-top:1rem;">Die endgültige Entscheidung bleibt bei dir — das System schlägt nur vor.</p>' +
      '<div class="footer-actions">' +
        '<button class="btn-primary" onclick="__bb.goTo(\'analyse:0\')">Weiter zur Hautanalyse</button>' +
      '</div>';
    screenWrap('neutral', phasePercent('sicherheit'), contextLabel(), body, true);
  }

  function renderAnalyseStep() {
    var idx = currentFlowScreen('analyse');
    var item = ANALYSE_ITEMS[idx];
    var current = STATE.analyse[item.key];
    var body = '' +
      '<p class="eyebrow">Fachanalyse · ' + (idx + 1) + ' von ' + ANALYSE_ITEMS.length + '</p>' +
      '<h2 class="q">' + item.label + '</h2>' +
      '<div class="scale4">' +
      SCALE4_LABELS.map(function (lbl, i) {
        var sel = current === i;
        var dots = '';
        for (var d = 0; d < 4; d++) dots += '<span class="' + (d <= i ? 'on' : '') + '"></span>';
        return '<button class="card' + (sel ? ' selected' : '') + '" onclick="__bb.select(\'analyse\',\'' + item.key + '\',' + i + ')">' +
          '<div class="level-fill">' + dots + '</div><span>' + lbl + '</span></button>';
      }).join('') +
      '</div>';
    screenWrap('neutral', phasePercent('analyse', idx, ANALYSE_ITEMS.length), contextLabel(), body, true);
  }

  function renderAuswertung() {
    screenWrap('dezent', phasePercent('ergebnis', 0, 5), contextLabel(),
      '<div class="loading-wrap"><div class="spinner"></div><p style="font-size:.875rem;color:var(--text-soft)">Strategie wird erstellt …</p></div>', true);
    setTimeout(function () { if (path[pointer] === 'auswertung') goTo('strategy'); }, 1400);
  }

  function computeNeeds() {
    var scores = {};
    ANALYSE_ITEMS.forEach(function (it) {
      var v = STATE.analyse[it.key];
      if (v === undefined) v = 0;
      if (!scores[it.need]) scores[it.need] = { sum: 0, count: 0 };
      scores[it.need].sum += v;
      scores[it.need].count += 1;
    });
    var arr = Object.keys(scores).map(function (need) {
      return { need: need, avg: scores[need].sum / scores[need].count };
    });
    arr.sort(function (a, b) { return b.avg - a.avg; });
    return arr;
  }

  function bookingCaption() {
    var plan = getPlan();
    var names = [displayInfo(plan.phase1).behandlung];
    if (plan.phase2) names.push(displayInfo(plan.phase2).behandlung);
    return '<p class="sub" style="margin:1.1rem 0 .5rem">Termin buchen für: ' + esc(names.join(' + ')) + '</p>';
  }

  function bookingButton() {
    return '<a class="btn-link" href="' + BOOKING_URL + '" target="_blank" rel="noopener noreferrer">Termin online buchen ↗</a>';
  }

  // Öffnet das lokale Mailprogramm mit vorausgefüllter Zusammenfassung (mailto:) —
  // die Mitarbeiterin sieht die E-Mail vor dem Versand und kann Empfänger/Text noch anpassen.
  // Kein automatischer Versand im Hintergrund.
  function emailSummaryHref() {
    var plan = getPlan();
    var i1 = displayInfo(plan.phase1);
    var i2 = plan.phase2 ? displayInfo(plan.phase2) : i1;
    var lines = [
      'Beauty Blueprint — ' + (STATE.kundeName || 'Kundin'),
      'Mitarbeiterin: ' + (STATE.mitarbeiterin || ''),
      '',
      'Kundenziel: ' + zielText(),
      'Programm: ' + plan.family.name,
      '',
      'Phase 1 · Jetzt: ' + treatLine(i1),
      '  Begründung: ' + needReason(plan.phase1.need)
    ];
    if (plan.phase2) {
      lines.push('Phase 2 · Nächster Schritt: ' + treatLine(i2));
      lines.push('  Begründung: ' + needReason(plan.phase2.need));
    }
    if (plan.watch) {
      lines.push('Ebenfalls beobachten: ' + treatLine(displayInfo(plan.watch)));
    }
    lines.push('');
    lines.push('6-Monats-Kurplan:');
    kurDefaultSlots(plan).forEach(function (baseInfo, idx) {
      var info = kurInfoFor(idx, baseInfo);
      lines.push('  Monat ' + (idx + 1) + ': ' + (info ? treatLine(info) : 'entfernt'));
    });
    lines.push('');
    var homeAM = homecareInfoFor('am', i1);
    var homePM = homecareInfoFor('pm', i2);
    var reinigungLine = optionalProductLine('reinigung') || 'Reinigung';
    if (homeAM) lines.push('Homecare morgens: ' + reinigungLine + ', ' + productLine(homeAM) + ', Tagespflege, SPF');
    if (homePM) lines.push('Homecare abends: ' + reinigungLine + ', ' + productLine(homePM) + ', Serum, Nachtpflege');
    if (!homeAM && !homePM) lines.push('Homecare: von der Mitarbeiterin entfernt');
    if (optionalProductLine('peeling')) lines.push('Peeling (1-2x/Woche): ' + optionalProductLine('peeling'));
    if (optionalProductLine('maske')) lines.push('Maske (1-2x/Woche): ' + optionalProductLine('maske'));
    lines.push('');
    lines.push('Nächster Checkpoint: in 4 Wochen');
    lines.push('Termin buchen: ' + BOOKING_URL);
    var body = lines.join('\n');
    var subject = 'Beauty Blueprint — ' + (STATE.kundeName || 'Kundin');
    return 'mailto:info@epoxidwelt.de?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  }

  function treatLine(info) {
    var extra = [info.dauer, info.preis].filter(Boolean).join(' · ');
    return extra ? info.behandlung + ' (' + extra + ')' : info.behandlung;
  }

  function productLine(info) {
    return info.produktpreis ? info.product + ' (' + info.produktpreis + ')' : info.product;
  }

  function needReason(needName) {
    var parts = ANALYSE_ITEMS.filter(function (it) { return it.need === needName; }).map(function (it) {
      var v = STATE.analyse[it.key];
      if (!v) return null;
      return it.label + ' (' + SCALE4_LABELS[v] + ')';
    }).filter(Boolean);
    return parts.length ? parts.join(', ') : 'Geringe Ausprägung, aber relativ höchste Priorität';
  }

  function familyFor(needName) {
    return PROGRAM_FAMILIES.filter(function (f) { return f.needs.indexOf(needName) > -1; })[0] ||
      { name: needName, needs: [needName] };
  }

  // Baut einen Behandlungsplan: Phase 1 (Hauptpriorität) und, falls die zweit-/dritthöchste
  // Priorität fachlich zum selben Programm gehört, Phase 2 daraus — statt drei unabhängig
  // gerankte Needs zu unabhängigen Behandlungen zu verknüpfen. Eine Priorität außerhalb des
  // Programms wird ehrlich als separater Beobachtungspunkt markiert, nicht als "Alternative"
  // in eine falsche Reihenfolge gepresst.
  function computeProgram() {
    var needs = computeNeeds();
    var top1 = needs[0];
    if (!top1) top1 = { need: 'Hydration', avg: 0 };
    var family = familyFor(top1.need);

    // Phase 1 ist immer die höchste Priorität (Anker), auch wenn noch nichts beobachtet wurde
    // (Fallback-Fall). Phase 2 und "Ebenfalls beobachten" dürfen dagegen NUR erscheinen, wenn
    // in der Hautanalyse tatsächlich etwas dafür beobachtet wurde (avg > 0) — sonst würde eine
    // zweite Behandlung/ein Produkt allein deshalb empfohlen, weil es zufällig zur selben
    // Programm-Familie gehört, ohne jeden Beleg in den Antworten der Mitarbeiterin.
    var phase2 = needs.filter(function (n) {
      return n.need !== top1.need && family.needs.indexOf(n.need) > -1 && n.avg > 0;
    })[0] || null;

    var watch = needs.filter(function (n) {
      return family.needs.indexOf(n.need) === -1 && n.avg > 0;
    })[0] || null;

    return { family: family, phase1: top1, phase2: phase2, watch: watch };
  }

  var REPLACED_LABEL = 'Individuell angepasst (auf Wunsch der Mitarbeiterin ausgetauscht)';

  // Ab hier zählt nicht mehr die reine Analyse, sondern das, was auf dem Empfehlungen-Screen
  // tatsächlich entschieden wurde (STATE.rec) — sonst würden Blueprint/E-Mail/Buchung eine
  // Behandlung zeigen, die die Mitarbeiterin dort bereits entfernt oder ausgetauscht hat.
  function displayInfo(slot) {
    if (!slot) return null;
    if (slot.replaced) return { behandlung: REPLACED_LABEL, dauer: '', preis: '', product: REPLACED_LABEL, produktpreis: '' };
    return slot.info;
  }

  function getPlan() {
    var p = computeProgram();
    function slot(key, needObj) {
      if (!needObj) return null;
      var st = STATE.rec[key];
      if (st === 'entfernt') return null;
      return { need: needObj.need, info: NEED_INFO[needObj.need], replaced: st === 'ersetzt' };
    }
    var phase1 = slot('phase1', p.phase1);
    var phase2 = slot('phase2', p.phase2);
    var watch = slot('watch', p.watch);
    // Phase 1 trägt die gesamte Strategie (Programmname, Homecare) — bei "entfernt" wird die
    // nächstbeste noch aktive Priorität nachgerückt, statt einen leeren Plan zu zeigen.
    if (!phase1) {
      if (phase2) { phase1 = phase2; phase2 = null; }
      else if (watch) { phase1 = watch; watch = null; }
      else phase1 = { need: p.phase1.need, info: NEED_INFO[p.phase1.need], replaced: false };
    }
    return { family: p.family, phase1: phase1, phase2: phase2, watch: watch };
  }

  // Löst den tatsächlich anzuzeigenden Homecare-Eintrag für "am" (morgens) oder
  // "pm" (abends) auf: entfernt -> null, von der Mitarbeiterin ausgewählt -> dieses
  // Produkt, sonst der System-Vorschlag (baseInfo, z.B. aus NEED_INFO).
  function homecareInfoFor(slot, baseInfo) {
    var s = STATE.rec.homecare[slot];
    if (s.status === 'entfernt') return null;
    if (s.product) return { product: s.product.name, produktpreis: s.product.preis };
    return baseInfo;
  }

  // Für die optionalen Homecare-Schritte (Reinigung/Peeling/Maske) ohne Systemvorschlag:
  // gibt die formatierte Produktzeile zurück, oder null wenn nichts ausgewählt wurde.
  function optionalProductLine(slot) {
    var p = STATE.rec.homecare[slot].product;
    return p ? productLine({ product: p.name, produktpreis: p.preis }) : null;
  }

  // 6-Monats-Kurplan: die Hauptbehandlung (Phase 1) bildet das Rückgrat, an zwei Terminen
  // (Monat 3 und 6) wird zur Auflockerung die Phase-2- bzw. "Ebenfalls beobachten"-Behandlung
  // vorgeschlagen — angelehnt an echte Studiolution-Kur-Pakete (z. B. ASA-Kur), aber weiterhin
  // individuell auf die Hautanalyse der Kundin bezogen. Jeder Termin bleibt einzeln editierbar.
  var KUR_MONTHS = 6;
  var KUR_ALT_POSITIONS = [2, 5];

  function kurDefaultSlots(plan) {
    var i1 = displayInfo(plan.phase1);
    var i2 = plan.phase2 ? displayInfo(plan.phase2) : (plan.watch ? displayInfo(plan.watch) : i1);
    var slots = [];
    for (var m = 0; m < KUR_MONTHS; m++) {
      slots.push(KUR_ALT_POSITIONS.indexOf(m) > -1 ? i2 : i1);
    }
    return slots;
  }

  function kurInfoFor(idx, baseInfo) {
    var s = STATE.rec.kur[idx];
    if (s.status === 'entfernt') return null;
    if (s.override) return { behandlung: s.override.name, dauer: s.override.dauer, preis: s.override.preis };
    return baseInfo;
  }

  // Alle Beauty-Needs, für die in der Hautanalyse tatsächlich etwas beobachtet wurde (avg > 0),
  // als priorisierte Liste geeigneter Behandlungen — Grundlage für die Schnellauswahl im
  // Kurplan, damit die Mitarbeiterin nicht erst tippen muss, um die passenden Optionen zu sehen.
  function rankedTreatmentOptions() {
    return computeNeeds().filter(function (n) { return n.avg > 0; }).map(function (n, i) {
      var info = NEED_INFO[n.need];
      return { prio: i + 1, need: n.need, behandlung: info.behandlung, dauer: info.dauer, preis: info.preis };
    });
  }

  // ASA Peel Fruchtsäure darf laut Studiolution-Kur-Konzept nur einmalig oder als direkt
  // aufeinanderfolgende 3er-Kur eingeplant werden (siehe "ASA Fruchtsäure KUR" im Katalog).
  function isAsaPeel(name) {
    var n = (name || '').toLowerCase();
    return n.indexOf('asa') > -1 && n.indexOf('peel') > -1 && n.indexOf('kur') === -1;
  }

  function kurAsaWarning(kurSlots) {
    var idxs = [];
    kurSlots.forEach(function (baseInfo, idx) {
      var info = kurInfoFor(idx, baseInfo);
      if (info && isAsaPeel(info.behandlung)) idxs.push(idx);
    });
    if (idxs.length <= 1) return null;
    var monthsText = idxs.map(function (i) { return i + 1; }).join(', ');
    if (idxs.length === 3 && idxs[2] - idxs[0] === 2) return null;
    return idxs.length === 3
      ? 'ASA Peel Fruchtsäure ist 3x eingeplant (Monat ' + monthsText + '), aber nicht direkt hintereinander. Als 3er-Kur sollte sie ohne Unterbrechung stattfinden.'
      : 'ASA Peel Fruchtsäure ist ' + idxs.length + 'x eingeplant (Monat ' + monthsText + '). Sie ist nur als Einzelbehandlung oder als direkt aufeinanderfolgende 3er-Kur vorgesehen.';
  }

  function zielText() {
    if (!STATE.ziel.length) return 'Allgemeine Hautverbesserung';
    return STATE.ziel.map(function (k) {
      var z = ZIELE.filter(function (z) { return z.key === k; })[0];
      return z ? z.label : k;
    }).join(', ');
  }

  function renderStrategy() {
    var p = computeProgram();
    var body = '' +
      '<p class="eyebrow">Beauty Strategy</p>' +
      '<h1 class="q">Die fachliche Strategie</h1>' +
      '<div class="summary-list">' +
        '<div class="summary-row"><span class="k">Kundenziel</span><span class="v">' + esc(zielText()) + '</span></div>' +
        '<div class="summary-row"><span class="k">Programm</span><span class="v">' + esc(p.family.name) + '</span></div>' +
        '<div class="summary-row"><span class="k">Hauptpriorität</span><span class="v">' + (p.phase1 ? esc(p.phase1.need) : '—') + '</span></div>' +
        (p.phase2 ? '<div class="summary-row"><span class="k">Zweite Priorität (im Programm)</span><span class="v">' + esc(p.phase2.need) + '</span></div>' : '') +
        (p.watch ? '<div class="summary-row"><span class="k">Ebenfalls beobachten</span><span class="v">' + esc(p.watch.need) + '</span></div>' : '') +
      '</div>' +
      '<p class="sub">Begründung Hauptpriorität: ' + esc(needReason(p.phase1 ? p.phase1.need : 'Hydration')) + '</p>' +
      '<div class="footer-actions">' +
        '<button class="btn-primary" onclick="__bb.goTo(\'empfehlungen\')">Weiter zu den Empfehlungen</button>' +
      '</div>';
    screenWrap('dezent', phasePercent('ergebnis', 2, 5), contextLabel(), body);
  }

  function renderEmpfehlungen() {
    var p = computeProgram();
    var i1 = NEED_INFO[p.phase1.need];
    var i2 = p.phase2 ? NEED_INFO[p.phase2.need] : null;
    var iw = p.watch ? NEED_INFO[p.watch.need] : null;

    function phaseCard(kicker, title, needName, info, key) {
      var st = STATE.rec[key];
      return '<div class="rec-card">' +
        '<span class="rec-kicker">' + kicker + '</span>' +
        '<span class="rec-name" style="' + (st === 'entfernt' ? 'text-decoration:line-through;opacity:.5' : '') + '">' + esc(info.behandlung) + '</span>' +
        '<span style="font-size:.8125rem;color:var(--text-soft)">' + esc([info.dauer, info.preis].filter(Boolean).join(' · ')) + '</span>' +
        '<p class="sub" style="margin:0;font-size:.8125rem">' + esc(title) + ' · ' + esc(needReason(needName)) + '</p>' +
        '<div class="rec-toggle">' +
          '<button class="' + (st === 'aktiv' ? 'active' : '') + '" onclick="__bb.select(\'rec-toggle\',\'' + key + '\')">' + (st === 'aktiv' ? 'Übernommen' : st === 'ersetzt' ? 'Ausgetauscht' : 'Entfernt') + '</button>' +
        '</div></div>';
    }

    // Homecare-Produkt für Morgens/Abends: das System schlägt das zur Priorität passende
    // Produkt schon vor (baseInfo), die Mitarbeiterin kann es aber über die Suche gegen
    // jedes der 364 echten KLAPP-Produkte austauschen oder den Schritt ganz entfernen.
    function homecareSlotCard(slot, label, baseInfo) {
      var s = STATE.rec.homecare[slot];
      var removed = s.status === 'entfernt';
      var display = s.product ? { product: s.product.name, produktpreis: s.product.preis } : baseInfo;
      return '<div class="rec-card">' +
        '<span class="rec-kicker">Homecare · ' + label + '</span>' +
        '<span class="rec-name" style="' + (removed ? 'text-decoration:line-through;opacity:.5' : '') + '">' + esc(productLine(display)) + '</span>' +
        (s.product && !removed ? '<p class="sub" style="margin:0;font-size:.75rem">Von dir ausgewählt — <a href="#" onclick="__bb.select(\'homecare-reset-product\',\'' + slot + '\');return false;" style="color:var(--rose-deep)">Systemvorschlag verwenden</a></p>' : '') +
        '<div class="rec-toggle" style="flex-wrap:wrap">' +
          (removed ? '' : '<button onclick="__bb.select(\'homecare-toggle-search\',\'' + slot + '\')">' + (s.searchOpen ? 'Suche schließen' : 'Anderes Produkt wählen') + '</button>') +
          '<button class="' + (removed ? '' : 'active') + '" onclick="__bb.select(\'homecare-toggle-status\',\'' + slot + '\')">' + (removed ? 'Entfernt — wiederherstellen' : 'Übernommen') + '</button>' +
        '</div>' +
        (s.searchOpen && !removed ?
          '<div class="product-search">' +
            '<input type="text" class="text-input" placeholder="Produkt suchen …" oninput="__bb.filterProducts(\'' + slot + '\', this.value)" />' +
            '<div class="product-results" id="product-results-' + slot + '"></div>' +
          '</div>' : '') +
      '</div>';
    }

    // Optionale Homecare-Schritte (Reinigung/Peeling/Maske) ohne Systemvorschlag: die
    // Mitarbeiterin wählt selbst, ob und welches Produkt für diesen Schritt gebraucht wird.
    function homecareOptionalCard(slot, label) {
      var s = STATE.rec.homecare[slot];
      var has = !!s.product;
      return '<div class="rec-card">' +
        '<span class="rec-kicker">Homecare · ' + label + '</span>' +
        (has ? '<span class="rec-name">' + esc(productLine({ product: s.product.name, produktpreis: s.product.preis })) + '</span>'
             : '<p class="sub" style="margin:0;font-size:.875rem">Nicht ausgewählt · optional</p>') +
        '<div class="rec-toggle" style="flex-wrap:wrap">' +
          '<button onclick="__bb.select(\'homecare-toggle-search\',\'' + slot + '\')">' + (s.searchOpen ? 'Suche schließen' : (has ? 'Produkt ändern' : 'Produkt hinzufügen')) + '</button>' +
          (has ? '<button onclick="__bb.select(\'homecare-reset-product\',\'' + slot + '\')">Entfernen</button>' : '') +
        '</div>' +
        (s.searchOpen ?
          '<div class="product-search">' +
            '<input type="text" class="text-input" placeholder="Produkt suchen …" oninput="__bb.filterProducts(\'' + slot + '\', this.value)" />' +
            '<div class="product-results" id="product-results-' + slot + '"></div>' +
          '</div>' : '') +
      '</div>';
    }

    // 6-Monats-Kurplan: ein Termin pro Monat, Vorschlag aus kurDefaultSlots() (Hauptbehandlung
    // + zwei Auflockerungs-Termine). Beim Öffnen der Suche stehen zuerst die priorisierten,
    // zur Hautanalyse passenden Behandlungen als Ein-Klick-Optionen bereit; alternativ frei
    // aus allen 152 echten Studiolution-Behandlungen tippen.
    function kurSlotCard(idx, baseInfo, ranked) {
      var s = STATE.rec.kur[idx];
      var removed = s.status === 'entfernt';
      var display = s.override ? { behandlung: s.override.name, dauer: s.override.dauer, preis: s.override.preis } : baseInfo;
      return '<div class="rec-card">' +
        '<span class="rec-kicker">Monat ' + (idx + 1) + '</span>' +
        '<span class="rec-name" style="' + (removed ? 'text-decoration:line-through;opacity:.5' : '') + '">' + esc(display.behandlung) + '</span>' +
        '<span style="font-size:.8125rem;color:var(--text-soft)">' + esc([display.dauer, display.preis].filter(Boolean).join(' · ')) + '</span>' +
        (s.override && !removed ? '<p class="sub" style="margin:0;font-size:.75rem">Von dir ausgewählt — <a href="#" onclick="__bb.select(\'kur-reset-treatment\',' + idx + ');return false;" style="color:var(--rose-deep)">Systemvorschlag verwenden</a></p>' : '') +
        '<div class="rec-toggle" style="flex-wrap:wrap">' +
          (removed ? '' : '<button onclick="__bb.select(\'kur-toggle-search\',' + idx + ')">' + (s.searchOpen ? 'Suche schließen' : 'Anderes Programm wählen') + '</button>') +
          '<button class="' + (removed ? '' : 'active') + '" onclick="__bb.select(\'kur-toggle-status\',' + idx + ')">' + (removed ? 'Entfernt — wiederherstellen' : 'Übernommen') + '</button>' +
        '</div>' +
        (s.searchOpen && !removed ?
          '<div class="product-search">' +
            (ranked.length ? '<p class="sub" style="margin:0 0 .35rem;font-size:.75rem">Passende Optionen (nach Priorität):</p>' +
              '<div class="product-results">' +
                ranked.map(function (r, i) {
                  return '<button type="button" class="product-result" onclick="__bb.pickKurOption(' + idx + ',' + i + ')">' +
                    '<span>Prio ' + r.prio + ' · ' + esc(r.behandlung) + '</span><span class="k" style="font-size:.75rem">' + esc([r.dauer, r.preis].filter(Boolean).join(' · ')) + '</span></button>';
                }).join('') +
              '</div>' : '') +
            '<input type="text" class="text-input" placeholder="Oder andere Behandlung suchen …" style="margin-top:.5rem" oninput="__bb.filterTreatments(' + idx + ', this.value)" />' +
            '<div class="product-results" id="treatment-results-' + idx + '"></div>' +
          '</div>' : '') +
      '</div>';
    }

    var kurSlots = kurDefaultSlots(getPlan());
    var ranked = rankedTreatmentOptions();
    RANKED_TREATMENTS = ranked;
    var asaWarning = kurAsaWarning(kurSlots);

    var body = '' +
      '<p class="eyebrow">Empfehlungen · Programm: ' + esc(p.family.name) + '</p>' +
      '<h1 class="q">Behandlungsplan zur Prüfung</h1>' +
      '<p class="sub">Antippen wechselt zwischen Übernehmen / Austauschen / Entfernen.</p>' +
      '<h3 class="section-label">Behandlungen</h3>' +
      '<div class="grid cols-2">' +
        phaseCard('Phase 1 · Jetzt', 'Hauptpriorität', p.phase1.need, i1, 'phase1') +
        (p.phase2 ? phaseCard('Phase 2 · Nächster Schritt', 'Im selben Programm', p.phase2.need, i2, 'phase2') : '') +
        (p.watch ? phaseCard('Ebenfalls beobachten', 'Separates Thema, nicht Teil dieses Programms', p.watch.need, iw, 'watch') : '') +
      '</div>' +
      (ranked.length ? '<p class="sub" style="margin-top:.6rem">Alle passenden Behandlungen zur aktuellen Hautanalyse, priorisiert: ' +
        ranked.map(function (r) { return 'Prio ' + r.prio + ' ' + esc(r.behandlung); }).join(' · ') + '</p>' : '') +
      '<h3 class="section-label">6-Monats-Kurplan</h3>' +
      '<p class="sub" style="margin-top:-.4rem">Ein Termin pro Monat — Hauptbehandlung als Rückgrat, an zwei Terminen zur Auflockerung die zweite Priorität. Struktur, Häufigkeit und Reihenfolge frei anpassbar.</p>' +
      (asaWarning ? '<div class="kur-warning">⚠ ' + esc(asaWarning) + '</div>' : '') +
      '<div class="grid cols-3">' +
        kurSlots.map(function (info, idx) { return kurSlotCard(idx, info, ranked); }).join('') +
      '</div>' +
      '<h3 class="section-label">Homecare-Produkte</h3>' +
      '<p class="sub" style="margin-top:-.4rem">Vorschlag passend zur Priorität — bei Bedarf über die Suche austauschen. Reinigung, Peeling und Maske sind optional.</p>' +
      '<div class="grid cols-2">' +
        homecareSlotCard('am', 'Morgens', i1) +
        homecareSlotCard('pm', 'Abends', i2 || i1) +
        homecareOptionalCard('reinigung', 'Reinigung') +
        homecareOptionalCard('peeling', 'Peeling') +
        homecareOptionalCard('maske', 'Maske') +
      '</div>' +
      '<div class="footer-actions">' +
        '<button class="btn-primary" onclick="__bb.goTo(\'blueprint\')">Beauty Blueprint erstellen</button>' +
      '</div>';
    screenWrap('dezent', phasePercent('ergebnis', 3, 5), contextLabel(), body);
  }

  function renderBlueprint() {
    var plan = getPlan();
    var i1 = displayInfo(plan.phase1);
    var i2 = plan.phase2 ? displayInfo(plan.phase2) : i1;
    var homeAM = homecareInfoFor('am', i1);
    var homePM = homecareInfoFor('pm', i2);
    var homecareRow = !homeAM && !homePM ? 'Entfernt' :
      (productLine(homeAM) === productLine(homePM) ? productLine(homeAM) : productLine(homeAM) + ' + ' + productLine(homePM));
    var kurRows = kurDefaultSlots(plan).map(function (baseInfo, idx) {
      var info = kurInfoFor(idx, baseInfo);
      return '<div class="summary-row"><span class="k">Monat ' + (idx + 1) + '</span><span class="v">' + esc(info ? treatLine(info) : 'Entfernt') + '</span></div>';
    }).join('');
    var body = '' +
      '<img class="brand-logo md" src="' + LOGO_SRC + '" alt="Beauty Lounge" />' +
      '<p class="eyebrow" style="text-align:center">Beauty Blueprint</p>' +
      '<p class="blueprint-hero" style="text-align:center">' + esc(STATE.kundeName || 'Kundin') + '</p>' +
      '<p class="sub" style="margin-top:0;text-align:center">' + esc(zielText()) + '</p>' +
      '<hr class="divider"/>' +
      '<div class="summary-list">' +
        '<div class="summary-row"><span class="k">Programm</span><span class="v">' + esc(plan.family.name) + '</span></div>' +
        '<div class="summary-row"><span class="k">Phase 1 · Jetzt</span><span class="v">' + esc(treatLine(i1)) + '</span></div>' +
        (plan.phase2 ? '<div class="summary-row"><span class="k">Phase 2 · Nächster Schritt</span><span class="v">' + esc(treatLine(i2)) + '</span></div>' : '') +
        (plan.watch ? '<div class="summary-row"><span class="k">Ebenfalls beobachten</span><span class="v">' + esc(treatLine(displayInfo(plan.watch))) + '</span></div>' : '') +
        '<div class="summary-row"><span class="k">Nächster Checkpoint</span><span class="v">in 4 Wochen</span></div>' +
        '<div class="summary-row"><span class="k">Homecare</span><span class="v">' + esc(homecareRow) + '</span></div>' +
      '</div>' +
      '<h3 class="section-label">6-Monats-Kurplan</h3>' +
      '<div class="summary-list">' + kurRows + '</div>' +
      (homeAM || homePM ? '' +
        '<h3 class="section-label">Homecare-Routine</h3>' +
        '<div class="routine-cols">' +
          '<div class="routine-col"><h3>Morgens</h3><ol><li>' + esc(optionalProductLine('reinigung') || 'Reinigung') + '</li><li>' + esc(homeAM ? productLine(homeAM) : 'entfernt') + '</li><li>SPF</li></ol></div>' +
          '<div class="routine-col"><h3>Abends</h3><ol><li>' + esc(optionalProductLine('reinigung') || 'Reinigung') + '</li><li>' + esc(homePM ? productLine(homePM) : 'entfernt') + '</li><li>Serum</li></ol></div>' +
          (optionalProductLine('peeling') || optionalProductLine('maske') ?
            '<div class="routine-col"><h3>1-2x wöchentlich</h3><ol>' +
              (optionalProductLine('peeling') ? '<li>Peeling: ' + esc(optionalProductLine('peeling')) + '</li>' : '') +
              (optionalProductLine('maske') ? '<li>Maske: ' + esc(optionalProductLine('maske')) + '</li>' : '') +
            '</ol></div>' : '') +
        '</div>' : '') +
      bookingCaption() +
      '<div class="footer-actions">' +
        bookingButton() +
        '<button class="btn-primary" onclick="__bb.goTo(\'abschluss\')">Freigeben & abschließen</button>' +
      '</div>';
    screenWrap('brand', phasePercent('ergebnis', 4, 5), contextLabel(), body);
  }

  function renderAbschluss() {
    var body = '' +
      '<img class="brand-logo md" src="' + LOGO_SRC + '" alt="Beauty Lounge" />' +
      '<p class="eyebrow" style="text-align:center">Abgeschlossen</p>' +
      '<h1 class="q" style="text-align:center">Beauty Blueprint gespeichert</h1>' +
      '<p class="sub" style="text-align:center">' + esc(STATE.kundeName || 'Die Kundin') + ' erhält ihren persönlichen Plan. Ein Bericht kann optional erstellt werden.</p>' +
      '<div style="text-align:center">' + bookingCaption() + '</div>' +
      '<div class="footer-actions">' +
        bookingButton() +
        '<a class="btn-link" href="' + emailSummaryHref() + '">Per E-Mail versenden ✉</a>' +
        '<button class="btn-ghost" onclick="this.outerHTML=\'<span class=&quot;sub&quot; style=&quot;margin:0&quot;>Bericht vorbereitet ✓</span>\'">Bericht als PDF vorbereiten</button>' +
        '<button class="btn-primary" onclick="__bb.goTo(\'kunde-wahl\')">Neue Beratung starten</button>' +
      '</div>';
    screenWrap('brand', 100, contextLabel(), body, true);
  }

  function render() {
    var id = path[pointer];
    if (id === 'login') return renderLogin();
    if (id === 'kunde-wahl') return renderKundeWahl();
    if (id === 'kunde-bestehend') return renderKundeBestehend();
    if (id === 'kunde-neu') return renderKundeNeu();
    if (id === 'ziel') return renderZiel();
    if (id === 'painpoint') return renderPainpoint();
    if (id === 'anlass') return renderAnlass();
    if (id.indexOf('lifestyle:') === 0) return renderYesNoStep('lifestyle', LIFESTYLE_ITEMS, 'lifestyle', 'Lifestyle & Pflege');
    if (id.indexOf('sicherheit:') === 0) return renderYesNoStep('sicherheit', SAFETY_ITEMS, 'sicherheit', 'Sicherheitscheck');
    if (id === 'sicherheit-summary') return renderSicherheitSummary();
    if (id.indexOf('analyse:') === 0) return renderAnalyseStep();
    if (id === 'auswertung') return renderAuswertung();
    if (id === 'strategy') return renderStrategy();
    if (id === 'empfehlungen') return renderEmpfehlungen();
    if (id === 'blueprint') return renderBlueprint();
    if (id === 'abschluss') return renderAbschluss();
  }

  function renderInitialLoading() {
    var el = document.getElementById('screen');
    el.setAttribute('data-mode', 'brand');
    el.innerHTML = '<div class="content center"><div class="loading-wrap"><div class="spinner"></div>' +
      '<p style="font-size:.875rem;color:var(--text-soft)">Beratungsinhalte werden geladen …</p></div></div>';
  }

  var sheetsConfigured = Object.keys(SHEET_CONFIG).some(function (k) { return SHEET_CONFIG[k]; });
  if (sheetsConfigured) renderInitialLoading();
  loadSheetData().then(render).catch(function (e) {
    console.warn('Sheet-Daten konnten nicht vollständig geladen werden, nutze Standardwerte.', e);
    render();
  });
})();
</script>
