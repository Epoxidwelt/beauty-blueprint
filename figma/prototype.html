<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>Beauty Blueprint — Klickbarer Prototyp</title>
<style>
  @font-face {
    font-family: 'Iowan Old Style';
    src: local('Iowan Old Style');
  }

  :root {
    /* Exakt aus dem Original-Logo (Beauty_Lounge_Logo Transparent.png) extrahiert */
    --warmweiss: #FFFFFF;
    --rose-pale: #ECD9DF;
    --rose-wash: #DCB9C5;
    --rose: #C4879C;
    --rose-deep: #9A4B66;
    --anthrazit: #3F3F41;
    --anthrazit-soft: #7A7A7C;
    --surface: var(--warmweiss);
    --surface-raised: #FFFFFF;
    --border: rgba(63, 63, 65, 0.14);
    --border-strong: rgba(63, 63, 65, 0.26);
    --text: var(--anthrazit);
    --text-soft: var(--anthrazit-soft);
    --danger: #A6473E;
    --warn: #A97A2E;
    --good: #52704F;

    --backdrop: #FFFFFF;
    --backdrop-ink: #3A3638;
    --backdrop-ink-soft: rgba(58, 54, 56, 0.6);

    --font-display: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root { --backdrop: #FFFFFF; --backdrop-ink: #3A3638; --backdrop-ink-soft: rgba(58, 54, 56, 0.6); }
  }
  :root[data-theme="dark"] { --backdrop: #FFFFFF; --backdrop-ink: #3A3638; --backdrop-ink-soft: rgba(58, 54, 56, 0.6); }
  :root[data-theme="light"] { --backdrop: #FFFFFF; --backdrop-ink: #3A3638; --backdrop-ink-soft: rgba(58, 54, 56, 0.6); }

  * { box-sizing: border-box; }
  html { font-size: 16px; }

  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    background: var(--backdrop);
    color: var(--backdrop-ink);
    font-family: var(--font-body);
    display: flex;
    overflow: hidden;
  }

  .brand-logo { display: block; margin: 0 auto 1.1rem; }
  .brand-logo.lg { height: 126px; width: auto; }
  .brand-logo.md { height: 84px; width: auto; }

  .device {
    width: 100%;
    max-width: 1280px;
    height: 100%;
    margin: 0 auto;
    display: flex;
  }

  .screen {
    flex: 1;
    background: var(--surface);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: background-color .35s ease;
  }

  .screen[data-mode="dezent"], .screen[data-mode="brand"] { background: var(--warmweiss); }

  .topbar {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 1rem 1.3rem 0.3rem;
    flex-shrink: 0;
  }
  .back-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.5);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  .back-btn:hover { border-color: var(--border-strong); }
  .back-btn[disabled] { visibility: hidden; }
  .topbar-logo { height: 48px; width: auto; flex-shrink: 0; }
  .topbar-spacer { flex: 1; }
  .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.15rem; }
  .step-label {
    font-family: var(--font-body);
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-soft);
    white-space: nowrap;
  }
  .context-label {
    font-size: 0.625rem;
    color: var(--text-soft);
    opacity: 0.75;
    white-space: nowrap;
    flex-shrink: 0;
    max-width: 9rem;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stepper {
    display: flex;
    align-items: center;
    padding: 0.5rem 1.6rem 1.1rem;
    flex-shrink: 0;
  }
  .stepper .seg { flex: 1; height: 1px; background: var(--border-strong); }
  .stepper .step-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--surface-raised);
    border: 1.5px solid var(--border-strong);
    flex-shrink: 0;
    transition: all .2s ease;
  }
  .stepper .step-dot.done { background: var(--rose); border-color: var(--rose); }
  .stepper .step-dot.current { width: 13px; height: 13px; background: var(--rose-deep); border-color: var(--rose-deep); }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 2.2rem 2rem;
    display: flex;
    flex-direction: column;
  }
  .content.center { justify-content: center; }

  .eyebrow {
    font-size: 0.6875rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-soft);
    margin: 0 0 0.4rem;
  }
  .section-label {
    font-family: var(--font-body);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--rose-deep);
    margin: 1.3rem 0 0.6rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--border);
  }
  .section-label:first-of-type { margin-top: 0.9rem; padding-top: 0; border-top: none; }
  h1.q, h2.q {
    font-family: var(--font-body);
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--text);
    margin: 0 0 1.1rem;
    text-wrap: balance;
    line-height: 1.2;
  }
  h1.q { font-size: 1.75rem; }
  h2.q { font-size: 1.35rem; }
  p.sub {
    font-size: 0.875rem;
    color: var(--text-soft);
    margin: -0.6rem 0 1.2rem;
    max-width: 34rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 0.6rem;
  }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

  .card {
    font-family: var(--font-body);
    text-align: left;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    font-size: 0.9rem;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    transition: border-color .15s ease, background-color .15s ease, transform .1s ease;
  }
  .card:hover { border-color: var(--rose-deep); }
  .card:active { transform: scale(0.98); }
  .card.selected {
    border-color: var(--rose-deep);
    background: color-mix(in srgb, var(--rose-pale) 55%, white);
  }
  .card .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--rose-deep);
    flex-shrink: 0;
    opacity: 0;
    transition: opacity .15s ease;
  }
  .card.selected .dot { opacity: 1; }
  .card.disabled { opacity: 0.45; cursor: not-allowed; }
  .card.disabled:hover { border-color: var(--border); }

  .card.center-tap { justify-content: center; text-align: center; font-size: 0.95rem; padding: 1.2rem 1rem; }

  .row-choice {
    display: flex;
    gap: 0.6rem;
  }
  .row-choice .card { flex: 1; justify-content: center; text-align: center; }

  .scale4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
  }
  .scale4 .card { flex-direction: column; gap: 0.5rem; text-align: center; justify-content: center; padding: 1rem 0.5rem; }
  .scale4 .level-fill { display: flex; gap: 3px; }
  .scale4 .level-fill span { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); }
  .scale4 .card.selected .level-fill span.on { background: var(--rose-deep); }

  .btn-primary, .btn-ghost, .btn-link {
    width: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    font-family: var(--font-body);
    font-size: 0.9375rem;
    font-weight: 600;
    border-radius: 8px;
    padding: 0.85rem 1.3rem;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }
  .btn-primary {
    letter-spacing: 0.01em;
    background: var(--anthrazit);
    color: var(--warmweiss);
    border: none;
    transition: transform .1s ease, opacity .15s ease;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary[disabled] { opacity: 0.35; cursor: not-allowed; }

  .btn-ghost {
    font-weight: 500;
    background: transparent;
    color: var(--text-soft);
    border: 1.5px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--border-strong); color: var(--text); }

  .btn-link {
    background: transparent;
    color: var(--rose-deep);
    border: 1.5px solid var(--rose-deep);
  }
  .btn-link:hover { background: var(--rose-pale); }

  .welcome-title {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--text);
    text-align: center;
    margin: 0 0 1.6rem;
  }

  .stack {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  .stack-btn {
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
    background: var(--surface-raised);
    color: var(--text);
    border: 1.5px solid var(--border-strong);
    border-radius: 12px;
    padding: 1.1rem 1rem;
    cursor: pointer;
    transition: border-color .15s ease, background-color .15s ease, transform .1s ease;
  }
  .stack-btn:hover { border-color: var(--rose-deep); }
  .stack-btn:active { transform: scale(0.99); }
  .stack-btn.primary {
    background: var(--rose-pale);
    border-color: var(--rose-deep);
    color: var(--rose-deep);
  }
  .stack-btn[disabled] {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .stack-btn .hint {
    display: block;
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--text-soft);
    margin-top: 0.15rem;
  }

  .footer-actions {
    margin-top: auto;
    padding-top: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    flex-shrink: 0;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.35rem 0.7rem;
    border-radius: 999px;
    width: fit-content;
  }
  .badge.gruen { background: rgba(82,112,79,0.14); color: var(--good); }
  .badge.gelb { background: rgba(169,122,46,0.14); color: var(--warn); }
  .badge.rot { background: rgba(166,71,62,0.14); color: var(--danger); }
  .badge .dot2 { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .text-input {
    font-family: var(--font-body);
    font-size: 1rem;
    padding: 0.85rem 1rem;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--surface-raised);
    color: var(--text);
    width: 100%;
    max-width: 22rem;
  }
  .text-input:focus { outline: 2px solid var(--rose-deep); outline-offset: 1px; }

  .avatar-row { display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center; }
  .avatar-card {
    width: 108px;
    display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    background: transparent; border: none; cursor: pointer; font-family: var(--font-body);
  }
  .avatar-circle {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--surface-raised);
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 1.4rem; color: var(--rose-deep);
    transition: border-color .15s ease, transform .15s ease;
    overflow: hidden;
  }
  .avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-card:hover .avatar-circle { border-color: var(--rose-deep); transform: translateY(-2px); }
  .avatar-name { font-size: 0.8125rem; color: var(--text); }

  .summary-list { display: flex; flex-direction: column; gap: 0.55rem; margin: 0 0 1rem; }
  .summary-row {
    display: flex; justify-content: space-between; gap: 1rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.875rem;
  }
  .summary-row .k { color: var(--text-soft); }
  .summary-row .v { color: var(--text); font-weight: 600; text-align: right; }

  .rec-card {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .rec-card.selected { border-color: var(--rose-deep); }
  .rec-kicker { font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rose-deep); }
  .rec-number-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 24px; height: 24px; padding: 0 0.4rem; border-radius: 999px;
    background: var(--rose-deep); color: var(--warmweiss);
    font-family: var(--font-body); font-weight: 700; font-size: 0.75rem;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .rec-round-row { display: flex; gap: 0.6rem; align-items: center; margin-top: 0.1rem; }
  .rec-round-btn {
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    background: var(--surface-raised);
    color: var(--text);
    font-family: var(--font-body); font-size: 1.25rem; font-weight: 500; line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .rec-round-btn:active { transform: scale(0.94); }
  .rec-round-btn.add { color: var(--rose-deep); border-color: var(--rose-deep); }
  .rec-round-btn.add:hover { background: var(--rose-pale); }
  .rec-round-btn.add.active { background: var(--anthrazit); border-color: var(--anthrazit); color: var(--warmweiss); }
  .rec-round-btn.remove { color: var(--danger); border-color: var(--danger); }
  .rec-round-btn.remove:hover { background: rgba(166,71,62,0.1); }
  .rec-name { font-family: var(--font-display); font-size: 1.15rem; color: var(--text); }
  .rec-toggle {
    display: flex; gap: 0.4rem; margin-top: 0.2rem;
  }
  .rec-toggle button {
    font-family: var(--font-body);
    font-size: 0.75rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-soft);
    border-radius: 999px;
    padding: 0.3rem 0.7rem;
    cursor: pointer;
  }
  .rec-toggle button.active { background: var(--anthrazit); color: var(--warmweiss); border-color: var(--anthrazit); }

  .product-search { margin-top: 0.3rem; padding-top: 0.6rem; border-top: 1px solid var(--border); }
  .product-search .text-input { font-size: 0.875rem; padding: 0.55rem 0.7rem; }
  .product-results { display: flex; flex-direction: column; gap: 0.15rem; margin-top: 0.4rem; max-height: 220px; overflow-y: auto; }
  .product-result {
    display: flex; justify-content: space-between; align-items: center; gap: 0.6rem;
    width: 100%; text-align: left;
    font-family: var(--font-body); font-size: 0.8125rem; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.5rem 0.65rem; cursor: pointer;
  }
  .product-result:hover, .product-result:focus { border-color: var(--rose-deep); background: var(--surface-raised); }
  .product-result span:first-child { flex: 1; }

  .blueprint-hero {
    font-family: var(--font-display);
    font-size: 2rem;
    font-style: italic;
    color: var(--anthrazit);
    margin: 0.2rem 0 0.1rem;
    text-wrap: balance;
  }
  .divider { height: 1px; background: var(--border-strong); margin: 1.1rem 0; border: none; }

  .routine-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
  .kur-warning {
    background: rgba(169,122,46,0.12);
    color: var(--warn);
    border: 1px solid rgba(169,122,46,0.3);
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
    font-size: 0.8125rem;
    margin: 0.6rem 0 0;
  }
  .routine-col h3 { font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--rose-deep); margin: 0 0 0.5rem; }
  .routine-col ol { margin: 0; padding-left: 1.1rem; font-size: 0.875rem; color: var(--text); display: flex; flex-direction: column; gap: 0.3rem; }

  .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; flex: 1; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2.5px solid var(--border);
    border-top-color: var(--rose-deep);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
    * { transition-duration: 0.01ms !important; }
  }

  @media (max-width: 640px) {
    html { font-size: 17.5px; }
    .content { padding: 0.5rem 1.2rem 1.6rem; }
    .grid.cols-3, .grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
    .routine-cols { grid-template-columns: 1fr; }
    .topbar-logo { height: 57px; }
    .back-btn { width: 34px; height: 34px; }
    .step-label { font-size: 0.8125rem; }
    .context-label { font-size: 0.75rem; }
    .brand-logo.lg { height: 138px; }
    .brand-logo.md { height: 102px; }
  }

  /* iPad Pro & größere Tablets (Höhe mitgeprüft, damit ein Iphone im Querformat nicht
     mit hineinfällt): größere Grundschrift skaliert alle rem-Maße automatisch mit,
     dazu gezielt größere Touch-Ziele und ein deutlich präsenteres Logo. */
  @media (min-width: 800px) and (min-height: 700px) {
    html { font-size: 19px; }
    .topbar { padding: 1.4rem 1.8rem 0.5rem; gap: 0.9rem; }
    .topbar-logo { height: 78px; }
    .back-btn { width: 40px; height: 40px; font-size: 1.05rem; }
    .stepper { padding: 0.6rem 1.8rem 1.3rem; }
    .stepper .step-dot { width: 12px; height: 12px; }
    .stepper .step-dot.current { width: 17px; height: 17px; }
    .brand-logo.lg { height: 195px; }
    .brand-logo.md { height: 144px; }
    .avatar-card { width: 138px; }
    .avatar-circle { width: 96px; height: 96px; }
    .card .dot { width: 10px; height: 10px; }
  }
</style>

<div class="device"><div class="screen" id="screen"></div></div>

<script>
(function () {
  // ---------- Google Sheet als zentrale Inhaltsquelle ----------
  // Jede URL kommt aus Google Sheets: Datei > Freigeben > Im Web veröffentlichen >
  // gewünschtes Tabellenblatt auswählen > Format "CSV" > Link kopieren.
  // Bleibt ein Feld leer, nutzt der Prototyp die eingebauten Beispieldaten (DEFAULT_*) als Fallback,
  // damit die Demo auch ohne Sheet sofort funktioniert.
  var SHEET_CONFIG = {
    ziele: '',
    painpoints: '',
    anlass: '',
    lifestyle: '',
    sicherheitscheck: '',
    hautanalyse: '',
    beautyneeds: ''
  };

  var DEFAULT_ZIELE = [
    { key: 'glow', label: 'Mehr Feuchtigkeit & Glow' },
    { key: 'juenger', label: 'Jünger & frischer aussehen' },
    { key: 'rein', label: 'Reinere Haut' },
    { key: 'pigment', label: 'Weniger Pigmentflecken' },
    { key: 'sensibel', label: 'Empfindliche Haut beruhigen' },
    { key: 'poren', label: 'Feinere Poren' },
    { key: 'struktur', label: 'Bessere Hautstruktur' },
    { key: 'straffung', label: 'Straffung' },
    { key: 'allgemein', label: 'Allgemeine Hautverbesserung' }
  ];
  var DEFAULT_PAIN_POINTS = [
    { key: 'muede', label: 'Haut sieht müde aus' },
    { key: 'makeup', label: 'Fühlt sich ohne Make-up unwohl' },
    { key: 'spannung', label: 'Spannungsgefühl' },
    { key: 'unreinheiten', label: 'Unreinheiten belasten sie' },
    { key: 'aelter', label: 'Fühlt sich älter' },
    { key: 'unruhig', label: 'Hautbild wirkt unruhig' },
    { key: 'ereignis', label: 'Ein bestimmtes Ereignis steht bevor' }
  ];
  var DEFAULT_ANLASS = [
    { key: 'alltag', label: 'Alltag' },
    { key: 'hochzeit', label: 'Hochzeit' },
    { key: 'urlaub', label: 'Urlaub' },
    { key: 'event', label: 'Event' },
    { key: 'beruflich', label: 'Beruflicher Anlass' },
    { key: 'praevention', label: 'Prävention' },
    { key: 'langfristig', label: 'Langfristige Verbesserung' }
  ];
  var DEFAULT_LIFESTYLE_ITEMS = [

  // ---------- CSV laden & parsen ----------
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
        } else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
      } else field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    if (!rows.length) return [];
    var headers = rows[0].map(function (h) { return h.trim(); });
    return rows.slice(1).filter(function (r) { return r.some(function (v) { return v.trim() !== ''; }); }).map(function (r) {
      var obj = {};
      headers.forEach(function (h, i) { obj[h] = (r[i] || '').trim(); });
      return obj;
    });
  }

  function isActive(row) {
    var v = (row.aktiv || '').toLowerCase();
    return v === '' || v === 'ja' || v === 'true' || v === '1' || v === 'yes';
  }

  function fetchSheet(url) {
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    }).then(parseCSV);
  }

  function loadSheetData() {
    var anyConfigured = Object.keys(SHEET_CONFIG).some(function (k) { return SHEET_CONFIG[k]; });
    if (!anyConfigured) return Promise.resolve();

    var tasks = [];

    if (SHEET_CONFIG.ziele) tasks.push(fetchSheet(SHEET_CONFIG.ziele).then(function (rows) {
      var r = rows.filter(isActive).map(function (row) { return { key: row.key, label: row.label }; });
      if (r.length) ZIELE = r;
    }).catch(function (e) { console.warn('Ziele-Sheet konnte nicht geladen werden, nutze Standardwerte.', e); }));

    if (SHEET_CONFIG.painpoints) tasks.push(fetchSheet(SHEET_CONFIG.painpoints).then(function (rows) {
      var r = rows.filter(isActive).map(function (row) { return { key: row.key, label: row.label }; });
      if (r.length) PAIN_POINTS = r;
    }).catch(function (e) { console.warn('PainPoints-Sheet konnte nicht geladen werden, nutze Standardwerte.', e); }));

    if (SHEET_CONFIG.anlass) tasks.push(fetchSheet(SHEET_CONFIG.anlass).then(function (rows) {
      var r = rows.filter(isActive).map(function (row) { return { key: row.key, label: row.label }; });
      if (r.length) ANLASS = r;
    }).catch(function (e) { console.warn('Anlass-Sheet konnte nicht geladen werden, nutze Standardwerte.', e); }));

    if (SHEET_CONFIG.lifestyle) tasks.push(fetchSheet(SHEET_CONFIG.lifestyle).then(function (rows) {
      var r = rows.filter(isActive).map(function (row) {
        var item = { key: row.key, frage: row.frage, type: row.typ || 'yesno' };
        if (item.type === 'scale3') item.options = (row.optionen || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
        return item;
      });
      if (r.length) LIFESTYLE_ITEMS = r;
    }).catch(function (e) { console.warn('Lifestyle-Sheet konnte nicht geladen werden, nutze Standardwerte.', e); }));

    if (SHEET_CONFIG.sicherheitscheck) tasks.push(fetchSheet(SHEET_CONFIG.sicherheitscheck).then(function (rows) {
      var r = rows.filter(isActive).map(function (row) { return { key: row.key, frage: row.frage, risk: row.risiko, hinweis: row.hinweis || '' }; });
      if (r.length) SAFETY_ITEMS = r;
    }).catch(function (e) { console.warn('Sicherheitscheck-Sheet konnte nicht geladen werden, nutze Standardwerte.', e); }));

    if (SHEET_CONFIG.hautanalyse) tasks.push(fetchSheet(SHEET_CONFIG.hautanalyse).then(function (rows) {
      var r = rows.filter(isActive).map(function (row) { return { key: row.key, label: row.label, need: row.need }; });
      if (r.length) ANALYSE_ITEMS = r;
    }).catch(function (e) { console.warn('Hautanalyse-Sheet konnte nicht geladen werden, nutze Standardwerte.', e); }));

    if (SHEET_CONFIG.beautyneeds) tasks.push(fetchSheet(SHEET_CONFIG.beautyneeds).then(function (rows) {
      var map = {};
      rows.forEach(function (row) { if (row.need) map[row.need] = { behandlung: row.behandlung, dauer: row.dauer || '', preis: row.preis || '', product: row.produkt, produktpreis: row.produktpreis || '' }; });
      if (Object.keys(map).length) NEED_INFO = map;
    }).catch(function (e) { console.warn('BeautyNeeds-Sheet konnte nicht geladen werden, nutze Standardwerte.', e); }));

    return Promise.all(tasks);
  }

  function selectHandler(kind, key, extra) {
    if (kind === 'mitarbeiterin') { STATE.mitarbeiterin = key; goTo('kunde-wahl'); }
    else if (kind === 'kunde-bestehend') { STATE.kundeName = key; goTo('ziel'); }
    else if (kind === 'kunde-neu-weiter') {
      var val = document.getElementById('kunde-name-input');
      if (val && val.value.trim()) { STATE.kundeName = val.value.trim(); goTo('ziel'); }
    }
    else if (kind === 'ziel') { toggleMulti(STATE.ziel, key); render(); }
    else if (kind === 'painpoint') { toggleMulti(STATE.painpoint, key); render(); }
    else if (kind === 'anlass') { STATE.anlass = key; goTo('lifestyle:0'); }
    else if (kind === 'lifestyle') { STATE.lifestyle[key] = extra; advanceFlow('lifestyle', LIFESTYLE_ITEMS, 'sicherheit:0'); }
    else if (kind === 'sicherheit') { STATE.sicherheit[key] = extra; advanceFlow('sicherheit', SAFETY_ITEMS, 'sicherheit-summary'); }
    else if (kind === 'analyse') { STATE.analyse[key] = extra; advanceFlow('analyse', ANALYSE_ITEMS, 'auswertung'); }

      // Anhängen statt Toggle: derselbe Need kann mehrfach ausgewählt werden (z. B. ASA
      // 3x für eine Kur) — jeder Klick fügt einen weiteren Eintrag am Ende hinzu.
      STATE.rec.behandlungOrder.push(key);
      render();
    }
    else if (kind === 'behandlung-remove') {
      STATE.rec.behandlungOrder = STATE.rec.behandlungOrder.filter(function (n) { return n !== key; });
      render();
    }
    else if (kind === 'homecare-toggle-status') {
      var slot = STATE.rec.homecare[key];
      slot.status = slot.status === 'entfernt' ? 'aktiv' : 'entfernt';
      slot.searchOpen = false;
      render();
    }
    else if (kind === 'homecare-toggle-search') {
      var s = STATE.rec.homecare[key];
      s.searchOpen = !s.searchOpen;
      render();
    }
    else if (kind === 'homecare-reset-product') {
      STATE.rec.homecare[key].product = null;
      STATE.rec.homecare[key].searchOpen = false;
      render();
    }
    else if (kind === 'kur-toggle-status') {
      var ks = STATE.rec.kur[key];
      ks.status = ks.status === 'entfernt' ? 'aktiv' : 'entfernt';
      ks.searchOpen = false;
      render();
    }
    else if (kind === 'kur-toggle-search') {
      var kts = STATE.rec.kur[key];
      kts.searchOpen = !kts.searchOpen;
      render();
    }
    else if (kind === 'kur-reset-treatment') {
      STATE.rec.kur[key].override = null;
      STATE.rec.kur[key].searchOpen = false;

  function filterProducts(slot, query) {
    var q = (query || '').trim().toLowerCase();
    var results = q.length < 2 ? [] : ALL_PRODUCTS.filter(function (p) {
      return p.name.toLowerCase().indexOf(q) > -1;

    PRODUCT_SEARCH_RESULTS[slot] = results;

  // Ordnet den Screen einer von 5 sichtbaren Stufen zu (Kundenauswahl-Screens zeigen

  function stepInfo(screenId) {
    if (screenId === 'ziel') return { index: 1, total: 5 };
    if (screenId === 'painpoint' || screenId === 'anlass' || screenId.indexOf('lifestyle:') === 0) return { index: 2, total: 5 };
    if (screenId.indexOf('sicherheit') === 0) return { index: 3, total: 5 };
    if (screenId.indexOf('analyse:') === 0) return { index: 4, total: 5 };
    if (['auswertung', 'empfehlungen', 'blueprint', 'abschluss'].indexOf(screenId) > -1) return { index: 5, total: 5 };
    return null;
  }

    for (var i = 1; i <= step.total; i++) {
      var cls = i < step.index ? 'done' : (i === step.index ? 'current' : '');
      dots += '<span class="step-dot ' + cls + '"></span>';
      if (i < step.total) dots += '<span class="seg"></span>';
    }
    return '<div class="stepper">' + dots + '</div>';
  }

  // Merkt sich, welcher Screen zuletzt gezeichnet wurde: ein erneutes render() DERSELBEN
  // Ansicht (z.B. nach Produktauswahl aus einem Dropdown) soll die Scroll-Position behalten,
  // statt die Mitarbeiterin nach jedem Klick zurück nach oben zu werfen. Ein echter
  // Screen-Wechsel (goTo/goBack) startet dagegen bewusst wieder oben.
  var lastRenderedScreenId = null;

  function screenWrap(mode, percent, contextText, bodyHtml, center) {
    var el = document.getElementById('screen');
    var currentId = path[pointer];
    var oldContent = el.querySelector('.content');
    var scrollTop = (currentId === lastRenderedScreenId && oldContent) ? oldContent.scrollTop : 0;
    // Tippen in ein Suchfeld öffnet auf Tablet/Handy die Bildschirmtastatur; ein Tap auf ein
    // Suchergebnis nimmt den Fokus weg, wodurch sich die Tastatur schließt — das verändert die
    // sichtbare Höhe der Seite NACH diesem render() nochmal und kann unsere Scroll-Position
    // überschreiben. Vorab den Fokus zu entfernen stößt das Schließen schon hier an; das erneute
    // Setzen von scrollTop kurz danach (rAF + Timeout) gewinnt den Wettlauf mit der
    // Tastatur-Schließanimation zuverlässig, auch wenn diese noch etwas länger braucht.
    if (document.activeElement && document.activeElement !== document.body && document.activeElement.blur) {
      document.activeElement.blur();
    }
    el.setAttribute('data-mode', mode);
    el.innerHTML = topbar(mode, percent, contextText) + '<div class="content' + (center ? ' center' : '') + '">' + bodyHtml + '</div>';
    var newContent = el.querySelector('.content');
    if (newContent) {
      newContent.scrollTop = scrollTop;
      requestAnimationFrame(function () { newContent.scrollTop = scrollTop; });
      setTimeout(function () { newContent.scrollTop = scrollTop; }, 350);
    }
    lastRenderedScreenId = currentId;
  }

  function phasePercent(phase, idx, count) {

    triggers.sort(function (a, b) { return (a.risk === 'rot' ? 0 : 1) - (b.risk === 'rot' ? 0 : 1); });

  function computeNeeds() {
    var scores = {};
    ANALYSE_ITEMS.forEach(function (it) {
      var v = STATE.analyse[it.key];
      if (v === undefined) v = 0;
      if (!scores[it.need]) scores[it.need] = { sum: 0, count: 0 };
      scores[it.need].sum += v;
      scores[it.need].count += 1;
    });
    var arr = Object.keys(scores).map(function (need) {
      return { need: need, avg: scores[need].sum / scores[need].count };
    });
    arr.sort(function (a, b) { return b.avg - a.avg; });
    return arr;
  }

  // den Strategie-Screen). Der Buchungslink steht allein auf seiner eigenen Zeile ohne
  // weiteren Text davor/danach, damit ihn möglichst jedes Mailprogramm automatisch verlinkt —
  // eine "echte" HTML-Schaltfläche ist über mailto: technisch nicht möglich (reiner Text).
  function emailSummaryHref() {
    var plan = getPlan();
    var i1 = NEED_INFO[(plan.active[0] || plan.ranked[0]).need];
    var i2 = plan.active[1] ? NEED_INFO[plan.active[1].need] : i1;
    var lines = [
      'Beauty Blueprint — ' + (STATE.kundeName || 'Kundin'),

    ];

    if (plan.active.length) {
      groupedActive(plan).forEach(function (r) {
        lines.push('- ' + treatLine(r) + (r.count > 1 ? ' — ' + r.count + 'x im Kurplan' : ''));
      });
    } else {
      lines.push('- keine ausgewählt');
    }
    lines.push('');
    lines.push('6-Monats-Kurplan:');
    kurDefaultSlots(plan).forEach(function (baseInfo, idx) {
      var info = kurInfoFor(idx, baseInfo);
      lines.push('Monat ' + (idx + 1) + ': ' + (info ? treatLine(info) : 'entfernt'));
    });
    lines.push('Kur-Gesamtpreis (6 Monate): ' + formatPrice(kurTotal(plan)));
    lines.push('');
    lines.push('Homecare-Produkte:');
    var homeAM = homecareInfoFor('am', i1);
    var homePM = homecareInfoFor('pm', i2);
    var reinigungInfo = homecareInfoFor('reinigung', { product: i1.reinigung, produktpreis: i1.reinigungpreis });
    var tonicInfo = homecareInfoFor('tonic', { product: i1.tonic, produktpreis: i1.tonicpreis });
    var peelingInfo = homecareInfoFor('peeling', { product: i1.peeling, produktpreis: i1.peelingpreis });
    var serumInfo = homecareInfoFor('serum', { product: i1.serum, produktpreis: i1.serumpreis });
    var augencremeInfo = homecareInfoFor('augencreme', { product: i1.augencreme, produktpreis: i1.augencremepreis });
    var maskeInfo = homecareInfoFor('maske', { product: i1.maske, produktpreis: i1.maskepreis });
    var sonnenschutzInfo = homecareInfoFor('sonnenschutz', { product: i1.sonnenschutz, produktpreis: i1.sonnenschutzpreis });
    if (reinigungInfo) lines.push('- Reinigung: ' + productLine(reinigungInfo));
    if (tonicInfo) lines.push('- Tonic: ' + productLine(tonicInfo));
    if (serumInfo) lines.push('- Serum: ' + productLine(serumInfo));
    if (augencremeInfo) lines.push('- Augencreme: ' + productLine(augencremeInfo));
    if (homeAM) lines.push('- Morgens: ' + productLine(homeAM));
    if (homePM) lines.push('- Abends: ' + productLine(homePM));
    if (sonnenschutzInfo) lines.push('- Sonnenschutz: ' + productLine(sonnenschutzInfo));
    if (peelingInfo) lines.push('- Peeling (1-2x/Woche): ' + productLine(peelingInfo));
    if (maskeInfo) lines.push('- Maske (1-2x/Woche): ' + productLine(maskeInfo));
    if (!reinigungInfo && !tonicInfo && !homeAM && !peelingInfo && !serumInfo && !augencremeInfo && !homePM && !maskeInfo && !sonnenschutzInfo) lines.push('- keine ausgewählt');
    lines.push('');
    lines.push('Termin online buchen:');
    lines.push(BOOKING_URL);
    var body = lines.join('\n');
    var subject = 'Beauty Blueprint — ' + (STATE.kundeName || 'Kundin');
    return 'mailto:info@epoxidwelt.de?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  }

  // ---------- PDF-Bericht: eigener, minimaler PDF-Schreiber ----------
  // Bewusst ohne externe Bibliothek (z.B. jsPDF) — stattdessen wird die PDF-Datei direkt als
  // Byte-Sequenz nach PDF-Spezifikation zusammengesetzt (Objekte, Content-Stream mit
  // Text-/Grafik-Operatoren, xref-Tabelle). Das Logo wird als vorab auf Weiß geflattetes JPEG
  // eingebettet (DCTDecode) — dafür ist kein PNG-Decoder nötig, das JPEG wird 1:1 durchgereicht.
  // Alle Texte laufen durch WinAnsiEncoding (Latin-1-kompatibel), damit deutsche Umlaute korrekt
  // erscheinen.
  function base64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function stringToBytes(str) {
    var bytes = new Uint8Array(str.length);
    for (var i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xFF;
    return bytes;
  }

  // Unicode-Codepoints oberhalb von 255, die WinAnsiEncoding (Windows-1252) trotzdem als
  // druckbares Zeichen kennt — allen voran das Euro-Zeichen (€), das in allen Preisangaben
  // vorkommt. Ohne diese Tabelle würde jeder Preis im PDF ein "?" statt "€" zeigen.
  var WIN1252_HIGH = {
    8364: 0x80, 8218: 0x82, 402: 0x83, 8222: 0x84, 8230: 0x85, 8224: 0x86, 8225: 0x87,
    710: 0x88, 8240: 0x89, 352: 0x8A, 8249: 0x8B, 338: 0x8C, 381: 0x8E, 8216: 0x91,
    8217: 0x92, 8220: 0x93, 8221: 0x94, 8226: 0x95, 8211: 0x96, 8212: 0x97, 732: 0x98,
    8482: 0x99, 353: 0x9A, 8250: 0x9B, 339: 0x9C, 382: 0x9E, 376: 0x9F
  };
  function pdfEscape(str) {
    var out = '';
    for (var i = 0; i < str.length; i++) {
      var code = str.charCodeAt(i);
      var c = code <= 255 ? code : (WIN1252_HIGH[code] !== undefined ? WIN1252_HIGH[code] : 63);
      var ch = String.fromCharCode(c);
      if (ch === '\\' || ch === '(' || ch === ')') out += '\\' + ch;
      else out += ch;
    }
    return out;
  }

  function pdfWrapText(text, maxWidth, fontSize) {
    var avgCharW = fontSize * 0.5;
    var maxChars = Math.max(8, Math.floor(maxWidth / avgCharW));
    if (text.length <= maxChars) return [text];
    var words = text.split(' ');
    var lines = [];
    var cur = '';
    words.forEach(function (w) {
      var test = cur ? cur + ' ' + w : w;
      if (test.length > maxChars && cur) { lines.push(cur); cur = w; }
      else cur = test;
    });
    if (cur) lines.push(cur);
    return lines;
  }

  function ByteWriter() {
    this.chunks = [];
    this.length = 0;
  }
  ByteWriter.prototype.writeString = function (str) {
    var b = stringToBytes(str);
    this.chunks.push(b);
    this.length += b.length;
  };
  ByteWriter.prototype.writeBytes = function (bytes) {
    this.chunks.push(bytes);
    this.length += bytes.length;
  };
  ByteWriter.prototype.toUint8Array = function () {
    var out = new Uint8Array(this.length);
    var offset = 0;
    this.chunks.forEach(function (c) { out.set(c, offset); offset += c.length; });
    return out;
  };

  function pad10(n) {
    var s = String(n);
    while (s.length < 10) s = '0' + s;
    return s;
  }

  // Baut den kompletten Bericht als PDF-Bytes. Layout entspricht dem Beauty-Blueprint-Screen:
  // Logo/Kundenname/Ziel, Behandlungsplan, 6-Monats-Kurplan mit Gesamtpreis, Homecare-Routine,
  // Terminbuchungs-Link. Fußzeile mit echten Studio-Stammdaten auf jeder Seite.
  function buildBeautyBlueprintPdfBytes() {
    var PAGE_W = 595.28, PAGE_H = 841.89;
    var MARGIN = 54;
    var BOTTOM = 74; // Platz für Fußzeile reservieren
    var LINE_H = 15;
    var COL_X = MARGIN + 190;
    var COL_W = PAGE_W - MARGIN - COL_X;

    var plan = getPlan();
    var i1 = NEED_INFO[(plan.active[0] || plan.ranked[0]).need];
    var i2 = plan.active[1] ? NEED_INFO[plan.active[1].need] : i1;
    var homeAM = homecareInfoFor('am', i1);
    var homePM = homecareInfoFor('pm', i2);
    var reinigungInfo = homecareInfoFor('reinigung', { product: i1.reinigung, produktpreis: i1.reinigungpreis });
    var tonicInfo = homecareInfoFor('tonic', { product: i1.tonic, produktpreis: i1.tonicpreis });
    var peelingInfo = homecareInfoFor('peeling', { product: i1.peeling, produktpreis: i1.peelingpreis });
    var serumInfo = homecareInfoFor('serum', { product: i1.serum, produktpreis: i1.serumpreis });
    var augencremeInfo = homecareInfoFor('augencreme', { product: i1.augencreme, produktpreis: i1.augencremepreis });
    var maskeInfo = homecareInfoFor('maske', { product: i1.maske, produktpreis: i1.maskepreis });
    var sonnenschutzInfo = homecareInfoFor('sonnenschutz', { product: i1.sonnenschutz, produktpreis: i1.sonnenschutzpreis });
    var kurGesamt = formatPrice(kurTotal(plan));

    var pages = [];
    var curOps = [];
    var y = PAGE_H - MARGIN;
    var linkTargets = []; // { page, x, y, w, h, url }

    function newPage() {
      pages.push(curOps);
      curOps = [];
      y = PAGE_H - MARGIN;
    }
    function ensureSpace(h) {
      if (y - h < BOTTOM) newPage();
    }
    function setFill(hex) {
      var r = parseInt(hex.substr(0, 2), 16) / 255, g = parseInt(hex.substr(2, 2), 16) / 255, b = parseInt(hex.substr(4, 2), 16) / 255;
      curOps.push(r.toFixed(3) + ' ' + g.toFixed(3) + ' ' + b.toFixed(3) + ' rg');
    }
    function text(str, x, size, font, hex) {
      setFill(hex);
      curOps.push('BT /' + font + ' ' + size.toFixed(1) + ' Tf ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Td (' + pdfEscape(str) + ') Tj ET');
    }
    function textCentered(str, size, font, hex) {
      var w = str.length * size * 0.5;
      text(str, (PAGE_W - w) / 2, size, font, hex);
    }
    function rect(x, ry, w, h, hex) {
      setFill(hex);
      curOps.push(x.toFixed(2) + ' ' + ry.toFixed(2) + ' ' + w.toFixed(2) + ' ' + h.toFixed(2) + ' re f');
    }
    function ruleLine() {
      ensureSpace(14);
      curOps.push('0.82 0.78 0.75 RG 0.7 w ' + MARGIN.toFixed(2) + ' ' + y.toFixed(2) + ' m ' + (PAGE_W - MARGIN).toFixed(2) + ' ' + y.toFixed(2) + ' l S');
      y -= 18;
    }
    function heading(str) {
      ensureSpace(26);
      text(str, MARGIN, 13, 'F2', '9A4B66');
      y -= 22;
    }
    function row(label, value) {
      var valueLines = pdfWrapText(value, COL_W, 10.5);
      var h = Math.max(1, valueLines.length) * LINE_H;
      ensureSpace(h);
      text(label, MARGIN, 9.5, 'F1', '7A7A7C');
      valueLines.forEach(function (vl, i) {
        text(vl, COL_X, 10.5, 'F2', '3F3F41');
        if (i < valueLines.length - 1) y -= LINE_H;
      });
      y -= LINE_H;
    }
    function plainLine(str, opts) {
      opts = opts || {};
      var size = opts.size || 10.5;
      var font = opts.font || 'F1';
      var hex = opts.color || '3F3F41';
      var indent = opts.indent || 0;
      var lines = pdfWrapText(str, PAGE_W - MARGIN - MARGIN - indent, size);
      lines.forEach(function (l) {
        ensureSpace(LINE_H);
        text(l, MARGIN + indent, size, font, hex);
        y -= LINE_H;
      });
    }
    function footer(pageIndex, pageCount) {
      var fy = 42;
      pages[pageIndex].push('0.48 0.48 0.48 rg BT /F1 8 Tf ' + MARGIN.toFixed(2) + ' ' + fy + ' Td (' +
        pdfEscape('Beauty Lounge · Inh. Svenja Gampp · Hoistener Straße 15 · 41466 Neuss · 02131 4506806') + ') Tj ET');
      var pageLabel = 'Seite ' + (pageIndex + 1) + ' von ' + pageCount;
      var px = PAGE_W - MARGIN - pageLabel.length * 8 * 0.5;
      pages[pageIndex].push('0.48 0.48 0.48 rg BT /F1 8 Tf ' + px.toFixed(2) + ' ' + fy + ' Td (' + pdfEscape(pageLabel) + ') Tj ET');
    }

    // Kopfbereich (Logo + Kundenname + Ziel)
    var logoW = 130, logoH = logoW * (LOGO_PDF_H / LOGO_PDF_W);
    y -= 4;
    curOps.push('q ' + logoW.toFixed(2) + ' 0 0 ' + logoH.toFixed(2) + ' ' + ((PAGE_W - logoW) / 2).toFixed(2) + ' ' + (y - logoH).toFixed(2) + ' cm /Im1 Do Q');
    y -= (logoH + 22);
    textCentered('Beauty Blueprint', 12, 'F1', '9A4B66');
    y -= 24;
    textCentered(STATE.kundeName || 'Kundin', 21, 'F2', '3F3F41');
    y -= 22;
    textCentered(zielText(), 10.5, 'F1', '7A7A7C');
    y -= 14;
    ruleLine();

    // Übersicht
    heading('Übersicht');
    row('Programm', plan.family.name);
    var behandlungRows = groupedActive(plan);
    if (behandlungRows.length) {
      behandlungRows.forEach(function (r, i) {
        row('Priorität ' + (i + 1), treatLine(r) + (r.count > 1 ? ' — ' + r.count + 'x im Kurplan' : ''));
      });
    } else {
      row('Behandlung', 'Keine ausgewählt');
    }
    row('Nächster Checkpoint', 'in 4 Wochen');
    y -= 6;

    // 6-Monats-Kurplan
    heading('6-Monats-Kurplan');
    kurDefaultSlots(plan).forEach(function (baseInfo, idx) {
      var info = kurInfoFor(idx, baseInfo);
      row('Monat ' + (idx + 1), info ? treatLine(info) : 'Entfernt');
    });
    ensureSpace(LINE_H + 6);
    text('Kur-Gesamtpreis (6 Monate)', MARGIN, 10.5, 'F2', '3F3F41');
    text(kurGesamt, COL_X, 10.5, 'F2', '9A4B66');
    y -= (LINE_H + 10);

    // Homecare-Routine
    heading('Homecare-Routine');
    plainLine('Morgens', { font: 'F2', size: 10.5, color: '9A4B66' });
    [reinigungInfo, tonicInfo, serumInfo, augencremeInfo, homeAM, sonnenschutzInfo].forEach(function (info) {
      if (info) plainLine('– ' + productLine(info), { indent: 10 });
    });
    y -= 4;
    plainLine('Abends', { font: 'F2', size: 10.5, color: '9A4B66' });
    [reinigungInfo, tonicInfo, serumInfo, augencremeInfo, homePM].forEach(function (info) {
      if (info) plainLine('– ' + productLine(info), { indent: 10 });
    });
    if (peelingInfo || maskeInfo) {
      y -= 4;
      plainLine('1-2x wöchentlich', { font: 'F2', size: 10.5, color: '9A4B66' });
      if (peelingInfo) plainLine('– Peeling: ' + productLine(peelingInfo), { indent: 10 });
      if (maskeInfo) plainLine('– Maske: ' + productLine(maskeInfo), { indent: 10 });
    }
    y -= 14;

    // Terminbuchung als Link-Button
    ensureSpace(46);
    var btnW = 220, btnH = 30, btnX = (PAGE_W - btnW) / 2, btnY = y - btnH;
    rect(btnX, btnY, btnW, btnH, '3F3F41');
    var btnLabel = 'Termin online buchen';
    var btnFontSize = 10.5;
    var btnLabelW = btnLabel.length * btnFontSize * 0.5;
    y = btnY + (btnH - btnFontSize * 0.7) / 2;
    text(btnLabel, (PAGE_W - btnLabelW) / 2, btnFontSize, 'F2', 'FFFFFF');
    linkTargets.push({ page: pages.length, x: btnX, y: btnY, w: btnW, h: btnH, url: BOOKING_URL });
    y = btnY - 18;

    newPage();
    var pageCount = pages.length;
    for (var p = 0; p < pageCount; p++) footer(p, pageCount);

    // ---------- Serialisierung ----------
    var objs = [];
    function addObj(body) { objs.push(body); return objs.length; }

    var fontRegNum = addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    var fontBoldNum = addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    var logoBytes = base64ToBytes(LOGO_PDF_JPEG_B64);
    var imgNum = addObj({
      stream: logoBytes,
      dict: '<< /Type /XObject /Subtype /Image /Width ' + LOGO_PDF_W + ' /Height ' + LOGO_PDF_H +
        ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + logoBytes.length + ' >>'
    });

    var pagesNum = objs.length + 1; objs.push(null); // reserviert, wird unten befüllt

    var pageNums = [];
    pages.forEach(function (ops, idx) {
      var contentStr = ops.join('\n') + '\n';
      var cNum = addObj({ stream: stringToBytes(contentStr), dict: '<< /Length ' + contentStr.length + ' >>' });
      var annotNums = linkTargets.filter(function (l) { return l.page === idx; })
        .map(function (l) {
          var actionNum = addObj('<< /Type /Action /S /URI /URI (' + pdfEscape(l.url) + ') >>');
          return addObj('<< /Type /Annot /Subtype /Link /Rect [' + l.x.toFixed(2) + ' ' + l.y.toFixed(2) + ' ' +
            (l.x + l.w).toFixed(2) + ' ' + (l.y + l.h).toFixed(2) + '] /Border [0 0 0] /A ' + actionNum + ' 0 R >>');
        });
      var pageDict = '<< /Type /Page /Parent ' + pagesNum + ' 0 R /MediaBox [0 0 ' + PAGE_W.toFixed(2) + ' ' + PAGE_H.toFixed(2) +
        '] /Resources << /Font << /F1 ' + fontRegNum + ' 0 R /F2 ' + fontBoldNum + ' 0 R >> /XObject << /Im1 ' + imgNum + ' 0 R >> >>' +
        ' /Contents ' + cNum + ' 0 R' +
        (annotNums.length ? ' /Annots [' + annotNums.map(function (n) { return n + ' 0 R'; }).join(' ') + ']' : '') + ' >>';
      pageNums.push(addObj(pageDict));
    });
    objs[pagesNum - 1] = '<< /Type /Pages /Kids [' + pageNums.map(function (n) { return n + ' 0 R'; }).join(' ') + '] /Count ' + pageNums.length + ' >>';
    var catalogNum = addObj('<< /Type /Catalog /Pages ' + pagesNum + ' 0 R >>');

    var w = new ByteWriter();
    w.writeString('%PDF-1.4\n');
    var offsets = [0];
    for (var n = 1; n <= objs.length; n++) {
      offsets[n] = w.length;
      var o = objs[n - 1];
      if (o && typeof o === 'object' && o.stream) {
        w.writeString(n + ' 0 obj\n' + o.dict + '\nstream\n');
        w.writeBytes(o.stream);
        w.writeString('\nendstream\nendobj\n');
      } else {
        w.writeString(n + ' 0 obj\n' + o + '\nendobj\n');
      }
    }
    var xrefStart = w.length;
    w.writeString('xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n');
    for (var n2 = 1; n2 <= objs.length; n2++) w.writeString(pad10(offsets[n2]) + ' 00000 n \n');
    w.writeString('trailer\n<< /Size ' + (objs.length + 1) + ' /Root ' + catalogNum + ' 0 R >>\nstartxref\n' + xrefStart + '\n%%EOF');
    return w.toUint8Array();
  }

  // Erzeugt die PDF-Datei und stößt den Download an (funktioniert im echten Browser/auf
  // GitHub Pages; im Claude-Artifact-Vorschaufenster blockiert die Sandbox
  // skript-ausgelöste Downloads grundsätzlich, das ist eine Plattform-Einschränkung der
  // Vorschau, kein Fehler im PDF selbst).
  function downloadPdfReport() {
    var bytes = buildBeautyBlueprintPdfBytes();
    var blob = new Blob([bytes], { type: 'application/pdf' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var safeName = (STATE.kundeName || 'Kundin').replace(/[^\w\-]+/g, '_');
    a.href = url;
    a.download = 'Beauty-Blueprint-' + safeName + '.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function treatLine(info) {
    var extra = [info.dauer, info.preis].filter(Boolean).join(' · ');
    return extra ? info.behandlung + ' (' + extra + ')' : info.behandlung;
  }

  function productLine(info) {
    return info.produktpreis ? info.product + ' (' + info.produktpreis + ')' : info.product;
  }

  function needReason(needName) {
    var parts = ANALYSE_ITEMS.filter(function (it) { return it.need === needName; }).map(function (it) {
      var v = STATE.analyse[it.key];
      if (!v) return null;
      return it.label + ' (' + SCALE4_LABELS[v] + ')';
    }).filter(Boolean);
    return parts.length ? parts.join(', ') : 'Geringe Ausprägung, aber relativ höchste Priorität';
  }

  function familyFor(needName) {
    return PROGRAM_FAMILIES.filter(function (f) { return f.needs.indexOf(needName) > -1; })[0] ||
      { name: needName, needs: [needName] };
  }

  // Der komplette Plan: "active" sind die von der Mitarbeiterin per Klick ausgewählten
  // Behandlungen, in genau der Reihenfolge, in der sie angeklickt wurden (nicht nach
  // System-Priorität) — das treibt die Nummerierung auf den Karten, den 6-Monats-Kurplan,
  // das Beauty Blueprint und die E-Mail. "ranked" bleibt die (auf 5 gedeckelte) Vorschlagsliste
  // zur Auswahl. "Programm" dient nur noch als grober Kontext-Name.
  function getPlan() {
    var ranked = rankedTreatmentOptions();
    var active = STATE.rec.behandlungOrder.map(function (need, i) {
      var info = NEED_INFO[need];
      return { prio: i + 1, need: need, behandlung: info.behandlung, dauer: info.dauer, preis: info.preis };
    });
    var family = familyFor((active[0] || ranked[0]).need);
    return { family: family, active: active, ranked: ranked };
  }

  // Für Übersichten (Beauty Blueprint, E-Mail): dieselbe Behandlung mehrfach hintereinander
  // aufzulisten wäre verwirrend — hier stattdessen einmal je Behandlung mit "×N", wenn sie
  // mehrfach ausgewählt wurde. Der Kurplan selbst (Monat 1-6) bleibt unverändert die volle,
  // unverdichtete Reihenfolge.
  function groupedActive(plan) {
    var order = [];
    var byNeed = {};
    plan.active.forEach(function (r) {
      if (!byNeed[r.need]) { byNeed[r.need] = { need: r.need, behandlung: r.behandlung, dauer: r.dauer, preis: r.preis, count: 0 }; order.push(byNeed[r.need]); }
      byNeed[r.need].count++;
    });
    return order;
  }

  // Löst den tatsächlich anzuzeigenden Homecare-Eintrag für "am" (morgens) oder
  // "pm" (abends) auf: entfernt -> null, von der Mitarbeiterin ausgewählt -> dieses
  // Produkt, sonst der System-Vorschlag (baseInfo, z.B. aus NEED_INFO).
  function homecareInfoFor(slot, baseInfo) {
    var s = STATE.rec.homecare[slot];
    if (s.status === 'entfernt') return null;
    if (s.product) return { product: s.product.name, produktpreis: s.product.preis };
    return baseInfo;
  }

  // 6-Monats-Kurplan: alle im Behandlungsplan ausgewählten Behandlungen werden im Kreis auf die
  // 6 Monate verteilt, in genau der Klick-Reihenfolge der Mitarbeiterin — wählt sie eine
  // Behandlung mehrfach an (z. B. ASA gleich 3x), taucht sie entsprechend öfter im Kurplan auf.
  // Jeder Termin bleibt einzeln editierbar (Suche, Zurücksetzen, Entfernen).
  var KUR_MONTHS = 6;

  function kurDefaultSlots(plan) {
    var pool = plan.active.length ? plan.active : [plan.ranked[0]];
    var slots = [];
    for (var m = 0; m < KUR_MONTHS; m++) {
      slots.push(pool[m % pool.length]);
    }
    return slots;
  }

  function kurInfoFor(idx, baseInfo) {
    var s = STATE.rec.kur[idx];
    if (s.status === 'entfernt') return null;
    if (s.override) return { behandlung: s.override.name, dauer: s.override.dauer, preis: s.override.preis };
    return baseInfo;
  }

  // Preis-String ("239 €" oder "72,50 €") in eine Zahl umwandeln bzw. wieder zurück —
  // Grundlage für die Kur-Gesamtsumme, die der Kundin mitgeteilt werden kann.
  function parsePrice(str) {
    if (!str) return 0;
    var n = parseFloat(String(str).replace(/[^\d,.]/g, '').replace(',', '.'));
    return isNaN(n) ? 0 : n;
  }
  function formatPrice(n) {
    return (Math.round(n * 100) % 100 === 0 ? n.toFixed(0) : n.toFixed(2).replace('.', ',')) + ' €';
  }

  // Summe aller (noch aktiven) Kur-Termine — zeigt der Mitarbeiterin/Kundin, was die
  // gesamte 6-Monats-Kur kostet, nicht nur die einzelne Behandlung.
  function kurTotal(plan) {
    var sum = 0;
    kurDefaultSlots(plan).forEach(function (baseInfo, idx) {
      var info = kurInfoFor(idx, baseInfo);
      if (info) sum += parsePrice(info.preis);
    });
    return sum;
  }

  // Alle Beauty-Needs, für die in der Hautanalyse tatsächlich etwas beobachtet wurde (avg > 0),
  // als priorisierte Liste geeigneter Behandlungen — Grundlage für die Schnellauswahl im
  // Kurplan, damit die Mitarbeiterin nicht erst tippen muss, um die passenden Optionen zu sehen.
  // Wie viele Behandlungsoptionen der Empfehlungen-Screen maximal zur Auswahl anbietet —
  // bewusst knapp gehalten, statt bis zu 9 Needs auf einmal zu zeigen.
  var MAX_BEHANDLUNGS_OPTIONEN = 5;

  function rankedTreatmentOptions() {
    var needs = computeNeeds();
    var list = needs.filter(function (n) { return n.avg > 0; });
    // Fallback, falls noch keine Hautanalyse-Antworten vorliegen: die (aus computeNeeds())
    // relativ höchste Priorität wird trotzdem als Ausgangspunkt gezeigt, statt eine leere
    // Liste — needReason() markiert diesen Fall bereits als "geringe Ausprägung".
    if (!list.length) list = needs[0] ? [needs[0]] : [{ need: 'Hydration', avg: 0 }];
    return list.slice(0, MAX_BEHANDLUNGS_OPTIONEN).map(function (n, i) {
      var info = NEED_INFO[n.need];
      return { prio: i + 1, need: n.need, behandlung: info.behandlung, dauer: info.dauer, preis: info.preis };
    });
  }

  // ASA Peel Fruchtsäure darf laut Studiolution-Kur-Konzept nur einmalig oder als direkt
  // aufeinanderfolgende 3er-Kur eingeplant werden (siehe "ASA Fruchtsäure KUR" im Katalog).
  function isAsaPeel(name) {
    var n = (name || '').toLowerCase();
    return n.indexOf('asa') > -1 && n.indexOf('peel') > -1 && n.indexOf('kur') === -1;
  }

  function kurAsaWarning(kurSlots) {
    var idxs = [];
    kurSlots.forEach(function (baseInfo, idx) {
      var info = kurInfoFor(idx, baseInfo);
      if (info && isAsaPeel(info.behandlung)) idxs.push(idx);
    });
    if (idxs.length <= 1) return null;
    var monthsText = idxs.map(function (i) { return i + 1; }).join(', ');
    if (idxs.length === 3 && idxs[2] - idxs[0] === 2) return null;
    return idxs.length === 3
      ? 'ASA Peel Fruchtsäure ist 3x eingeplant (Monat ' + monthsText + '), aber nicht direkt hintereinander. Als 3er-Kur sollte sie ohne Unterbrechung stattfinden.'
      : 'ASA Peel Fruchtsäure ist ' + idxs.length + 'x eingeplant (Monat ' + monthsText + '). Sie ist nur als Einzelbehandlung oder als direkt aufeinanderfolgende 3er-Kur vorgesehen.';
  }

  function zielText() {
    if (!STATE.ziel.length) return 'Allgemeine Hautverbesserung';
    return STATE.ziel.map(function (k) {
      var z = ZIELE.filter(function (z) { return z.key === k; })[0];
      return z ? z.label : k;
    }).join(', ');
  }


  function renderEmpfehlungen() {
    var plan = getPlan();
    var i1 = NEED_INFO[(plan.active[0] || plan.ranked[0]).need];
    var i2 = plan.active[1] ? NEED_INFO[plan.active[1].need] : i1;

    // Jede zur Hautanalyse passende Behandlung steht gleichwertig zur Wahl, ohne erzwungene
    // Phase-1/Phase-2/Beobachten-Rolle — die Mitarbeiterin entscheidet per Klick, welche
    // davon tatsächlich übernommen werden.
    function behandlungCard(r) {
      var order = STATE.rec.behandlungOrder;
      var pos = order.indexOf(r.need);
      var count = order.filter(function (n) { return n === r.need; }).length;
      var selected = count > 0;
      return '<div class="rec-card' + (selected ? ' selected' : '') + '">' +
        (selected
          ? '<span class="rec-number-badge">' + (pos + 1) + (count > 1 ? ' ×' + count : '') + '</span>'
          : '<span class="rec-kicker">Nicht ausgewählt</span>') +
        '<span class="rec-name">' + esc(r.behandlung) + '</span>' +
        '<span style="font-size:.8125rem;color:var(--text-soft)">' + esc([r.dauer, r.preis].filter(Boolean).join(' · ')) + '</span>' +
        '<p class="sub" style="margin:0;font-size:.8125rem">' + esc(needReason(r.need)) + '</p>' +
        '<div class="rec-round-row">' +
          '<button class="rec-round-btn add' + (selected ? ' active' : '') + '" onclick="__bb.select(\'behandlung-add\',\'' + r.need + '\')" title="' + (selected ? 'Nochmal wählen' : 'Auswählen') + '" aria-label="' + (selected ? 'Nochmal wählen' : 'Auswählen') + '">+</button>' +
          (selected ? '<button class="rec-round-btn remove" onclick="__bb.select(\'behandlung-remove\',\'' + r.need + '\')" title="Entfernen" aria-label="Entfernen">−</button>' : '') +
        '</div></div>';
    }

    // Homecare-Produkt für Morgens/Abends: das System schlägt das zur Priorität passende
    // Produkt schon vor (baseInfo), die Mitarbeiterin kann es aber über die Suche gegen
    // jedes der 364 echten KLAPP-Produkte austauschen oder den Schritt ganz entfernen.
    function homecareSlotCard(slot, label, baseInfo) {
      var s = STATE.rec.homecare[slot];
      var removed = s.status === 'entfernt';
      var display = s.product ? { product: s.product.name, produktpreis: s.product.preis } : baseInfo;
      return '<div class="rec-card">' +
        '<span class="rec-kicker">Homecare · ' + label + '</span>' +
        '<span class="rec-name" style="' + (removed ? 'text-decoration:line-through;opacity:.5' : '') + '">' + esc(productLine(display)) + '</span>' +
        (s.product && !removed ? '<p class="sub" style="margin:0;font-size:.75rem">Von dir ausgewählt — <a href="#" onclick="__bb.select(\'homecare-reset-product\',\'' + slot + '\');return false;" style="color:var(--rose-deep)">Systemvorschlag verwenden</a></p>' : '') +
        '<div class="rec-toggle" style="flex-wrap:wrap">' +
          (removed ? '' : '<button onclick="__bb.select(\'homecare-toggle-search\',\'' + slot + '\')">' + (s.searchOpen ? 'Suche schließen' : 'Anderes Produkt wählen') + '</button>') +
          '<button class="' + (removed ? '' : 'active') + '" onclick="__bb.select(\'homecare-toggle-status\',\'' + slot + '\')">' + (removed ? 'Entfernt — wiederherstellen' : 'Übernommen') + '</button>' +
        '</div>' +
        (s.searchOpen && !removed ?
          '<div class="product-search">' +
            '<input type="text" class="text-input" placeholder="Produkt suchen …" oninput="__bb.filterProducts(\'' + slot + '\', this.value)" />' +
            '<div class="product-results" id="product-results-' + slot + '"></div>' +
          '</div>' : '') +
      '</div>';
    }

    // 6-Monats-Kurplan: ein Termin pro Monat, Vorschlag aus kurDefaultSlots() (Hauptbehandlung
    // + zwei Auflockerungs-Termine). Beim Öffnen der Suche stehen zuerst die priorisierten,
    // zur Hautanalyse passenden Behandlungen als Ein-Klick-Optionen bereit; alternativ frei
    // aus allen 152 echten Studiolution-Behandlungen tippen.
    function kurSlotCard(idx, baseInfo, ranked) {
      var s = STATE.rec.kur[idx];
      var removed = s.status === 'entfernt';
      var display = s.override ? { behandlung: s.override.name, dauer: s.override.dauer, preis: s.override.preis } : baseInfo;
      return '<div class="rec-card">' +
        '<span class="rec-kicker">Monat ' + (idx + 1) + '</span>' +
        '<span class="rec-name" style="' + (removed ? 'text-decoration:line-through;opacity:.5' : '') + '">' + esc(display.behandlung) + '</span>' +
        '<span style="font-size:.8125rem;color:var(--text-soft)">' + esc([display.dauer, display.preis].filter(Boolean).join(' · ')) + '</span>' +
        (s.override && !removed ? '<p class="sub" style="margin:0;font-size:.75rem">Von dir ausgewählt — <a href="#" onclick="__bb.select(\'kur-reset-treatment\',' + idx + ');return false;" style="color:var(--rose-deep)">Systemvorschlag verwenden</a></p>' : '') +
        '<div class="rec-toggle" style="flex-wrap:wrap">' +
          (removed ? '' : '<button onclick="__bb.select(\'kur-toggle-search\',' + idx + ')">' + (s.searchOpen ? 'Suche schließen' : 'Anderes Programm wählen') + '</button>') +
          '<button class="' + (removed ? '' : 'active') + '" onclick="__bb.select(\'kur-toggle-status\',' + idx + ')">' + (removed ? 'Entfernt — wiederherstellen' : 'Übernommen') + '</button>' +
        '</div>' +
        (s.searchOpen && !removed ?
          '<div class="product-search">' +
            (ranked.length ? '<p class="sub" style="margin:0 0 .35rem;font-size:.75rem">Passende Optionen (nach Priorität):</p>' +
              '<div class="product-results">' +
                ranked.map(function (r, i) {
                  return '<button type="button" class="product-result" onclick="__bb.pickKurOption(' + idx + ',' + i + ')">' +
                    '<span>Prio ' + r.prio + ' · ' + esc(r.behandlung) + '</span><span class="k" style="font-size:.75rem">' + esc([r.dauer, r.preis].filter(Boolean).join(' · ')) + '</span></button>';
                }).join('') +
              '</div>' : '') +
            '<input type="text" class="text-input" placeholder="Oder andere Behandlung suchen …" style="margin-top:.5rem" oninput="__bb.filterTreatments(' + idx + ', this.value)" />' +
            '<div class="product-results" id="treatment-results-' + idx + '"></div>' +
          '</div>' : '') +
      '</div>';
    }

    var ranked = plan.ranked;
    var kurSlots = kurDefaultSlots(plan);
    RANKED_TREATMENTS = ranked;
    var asaWarning = kurAsaWarning(kurSlots);
    var kurGesamtpreis = kurTotal(plan);

    var body = '' +
      '<p class="eyebrow">Empfehlungen · Programm: ' + esc(plan.family.name) + '</p>' +
      '<h1 class="q">Behandlungsplan zur Prüfung</h1>' +
      '<p class="sub">Zur Hautanalyse passende Behandlungen — antippen zum Auswählen. Die Nummer zeigt deine gewählte Reihenfolge, erneutes Antippen entfernt die Behandlung wieder.</p>' +
      '<h3 class="section-label">Behandlungen</h3>' +
      '<div class="grid cols-3">' +
        ranked.map(behandlungCard).join('') +
      '</div>' +
      '<h3 class="section-label">6-Monats-Kurplan</h3>' +
      '<p class="sub" style="margin-top:-.4rem">Ein Termin pro Monat — Hauptbehandlung als Rückgrat, an zwei Terminen zur Auflockerung die zweite Priorität. Struktur, Häufigkeit und Reihenfolge frei anpassbar.</p>' +
      (asaWarning ? '<div class="kur-warning">⚠ ' + esc(asaWarning) + '</div>' : '') +
      '<div class="grid cols-3">' +
        kurSlots.map(function (info, idx) { return kurSlotCard(idx, info, ranked); }).join('') +
      '</div>' +
      '<div class="summary-list" style="margin-top:.7rem">' +
        '<div class="summary-row"><span class="k">Kur-Gesamtpreis (6 Monate)</span><span class="v">' + esc(formatPrice(kurGesamtpreis)) + '</span></div>' +
      '</div>' +
      '<h3 class="section-label">Homecare-Produkte</h3>' +
      '<p class="sub" style="margin-top:-.4rem">Komplette Routine passend zur Priorität vorgeschlagen — bei Bedarf über die Suche austauschen oder entfernen.</p>' +
      '<div class="grid cols-3">' +
        homecareSlotCard('reinigung', 'Reinigung', { product: i1.reinigung, produktpreis: i1.reinigungpreis }) +
        homecareSlotCard('tonic', 'Tonic', { product: i1.tonic, produktpreis: i1.tonicpreis }) +
        homecareSlotCard('peeling', 'Peeling', { product: i1.peeling, produktpreis: i1.peelingpreis }) +
        homecareSlotCard('serum', 'Serum', { product: i1.serum, produktpreis: i1.serumpreis }) +
        homecareSlotCard('am', 'Morgens', i1) +
        homecareSlotCard('pm', 'Abends', i2 || i1) +
        homecareSlotCard('augencreme', 'Augencreme', { product: i1.augencreme, produktpreis: i1.augencremepreis }) +
        homecareSlotCard('maske', 'Maske', { product: i1.maske, produktpreis: i1.maskepreis }) +
        homecareSlotCard('sonnenschutz', 'Sonnenschutz', { product: i1.sonnenschutz, produktpreis: i1.sonnenschutzpreis }) +
      '</div>' +
      '<div class="footer-actions">' +
        '<button class="btn-primary" onclick="__bb.goTo(\'blueprint\')">Beauty Blueprint erstellen</button>' +
      '</div>';
    screenWrap('dezent', phasePercent('ergebnis', 3, 5), contextLabel(), body);
  }

  function renderBlueprint() {
    var plan = getPlan();
    var i1 = NEED_INFO[(plan.active[0] || plan.ranked[0]).need];
    var i2 = plan.active[1] ? NEED_INFO[plan.active[1].need] : i1;
    var homeAM = homecareInfoFor('am', i1);
    var homePM = homecareInfoFor('pm', i2);
    var reinigungInfo = homecareInfoFor('reinigung', { product: i1.reinigung, produktpreis: i1.reinigungpreis });
    var tonicInfo = homecareInfoFor('tonic', { product: i1.tonic, produktpreis: i1.tonicpreis });
    var peelingInfo = homecareInfoFor('peeling', { product: i1.peeling, produktpreis: i1.peelingpreis });
    var serumInfo = homecareInfoFor('serum', { product: i1.serum, produktpreis: i1.serumpreis });
    var augencremeInfo = homecareInfoFor('augencreme', { product: i1.augencreme, produktpreis: i1.augencremepreis });
    var maskeInfo = homecareInfoFor('maske', { product: i1.maske, produktpreis: i1.maskepreis });
    var sonnenschutzInfo = homecareInfoFor('sonnenschutz', { product: i1.sonnenschutz, produktpreis: i1.sonnenschutzpreis });
    var homecareRow = !homeAM && !homePM ? 'Entfernt' :
      (productLine(homeAM) === productLine(homePM) ? productLine(homeAM) : productLine(homeAM) + ' + ' + productLine(homePM));
    var kurRows = kurDefaultSlots(plan).map(function (baseInfo, idx) {
      var info = kurInfoFor(idx, baseInfo);
      return '<div class="summary-row"><span class="k">Monat ' + (idx + 1) + '</span><span class="v">' + esc(info ? treatLine(info) : 'Entfernt') + '</span></div>';
    }).join('');
    var behandlungRows = groupedActive(plan).map(function (r, i) {
      var label = treatLine(r) + (r.count > 1 ? ' — ' + r.count + 'x im Kurplan' : '');
      return '<div class="summary-row"><span class="k">Priorität ' + (i + 1) + '</span><span class="v">' + esc(label) + '</span></div>';
    }).join('');
    var body = '' +
      '<img class="brand-logo md" src="' + LOGO_SRC + '" alt="Beauty Lounge" />' +
      '<p class="eyebrow" style="text-align:center">Beauty Blueprint</p>' +
      '<p class="blueprint-hero" style="text-align:center">' + esc(STATE.kundeName || 'Kundin') + '</p>' +
      '<p class="sub" style="margin-top:0;text-align:center">' + esc(zielText()) + '</p>' +
      '<hr class="divider"/>' +
      '<div class="summary-list">' +
        '<div class="summary-row"><span class="k">Programm</span><span class="v">' + esc(plan.family.name) + '</span></div>' +
        (behandlungRows || '<div class="summary-row"><span class="k">Behandlung</span><span class="v">Keine ausgewählt</span></div>') +
        '<div class="summary-row"><span class="k">Nächster Checkpoint</span><span class="v">in 4 Wochen</span></div>' +
        '<div class="summary-row"><span class="k">Homecare</span><span class="v">' + esc(homecareRow) + '</span></div>' +
      '</div>' +
      '<h3 class="section-label">6-Monats-Kurplan</h3>' +
      '<div class="summary-list">' + kurRows +
        '<div class="summary-row"><span class="k" style="font-weight:700">Kur-Gesamtpreis (6 Monate)</span><span class="v" style="font-weight:700">' + esc(formatPrice(kurTotal(plan))) + '</span></div>' +
      '</div>' +
      (homeAM || homePM ? '' +
        '<h3 class="section-label">Homecare-Routine</h3>' +
        '<div class="routine-cols">' +
          '<div class="routine-col"><h3>Morgens</h3><ol>' +
            '<li>' + esc(reinigungInfo ? productLine(reinigungInfo) : 'Reinigung') + '</li>' +
            (tonicInfo ? '<li>' + esc(productLine(tonicInfo)) + '</li>' : '') +
            (serumInfo ? '<li>' + esc(productLine(serumInfo)) + '</li>' : '') +
            (augencremeInfo ? '<li>' + esc(productLine(augencremeInfo)) + '</li>' : '') +
            '<li>' + esc(homeAM ? productLine(homeAM) : 'entfernt') + '</li>' +
            (sonnenschutzInfo ? '<li>' + esc(productLine(sonnenschutzInfo)) + '</li>' : '') +
          '</ol></div>' +
          '<div class="routine-col"><h3>Abends</h3><ol>' +
            '<li>' + esc(reinigungInfo ? productLine(reinigungInfo) : 'Reinigung') + '</li>' +
            (tonicInfo ? '<li>' + esc(productLine(tonicInfo)) + '</li>' : '') +
            (serumInfo ? '<li>' + esc(productLine(serumInfo)) + '</li>' : '') +
            (augencremeInfo ? '<li>' + esc(productLine(augencremeInfo)) + '</li>' : '') +
            '<li>' + esc(homePM ? productLine(homePM) : 'entfernt') + '</li>' +
          '</ol></div>' +
          (peelingInfo || maskeInfo ?
            '<div class="routine-col"><h3>1-2x wöchentlich</h3><ol>' +
              (peelingInfo ? '<li>Peeling: ' + esc(productLine(peelingInfo)) + '</li>' : '') +
              (maskeInfo ? '<li>Maske: ' + esc(productLine(maskeInfo)) + '</li>' : '') +
            '</ol></div>' : '') +
        '</div>' : '') +
      bookingCaption() +
      '<div class="footer-actions">' +
        bookingButton() +
        '<button class="btn-primary" onclick="__bb.goTo(\'abschluss\')">Freigeben & abschließen</button>' +
      '</div>';
    screenWrap('brand', phasePercent('ergebnis', 4, 5), contextLabel(), body);
  }

  function renderAbschluss() {
    var body = '' +
      '<img class="brand-logo md" src="' + LOGO_SRC + '" alt="Beauty Lounge" />' +
      '<p class="eyebrow" style="text-align:center">Abgeschlossen</p>' +
      '<h1 class="q" style="text-align:center">Beauty Blueprint gespeichert</h1>' +
      '<p class="sub" style="text-align:center">' + esc(STATE.kundeName || 'Die Kundin') + ' erhält ihren persönlichen Plan. Ein Bericht kann optional erstellt werden.</p>' +
      '<div style="text-align:center">' + bookingCaption() + '</div>' +
      '<div class="footer-actions">' +
        bookingButton() +
        '<a class="btn-link" href="' + emailSummaryHref() + '">Per E-Mail versenden ✉</a>' +
        '<button class="btn-ghost" onclick="__bb.downloadPdfReport(); this.outerHTML=\'<span class=&quot;sub&quot; style=&quot;margin:0&quot;>PDF heruntergeladen ✓</span>\'">Bericht als PDF herunterladen</button>' +
        '<button class="btn-primary" onclick="__bb.goTo(\'kunde-wahl\')">Neue Beratung starten</button>' +
      '</div>';
    screenWrap('brand', 100, contextLabel(), body, true);
  }

  function render() {
    var id = path[pointer];
    if (id === 'login') return renderLogin();
    if (id === 'kunde-wahl') return renderKundeWahl();
    if (id === 'kunde-bestehend') return renderKundeBestehend();
    if (id === 'kunde-neu') return renderKundeNeu();
    if (id === 'ziel') return renderZiel();
    if (id === 'painpoint') return renderPainpoint();
    if (id === 'anlass') return renderAnlass();
    if (id.indexOf('lifestyle:') === 0) return renderYesNoStep('lifestyle', LIFESTYLE_ITEMS, 'lifestyle', 'Lifestyle & Pflege');
    if (id.indexOf('sicherheit:') === 0) return renderYesNoStep('sicherheit', SAFETY_ITEMS, 'sicherheit', 'Sicherheitscheck');
    if (id === 'sicherheit-summary') return renderSicherheitSummary();
    if (id.indexOf('analyse:') === 0) return renderAnalyseStep();
    if (id === 'auswertung') return renderAuswertung();
    if (id === 'empfehlungen') return renderEmpfehlungen();
    if (id === 'blueprint') return renderBlueprint();
    if (id === 'abschluss') return renderAbschluss();
  }

  function renderInitialLoading() {
    var el = document.getElementById('screen');
    el.setAttribute('data-mode', 'brand');
    el.innerHTML = '<div class="content center"><div class="loading-wrap"><div class="spinner"></div>' +
      '<p style="font-size:.875rem;color:var(--text-soft)">Beratungsinhalte werden geladen …</p></div></div>';
  }

  var sheetsConfigured = Object.keys(SHEET_CONFIG).some(function (k) { return SHEET_CONFIG[k]; });
  if (sheetsConfigured) renderInitialLoading();
  loadSheetData().then(render).catch(function (e) {
    console.warn('Sheet-Daten konnten nicht vollständig geladen werden, nutze Standardwerte.', e);
    render();
  });
})();
</script>
