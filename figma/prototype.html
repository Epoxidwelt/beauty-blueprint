<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Beauty Blueprint">
<link rel="apple-touch-icon" href="../assets/logo/beauty-lounge-logo.png">
<title>Beauty Blueprint — Klickbarer Prototyp</title>
<style>
  @font-face {
    font-family: 'Iowan Old Style';
    src: local('Iowan Old Style');
  }

  :root {
    /* Exakt aus dem Original-Logo (Beauty_Lounge_Logo Transparent.png) extrahiert */
    --warmweiss: #FFFFFF;
    --wkz: #1F6B4E;   /* Signalfarbe nur für WKZ und Rabatt */
    --rose-pale: #F0F0F0;
    --rose-wash: #D6D6D6;
    --rose: #8A8A8A;
    --rose-deep: #111111;
    --anthrazit: #111111;
    --anthrazit-soft: #6B6B6B;
    --surface: var(--warmweiss);
    --surface-raised: #FFFFFF;
    --border: rgba(17, 17, 17, 0.14);
    --border-strong: rgba(17, 17, 17, 0.26);
    --text: var(--anthrazit);
    --text-soft: var(--anthrazit-soft);
    --danger: #A6473E;
    --warn: #A97A2E;
    --good: #52704F;

    --backdrop: #FFFFFF;
    --backdrop-ink: #111111;
    --backdrop-ink-soft: rgba(17, 17, 17, 0.6);

    --font-display: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root { --backdrop: #FFFFFF; --backdrop-ink: #111111; --backdrop-ink-soft: rgba(17, 17, 17, 0.6); }
  }
  :root[data-theme="dark"] { --backdrop: #FFFFFF; --backdrop-ink: #111111; --backdrop-ink-soft: rgba(17, 17, 17, 0.6); }
  :root[data-theme="light"] { --backdrop: #FFFFFF; --backdrop-ink: #111111; --backdrop-ink-soft: rgba(17, 17, 17, 0.6); }

  * { box-sizing: border-box; }
  html { font-size: 16px; }

  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    background: var(--backdrop);
    color: var(--backdrop-ink);
    font-family: var(--font-body);
    display: flex;
    overflow: hidden;
  }

  .brand-logo { display: block; margin: 0 auto 1.1rem; }
  .brand-logo.lg { height: 126px; width: auto; }
  .brand-logo.md { height: 84px; width: auto; }

  .device {
    width: 100%;
    max-width: 1280px;
    height: 100%;
    margin: 0 auto;
    display: flex;
  }

  .screen {
    flex: 1;
    background: var(--surface);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: background-color .35s ease;
  }

  .screen[data-mode="dezent"], .screen[data-mode="brand"] { background: var(--warmweiss); }

  .topbar {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 1rem 1.3rem 0.3rem;
    flex-shrink: 0;
  }
  .back-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.5);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  .back-btn:hover { border-color: var(--border-strong); }
  .back-btn[disabled] { visibility: hidden; }
  .topbar-logo { height: 48px; width: auto; flex-shrink: 0; }
  .topbar-spacer { flex: 1; }
  .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.15rem; }
  .step-label {
    font-family: var(--font-body);
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-soft);
    white-space: nowrap;
  }
  .context-label {
    font-size: 0.625rem;
    color: var(--text-soft);
    opacity: 0.75;
    white-space: nowrap;
    flex-shrink: 0;
    max-width: 9rem;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stepper {
    display: flex;
    align-items: center;
    padding: 0.5rem 1.6rem 1.1rem;
    flex-shrink: 0;
  }
  .stepper .seg { flex: 1; height: 1px; background: var(--border-strong); }
  .stepper .step-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--surface-raised);
    border: 1.5px solid var(--border-strong);
    flex-shrink: 0;
    transition: all .2s ease;
  }
  .stepper .step-dot.done { background: var(--rose); border-color: var(--rose); }
  .stepper .step-dot.current { width: 13px; height: 13px; background: var(--rose-deep); border-color: var(--rose-deep); }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 2.2rem 2rem;
    display: flex;
    flex-direction: column;
  }
  .content.center { justify-content: center; }

  .eyebrow {
    font-size: 0.6875rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-soft);
    margin: 0 0 0.4rem;
  }
  .section-label {
    font-family: var(--font-body);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--rose-deep);
    margin: 1.3rem 0 0.6rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--border);
  }
  .section-label:first-of-type { margin-top: 0.9rem; padding-top: 0; border-top: none; }
  h1.q, h2.q {
    font-family: var(--font-body);
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--text);
    margin: 0 0 1.1rem;
    text-wrap: balance;
    line-height: 1.2;
  }
  h1.q { font-size: 1.75rem; }
  h2.q { font-size: 1.35rem; }
  p.sub {
    font-size: 0.875rem;
    color: var(--text-soft);
    margin: -0.6rem 0 1.2rem;
    max-width: 34rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 0.6rem;
  }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

  .card {
    font-family: var(--font-body);
    text-align: left;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    font-size: 0.9rem;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    transition: border-color .15s ease, background-color .15s ease, transform .1s ease;
  }
  .card:hover { border-color: var(--rose-deep); }
  .card:active { transform: scale(0.98); }
  .card.selected {
    border-color: var(--rose-deep);
    background: color-mix(in srgb, var(--rose-pale) 55%, white);
  }
  .card .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--rose-deep);
    flex-shrink: 0;
    opacity: 0;
    transition: opacity .15s ease;
  }
  .card.selected .dot { opacity: 1; }
  .card.disabled { opacity: 0.45; cursor: not-allowed; }
  .card.disabled:hover { border-color: var(--border); }

  .card.center-tap { justify-content: center; text-align: center; font-size: 0.95rem; padding: 1.2rem 1rem; }

  .row-choice {
    display: flex;
    gap: 0.6rem;
  }
  .row-choice .card { flex: 1; justify-content: center; text-align: center; }

  .scale4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
  }
  .scale4 .card { flex-direction: column; gap: 0.5rem; text-align: center; justify-content: center; padding: 1rem 0.5rem; }
  .scale4 .level-fill { display: flex; gap: 3px; }
  .scale4 .level-fill span { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); }
  .scale4 .card.selected .level-fill span.on { background: var(--rose-deep); }

  .btn-primary, .btn-ghost, .btn-link {
    width: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    font-family: var(--font-body);
    font-size: 0.9375rem;
    font-weight: 600;
    border-radius: 8px;
    padding: 0.85rem 1.3rem;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }
  .btn-primary {
    letter-spacing: 0.01em;
    background: var(--anthrazit);
    color: var(--warmweiss);
    border: none;
    transition: transform .1s ease, opacity .15s ease;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary[disabled] { opacity: 0.35; cursor: not-allowed; }

  .btn-ghost {
    font-weight: 500;
    background: transparent;
    color: var(--text-soft);
    border: 1.5px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--border-strong); color: var(--text); }

  .btn-link {
    background: transparent;
    color: var(--rose-deep);
    border: 1.5px solid var(--rose-deep);
  }
  .btn-link:hover { background: var(--rose-pale); }

  .welcome-title {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--text);
    text-align: center;
    margin: 0 0 1.6rem;
  }

  .stack {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  .stack-btn {
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
    background: var(--surface-raised);
    color: var(--text);
    border: 1.5px solid var(--border-strong);
    border-radius: 12px;
    padding: 1.1rem 1rem;
    cursor: pointer;
    transition: border-color .15s ease, background-color .15s ease, transform .1s ease;
  }
  .stack-btn:hover { border-color: var(--rose-deep); }
  .stack-btn:active { transform: scale(0.99); }
  .stack-btn.primary {
    background: var(--rose-pale);
    border-color: var(--rose-deep);
    color: var(--rose-deep);
  }
  .stack-btn[disabled] {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .stack-btn .hint {
    display: block;
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--text-soft);
    margin-top: 0.15rem;
  }

  .footer-actions {
    margin-top: auto;
    padding-top: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    flex-shrink: 0;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.35rem 0.7rem;
    border-radius: 999px;
    width: fit-content;
  }
  .badge.gruen { background: rgba(82,112,79,0.14); color: var(--good); }
  .badge.gelb { background: rgba(169,122,46,0.14); color: var(--warn); }
  .badge.rot { background: rgba(166,71,62,0.14); color: var(--danger); }
  .badge .dot2 { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .text-input {
    font-family: var(--font-body);
    font-size: 1rem;
    padding: 0.85rem 1rem;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--surface-raised);
    color: var(--text);
    width: 100%;
    max-width: 22rem;
  }
  .text-input:focus { outline: 2px solid var(--rose-deep); outline-offset: 1px; }

  .avatar-row { display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center; }
  .avatar-card {
    width: 108px;
    display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    background: transparent; border: none; cursor: pointer; font-family: var(--font-body);
  }
  .avatar-circle {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--surface-raised);
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 1.4rem; color: var(--rose-deep);
    transition: border-color .15s ease, transform .15s ease;
    overflow: hidden;
  }
  .avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-card:hover .avatar-circle { border-color: var(--rose-deep); transform: translateY(-2px); }
  .avatar-name { font-size: 0.8125rem; color: var(--text); }

  .summary-list { display: flex; flex-direction: column; gap: 0.55rem; margin: 0 0 1rem; }
  .summary-row {
    display: flex; justify-content: space-between; gap: 1rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.875rem;
  }
  .summary-row .k { color: var(--text-soft); }
  .summary-row .v { color: var(--text); font-weight: 600; text-align: right; }

  .rec-card {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .rec-card.selected { border-color: var(--rose-deep); }
  .rec-kicker { font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rose-deep); }
  .rec-badges { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .rec-number-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--rose-deep); color: var(--warmweiss);
    font-family: var(--font-body); font-weight: 700; font-size: 0.75rem;
    flex-shrink: 0;
  }

  .rec-round-row { display: flex; gap: 0.6rem; align-items: center; margin-top: 0.1rem; }
  .rec-round-btn {
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    background: var(--surface-raised);
    color: var(--text);
    font-family: var(--font-body); font-size: 1.25rem; font-weight: 500; line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .rec-round-btn:active { transform: scale(0.94); }
  .rec-round-btn.add { color: var(--rose-deep); border-color: var(--rose-deep); }
  .rec-round-btn.add:hover { background: var(--rose-pale); }
  .rec-round-btn.add.active { background: var(--anthrazit); border-color: var(--anthrazit); color: var(--warmweiss); }
  .rec-round-btn.remove { color: var(--danger); border-color: var(--danger); }
  .rec-round-btn.remove:hover { background: rgba(166,71,62,0.1); }
  .rec-name { font-family: var(--font-display); font-size: 1.15rem; color: var(--text); }
  .rec-toggle {
    display: flex; gap: 0.4rem; margin-top: 0.2rem;
  }
  .rec-toggle button {
    font-family: var(--font-body);
    font-size: 0.75rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-soft);
    border-radius: 999px;
    padding: 0.3rem 0.7rem;
    cursor: pointer;
  }
  .rec-toggle button.active { background: var(--anthrazit); color: var(--warmweiss); border-color: var(--anthrazit); }

  .product-search { margin-top: 0.3rem; padding-top: 0.6rem; border-top: 1px solid var(--border); }
  .product-search .text-input { font-size: 0.875rem; padding: 0.55rem 0.7rem; }
  .product-results { display: flex; flex-direction: column; gap: 0.15rem; margin-top: 0.4rem; max-height: 220px; overflow-y: auto; }
  .product-result {
    display: flex; justify-content: space-between; align-items: center; gap: 0.6rem;
    width: 100%; text-align: left;
    font-family: var(--font-body); font-size: 0.8125rem; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.5rem 0.65rem; cursor: pointer;
  }
  .product-result:hover, .product-result:focus { border-color: var(--rose-deep); background: var(--surface-raised); }
  .product-result span:first-child { flex: 1; }

  .blueprint-hero {
    font-family: var(--font-display);
    font-size: 2rem;
    font-style: italic;
    color: var(--anthrazit);
    margin: 0.2rem 0 0.1rem;
    text-wrap: balance;
  }
  .divider { height: 1px; background: var(--border-strong); margin: 1.1rem 0; border: none; }

  .routine-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
  .kur-warning {
    background: rgba(169,122,46,0.12);
    color: var(--warn);
    border: 1px solid rgba(169,122,46,0.3);
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
    font-size: 0.8125rem;
    margin: 0.6rem 0 0;
  }
  .routine-col h3 { font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--rose-deep); margin: 0 0 0.5rem; }
  .routine-col ol { margin: 0; padding-left: 1.1rem; font-size: 0.875rem; color: var(--text); display: flex; flex-direction: column; gap: 0.3rem; }

  .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; flex: 1; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2.5px solid var(--border);
    border-top-color: var(--rose-deep);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
    * { transition-duration: 0.01ms !important; }
  }

  @media (max-width: 640px) {
    html { font-size: 17.5px; }
    .content { padding: 0.5rem 1.2rem 1.6rem; }
    .grid.cols-3, .grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
    .routine-cols { grid-template-columns: 1fr; }
    .topbar-logo { height: 57px; }
    .back-btn { width: 34px; height: 34px; }
    .step-label { font-size: 0.8125rem; }
    .context-label { font-size: 0.75rem; }
    .brand-logo.lg { height: 138px; }
    .brand-logo.md { height: 102px; }
  }

  /* iPad Pro & größere Tablets (Höhe mitgeprüft, damit ein Iphone im Querformat nicht
     mit hineinfällt): größere Grundschrift skaliert alle rem-Maße automatisch mit,
     dazu gezielt größere Touch-Ziele und ein deutlich präsenteres Logo. */
  @media (min-width: 800px) and (min-height: 700px) {
    html { font-size: 19px; }
    .topbar { padding: 1.4rem 1.8rem 0.5rem; gap: 0.9rem; }
    .topbar-logo { height: 78px; }
    .back-btn { width: 40px; height: 40px; font-size: 1.05rem; }
    .stepper { padding: 0.6rem 1.8rem 1.3rem; }
    .stepper .step-dot { width: 12px; height: 12px; }
    .stepper .step-dot.current { width: 17px; height: 17px; }
    .brand-logo.lg { height: 195px; }
    .brand-logo.md { height: 144px; }
    .avatar-card { width: 138px; }
    .avatar-circle { width: 96px; height: 96px; }
    .card .dot { width: 10px; height: 10px; }
  }

  /* ---------- Admin-Bereich ---------- */
  /* Bewusst unauffällig: kleiner, blasser Text unten auf dem Login-Screen statt eines
     eigenen Buttons — Mitarbeiterinnen sollen ihn beim normalen Einloggen nicht bemerken. */
  .admin-entry {
    display: block; margin: 2.2rem auto 0; background: none; border: none;
    color: var(--border-strong); font-size: 0.75rem; font-family: var(--font-body);
    cursor: pointer; padding: 0.5rem;
  }
  .admin-entry:hover { color: var(--text-soft); }

  .admin-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  .admin-tab-btn {
    font-family: var(--font-body); font-size: 0.8125rem; font-weight: 600;
    padding: 0.55rem 1rem; border-radius: 999px; border: 1.5px solid var(--border);
    background: var(--surface-raised); color: var(--text-soft); cursor: pointer;
  }
  .admin-tab-btn.current { background: var(--anthrazit); color: var(--warmweiss); border-color: var(--anthrazit); }

  .admin-section-title {
    font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--rose-deep); margin: 1.6rem 0 0.7rem;
  }
  .admin-section-title:first-child { margin-top: 0; }

  .admin-form { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 0.4rem; }
  .admin-form .text-input, .admin-form select { max-width: none; }
  .admin-form-row { display: flex; gap: 0.6rem; }
  .admin-form-row > * { flex: 1; min-width: 0; }
  .admin-form label.file-label {
    font-size: 0.8125rem; color: var(--text-soft); display: flex; flex-direction: column; gap: 0.3rem;
  }

  .admin-list { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.2rem; }
  .admin-item {
    display: flex; align-items: center; gap: 0.7rem;
    border: 1px solid var(--border); border-radius: 10px; padding: 0.7rem 0.85rem;
    background: var(--surface-raised);
  }
  .admin-item.inaktiv { opacity: 0.5; }
  .admin-item-avatar {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
    background: var(--rose-pale); display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 1rem; color: var(--rose-deep);
  }
  .admin-item-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .admin-item-body { flex: 1; min-width: 0; }
  .admin-item-title { font-weight: 600; font-size: 0.9rem; color: var(--text); }
  .admin-item-meta { font-size: 0.75rem; color: var(--text-soft); margin-top: 0.15rem; }
  .admin-item-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
  .admin-icon-btn {
    font-family: var(--font-body); font-size: 0.7rem; font-weight: 600;
    padding: 0.4rem 0.65rem; border-radius: 7px; border: 1.5px solid var(--border);
    background: transparent; color: var(--text-soft); cursor: pointer; white-space: nowrap;
  }
  .admin-icon-btn:hover { border-color: var(--border-strong); color: var(--text); }
  .admin-icon-btn.danger { color: var(--danger); border-color: rgba(166,71,62,0.35); }
  .admin-icon-btn.danger:hover { background: rgba(166,71,62,0.08); }
  .admin-icon-btn.good { color: var(--good); border-color: rgba(82,112,79,0.35); }

  .admin-error {
    background: rgba(166,71,62,0.1); color: var(--danger); border: 1px solid rgba(166,71,62,0.3);
    border-radius: 8px; padding: 0.65rem 0.85rem; font-size: 0.8125rem; margin: 0.6rem 0 0;
  }
  .admin-hint { font-size: 0.75rem; color: var(--text-soft); margin: -0.2rem 0 0.4rem; }

  /* Popup "Aktion bitte beachten" — erscheint auf dem Beauty-Blueprint-Screen, wenn eine
     laufende Aktion zu einer der ausgewählten Behandlungen passt. */
  .aktion-popup-overlay {
    position: fixed; inset: 0; background: rgba(17,17,17,0.5);
    display: flex; align-items: center; justify-content: center; padding: 1.4rem;
    z-index: 500;
  }
  .aktion-popup {
    background: var(--surface-raised); border-radius: 16px; padding: 1.6rem 1.5rem;
    max-width: 22rem; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    text-align: center;
  }
  .aktion-popup-eyebrow {
    font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--good); margin: 0 0 0.5rem;
  }
  .aktion-popup h3 {
    font-family: var(--font-display); font-size: 1.3rem; color: var(--text); margin: 0 0 0.6rem;
  }
  .aktion-popup p.aktion-popup-text { font-size: 0.9rem; color: var(--text); margin: 0 0 0.6rem; }
  .aktion-popup-zeitraum { font-size: 0.75rem; color: var(--text-soft); margin: 0 0 1.2rem; }

  /* Dezenter, nicht-blockierender Hinweis direkt beim Auswählen der Behandlung (im
     Gegensatz zum Popup auf dem Beauty-Blueprint-Screen) — erscheint/verschwindet live,
     je nachdem was gerade ausgewählt ist. */
  .aktion-banner {
    background: rgba(82,112,79,0.12); border: 1px solid var(--good); border-radius: 10px;
    padding: 0.75rem 1rem; margin: 0 0 1rem; font-size: 0.85rem; line-height: 1.5;
    color: var(--good);
  }
  .aktion-banner strong { color: var(--good); }

  /* Übersichtsliste der aktuellen Aktionen für Mitarbeiterinnen (read-only, im Gegensatz
     zur Admin-Verwaltung) — erreichbar über den Button auf dem Kunde-Wahl-Screen. */
  .aktion-status-badge {
    display: inline-block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 0.2rem 0.55rem; border-radius: 999px; margin-bottom: 0.4rem;
  }
  .aktion-status-badge.laeuft { background: rgba(82,112,79,0.14); color: var(--good); }
  .aktion-status-badge.bevorstehend { background: rgba(166,71,62,0.14); color: var(--danger); }
  .aktion-status-badge.beendet { background: rgba(17,17,17,0.1); color: var(--text-soft); }

  /* Nicht schließbarer Hinweis direkt nach dem Login (Kunde-Wahl-Screen) — läuft gerade
     eine Aktion oder beginnt eine innerhalb der nächsten 7 Tage, erscheint er ohne
     Möglichkeit zum Wegklicken, damit er garantiert wahrgenommen wird. */
  /* Ampel-Prinzip wie bei den Aktionen-Listen: läuft = grün, bevorstehend = rot, in den
     letzten 2 Tagen davor zusätzlich orange als dringlichere Zwischenstufe. */
  .aktion-login-hinweis {
    background: rgba(82,112,79,0.12); border: 1.5px solid var(--good); border-radius: 10px;
    padding: 0.8rem 1rem; margin: 0 0 1rem; font-size: 0.85rem; line-height: 1.5;
    color: var(--good);
  }
  .aktion-login-hinweis.countdown { background: rgba(166,71,62,0.12); border-color: var(--danger); color: var(--danger); }
  .aktion-login-hinweis.countdown-bald { background: rgba(169,122,46,0.14); border-color: var(--warn); color: var(--warn); }
  .aktion-login-hinweis strong { color: inherit; }

  /* Admin: Löschen-Bestätigung / doppeltes Nachfragen für Aktions- und Mitarbeiter-Formulare */
  .admin-item.ausgeblendet { opacity: 0.5; }

  /* ===== Bestellung (interne Bestell-App) ===== */

  }

  .best-filters { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0 0 1rem; }

  }

  .best-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 0.9rem; }

    position: relative; background: #fff; border-radius: 20px; padding: 0.9rem; box-shadow: 0 6px 20px rgba(0,0,0,0.12); display: flex; flex-direction: column; gap: 0.35rem;

  .bst-workhead { display: flex; align-items: center; gap: .8rem; margin-bottom: .8rem; } .bst-workhead b { font-size: 1.3rem; }

  .bst-editbanner { display: flex; align-items: center; justify-content: space-between; gap: .8rem; }
  .best-img { background: #fff; border: 1px solid var(--rose-pale); border-radius: 14px; display: flex; align-items: center; justify-content: center; padding: 0.5rem; }

  .best-fav.on { color: var(--rose-deep); }

  function dateOnly(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function parseIsoDate(str) {
    if (!str) return null;
    var parts = str.split('-');
    if (parts.length !== 3) return null;
    return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }
  function isDateInRange(date, vonStr, bisStr) {
    var t = dateOnly(date).getTime();
    var von = parseIsoDate(vonStr);
    var bis = parseIsoDate(bisStr);
    if (von && t < von.getTime()) return false;
    if (bis && t > bis.getTime()) return false;
    return true;
  }

  // Findet die erste aktive, zeitlich passende Aktion, deren Kategorie zu mindestens
  // einer der im Behandlungsplan ausgewählten Behandlungen passt — Grundlage für den
  // Hinweis "Aktion bitte beachten" auf dem Beauty-Blueprint-Screen.
  function findRelevantAktion(plan) {
    var needs = plan.active.map(function (r) { return r.need; });
    // Namen der tatsächlich ausgewählten Behandlungen und der zu den aktiven Needs
    // vorgeschlagenen Homecare-Produkte — ermöglicht eine Aktion exakt an eine einzelne
    // Behandlung/ein einzelnes Produkt zu binden (admin's "Verknüpfung"), statt nur an die
    // grobe Beauty-Need-Kategorie.
    var behandlungNamen = plan.active.map(function (r) { return r.behandlung; });
    var produktNamen = [];
    needs.forEach(function (need) {
      var info = NEED_INFO[need];
      if (!info) return;
      ['product', 'reinigung', 'tonic', 'peeling', 'serum', 'augencreme', 'maske', 'sonnenschutz'].forEach(function (f) {
        if (info[f]) produktNamen.push(info[f]);
      });
    });
    var today = new Date();
    var matches = ADMIN_DATA.aktionen.filter(function (a) {
      if (!a.aktiv) return false;
      if (!isDateInRange(today, a.von, a.bis)) return false;
      var kategoriePasst = a.kategorie === 'alle' || needs.indexOf(a.kategorie) > -1;
      var verknuepfungPasst = !!a.verknuepfterName && (
        (a.verknuepfterTyp === 'behandlung' && behandlungNamen.indexOf(a.verknuepfterName) > -1) ||
        (a.verknuepfterTyp === 'produkt' && produktNamen.indexOf(a.verknuepfterName) > -1)
      );
      return kategoriePasst || verknuepfungPasst;
    });
    return matches.length ? matches[0] : null;
  }

  // Nicht schließbarer Login-Hinweis: alle gerade laufenden Aktionen, plus alle, die
  // innerhalb der nächsten 7 Tage beginnen (Countdown), damit Mitarbeiterinnen eine Aktion
  // schon vorab ankündigen können, bevor sie offiziell startet.
  function aktivOderBaldStartendeAktionen() {
    var today = dateOnly(new Date());
    var laufend = [];
    var bald = [];
    ADMIN_DATA.aktionen.forEach(function (a) {
      if (!a.aktiv) return;
      var von = parseIsoDate(a.von);
      var bis = parseIsoDate(a.bis);
      if (von && bis && today.getTime() >= von.getTime() && today.getTime() <= bis.getTime()) {
        laufend.push({ aktion: a, status: 'laeuft' });
      } else if (von) {
        var tage = Math.round((von.getTime() - today.getTime()) / 86400000);
        if (tage > 0 && tage <= 7) bald.push({ aktion: a, status: 'countdown', tage: tage });
      }
    });
    // Aufbau wie beim Ampel-Prinzip der Listen: erst was gerade läuft, danach was demnächst
    // startet (dort die dringlichsten zuerst) — nie umgekehrt, egal in welcher Reihenfolge
    // die Aktionen angelegt wurden.
    bald.sort(function (x, y) { return x.tage - y.tage; });
    return laufend.concat(bald);
  }

  // Für die (read-only) Aktionsübersicht der Mitarbeiterinnen: läuft eine Aktion gerade,
  // beginnt sie erst noch, oder ist ihr Zeitraum schon vorbei?
  function aktionStatus(a) {
    var today = dateOnly(new Date()).getTime();
    var von = parseIsoDate(a.von);
    var bis = parseIsoDate(a.bis);
    if (von && today < von.getTime()) return 'bevorstehend';
    if (bis && today > bis.getTime()) return 'beendet';
    return 'laeuft';
  }
  var AKTION_STATUS_LABEL = { laeuft: 'Läuft gerade', bevorstehend: 'Bevorstehend', beendet: 'Beendet' };

  // Ampel-Prinzip für jede Aktionen-Liste (Admin-Verwaltung wie Mitarbeiter-Übersicht):
  // laufende (grün) zuerst, dann bevorstehende (rot), zuletzt beendete (grau) — auf einen
  // Blick sofort erkennbar, was gerade zählt. Innerhalb einer Gruppe nach Startdatum sortiert.
  var AKTION_STATUS_ORDER = { laeuft: 0, bevorstehend: 1, beendet: 2 };
  function sortedAktionenMitStatus() {
    return ADMIN_DATA.aktionen.map(function (a) {
      return { aktion: a, status: aktionStatus(a) };
    }).sort(function (x, y) {
      var orderDiff = AKTION_STATUS_ORDER[x.status] - AKTION_STATUS_ORDER[y.status];
      if (orderDiff !== 0) return orderDiff;
      var xVon = parseIsoDate(x.aktion.von);
      var yVon = parseIsoDate(y.aktion.von);
      return (xVon ? xVon.getTime() : 0) - (yVon ? yVon.getTime() : 0);
    });
  }

  var TEAM_PHOTO_PDF_SIZE = 166;

  // ---------- CSV laden & parsen ----------
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
        } else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
      } else field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    if (!rows.length) return [];
    var headers = rows[0].map(function (h) { return h.trim(); });
    return rows.slice(1).filter(function (r) { return r.some(function (v) { return v.trim() !== ''; }); }).map(function (r) {
      var obj = {};
      headers.forEach(function (h, i) { obj[h] = (r[i] || '').trim(); });
      return obj;
    });
  }

  function isActive(row) {
    var v = (row.aktiv || '').toLowerCase();
    return v === '' || v === 'ja' || v === 'true' || v === '1' || v === 'yes';
  }

  function fetchSheet(url) {
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    }).then(parseCSV);
  }

  function loadSheetData() {
    var anyConfigured = Object.keys(SHEET_CONFIG).some(function (k) { return SHEET_CONFIG[k]; });
    if (!anyConfigured) return Promise.resolve();

    var tasks = [];

    if (SHEET_CONFIG.ziele) tasks.push(fetchSheet(SHEET_CONFIG.ziele).then(function (rows) {
      var r = rows.filter(isActive).map(function (row) { return { key: row.key, label: row.label }; });
      if (r.length) ZIELE = r;

  // Filtert ALL_PRODUCTS live nach Tippen und schreibt nur die Ergebnisliste neu

  function filterProducts(slot, query) {
    var q = (query || '').trim().toLowerCase();
    var results = q.length < 2 ? [] : ALL_PRODUCTS.filter(function (p) {
      return p.name.toLowerCase().indexOf(q) > -1;
    }).slice(0, 8);
    PRODUCT_SEARCH_RESULTS[slot] = results;
    var box = document.getElementById('product-results-' + slot);
    if (!box) return;
    if (!q.length || q.length < 2) {
      box.innerHTML = '<p class="sub" style="margin:.4rem 0 0;font-size:.75rem">Mindestens 2 Zeichen eingeben …</p>';
    } else if (!results.length) {
      box.innerHTML = '<p class="sub" style="margin:.4rem 0 0;font-size:.75rem">Keine Treffer.</p>';
    } else {
      box.innerHTML = results.map(function (p, i) {
        return '<button type="button" class="product-result" onclick="__bb.pickProduct(\'' + slot + '\',' + i + ')">' +
          '<span>' + esc(p.name) + '</span><span class="k" style="font-size:.75rem">' + esc(p.preis) + '</span></button>';
      }).join('');
    }
  }

  function toggleMulti(arr, key) {

  function currentFlowScreen(prefix) {
    var top = path[pointer];
    if (top.indexOf(prefix + ':') === 0) return parseInt(top.split(':')[1], 10);
    return 0;
  }

  function advanceFlow(prefix, items, nextId) {
    var idx = currentFlowScreen(prefix);
    if (idx + 1 < items.length) goTo(prefix + ':' + (idx + 1));
    else goTo(nextId);
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // Ordnet den Screen einer von 5 sichtbaren Stufen zu (Kundenauswahl-Screens zeigen
  // bewusst keinen Stepper — die eigentliche Beratung beginnt erst bei "Ziel").
  function stepInfo(screenId) {
    if (screenId === 'ziel') return { index: 1, total: 5 };
    if (screenId === 'painpoint' || screenId === 'anlass' || screenId.indexOf('lifestyle:') === 0) return { index: 2, total: 5 };
    if (screenId.indexOf('sicherheit') === 0) return { index: 3, total: 5 };
    if (screenId.indexOf('analyse:') === 0) return { index: 4, total: 5 };
    if (['auswertung', 'empfehlungen', 'blueprint', 'abschluss'].indexOf(screenId) > -1) return { index: 5, total: 5 };
    return null;
  }

  function stepperHtml(step) {
    var dots = '';
    for (var i = 1; i <= step.total; i++) {
      var cls = i < step.index ? 'done' : (i === step.index ? 'current' : '');
      dots += '<span class="step-dot ' + cls + '"></span>';
      if (i < step.total) dots += '<span class="seg"></span>';
    }
    return '<div class="stepper">' + dots + '</div>';
  }

      '<div class="topbar">' +
        '<button class="back-btn" ' + backDisabled + ' onclick="__bb.goBack()" aria-label="Zurück">&#8592;</button>' +
        (showLogo ? '<img class="topbar-logo" src="' + LOGO_SRC + '" alt="Beauty Lounge" />' : '') +
        '<div class="topbar-spacer"></div>' +
        '<div class="topbar-right">' +
          (step ? '<div class="step-label">Schritt ' + step.index + '</div>' : '') +
          (contextText ? '<div class="context-label">' + esc(contextText) + '</div>' : '') +

  // Merkt sich, welcher Screen zuletzt gezeichnet wurde: ein erneutes render() DERSELBEN
  // Ansicht (z.B. nach Produktauswahl aus einem Dropdown) soll die Scroll-Position behalten,
  // statt die Mitarbeiterin nach jedem Klick zurück nach oben zu werfen. Ein echter
  // Screen-Wechsel (goTo/goBack) startet dagegen bewusst wieder oben.
  var lastRenderedScreenId = null;

  function screenWrap(mode, percent, contextText, bodyHtml, center) {
    var el = document.getElementById('screen');
    var currentId = path[pointer];
    var oldContent = el.querySelector('.content');
    var scrollTop = (currentId === lastRenderedScreenId && oldContent) ? oldContent.scrollTop : 0;
    // Tippen in ein Suchfeld öffnet auf Tablet/Handy die Bildschirmtastatur; ein Tap auf ein
    // Suchergebnis nimmt den Fokus weg, wodurch sich die Tastatur schließt — das verändert die
    // sichtbare Höhe der Seite NACH diesem render() nochmal und kann unsere Scroll-Position
    // überschreiben. Vorab den Fokus zu entfernen stößt das Schließen schon hier an; das erneute
    // Setzen von scrollTop kurz danach (rAF + Timeout) gewinnt den Wettlauf mit der
    // Tastatur-Schließanimation zuverlässig, auch wenn diese noch etwas länger braucht.
    if (document.activeElement && document.activeElement !== document.body && document.activeElement.blur) {
      document.activeElement.blur();
    }
    el.setAttribute('data-mode', mode);
    el.innerHTML = topbar(mode, percent, contextText) + '<div class="content' + (center ? ' center' : '') + '">' + bodyHtml + '</div>';
    var newContent = el.querySelector('.content');
    if (newContent) {
      newContent.scrollTop = scrollTop;
      requestAnimationFrame(function () { newContent.scrollTop = scrollTop; });
      setTimeout(function () { newContent.scrollTop = scrollTop; }, 350);
    }
    lastRenderedScreenId = currentId;
  }

  function phasePercent(phase, idx, count) {
    var r = PHASE_RANGE[phase];
    if (idx === undefined) return r[1];
    return Math.round(r[0] + (idx + 1) / count * (r[1] - r[0]));
  }

  function computeRiskDetails() {
    var maxRisk = 'gruen';
    var triggers = [];
    SAFETY_ITEMS.forEach(function (it) {
      if (STATE.sicherheit[it.key] === 'Ja') {
        triggers.push(it);
        if (it.risk === 'rot') maxRisk = 'rot';
        else if (it.risk === 'gelb' && maxRisk !== 'rot') maxRisk = 'gelb';
      }
    });
    triggers.sort(function (a, b) { return (a.risk === 'rot' ? 0 : 1) - (b.risk === 'rot' ? 0 : 1); });
    return { level: maxRisk, triggers: triggers };
  }

  var RISK_EXPLAIN = {
    gruen: 'Keiner der geprüften Punkte wurde bejaht. Die Behandlung kann wie geplant vorbereitet werden.',

    rot: 'Mindestens ein Ausschlusskriterium liegt vor. Diese Behandlung darf ohne Rücksprache (z. B. mit der Studioleitung) nicht automatisch freigegeben werden.'
  };

  function computeNeeds() {
    var scores = {};
    ANALYSE_ITEMS.forEach(function (it) {
      var v = STATE.analyse[it.key];
      if (v === undefined) v = 0;
      if (!scores[it.need]) scores[it.need] = { sum: 0, count: 0 };
      scores[it.need].sum += v;
      scores[it.need].count += 1;
    });
    var arr = Object.keys(scores).map(function (need) {
      return { need: need, avg: scores[need].sum / scores[need].count };
    });
    arr.sort(function (a, b) { return b.avg - a.avg; });
    return arr;
  }

  // Textbausteine (Behandlungen, Kurplan, Homecare), die sowohl die interne CRM-Mail als
  // auch der Klartext-Fallback der Kunden-Mail gemeinsam nutzen. "mitBegruendung" hängt bei
  // den Behandlungen zusätzlich die fachliche Begründung an (nur für die interne CRM-Mail
  // gedacht — die Kundin bekommt diesen Kontext bewusst nicht).
  function planSummaryLines(plan, mitBegruendung) {
    var i1 = NEED_INFO[(plan.active[0] || plan.ranked[0]).need];
    var i2 = plan.active[1] ? NEED_INFO[plan.active[1].need] : i1;
    var lines = ['Behandlungen:'];
    if (plan.active.length) {
      groupedActive(plan).forEach(function (r) {
        var line = '- ' + treatLine(r) + (r.count > 1 ? ' — ' + r.count + 'x im Kurplan' : '');
        if (mitBegruendung) line += ' [Begründung: ' + needReason(r.need) + ']';
        lines.push(line);
      });
    } else {
      lines.push('- keine ausgewählt');
    }
    lines.push('');
    var kurSlotsForEmail = kurDefaultSlots(plan);
    lines.push(kurSlotsForEmail.length + '-Monats-Kurplan:');
    kurSlotsForEmail.forEach(function (baseInfo, idx) {
      var info = kurInfoFor(idx, baseInfo);
      lines.push('Monat ' + (idx + 1) + ': ' + (info ? treatLine(info) : 'entfernt'));
    });
    lines.push('Kur-Gesamtpreis (' + kurSlotsForEmail.length + ' Monate): ' + formatPrice(kurTotal(plan)));
    lines.push('');
    lines.push('Homecare-Produkte:');
    var homeAM = homecareInfoFor('am', i1);
    var homePM = homecareInfoFor('pm', i2);
    var reinigungInfo = homecareInfoFor('reinigung', { product: i1.reinigung, produktpreis: i1.reinigungpreis });
    var tonicInfo = homecareInfoFor('tonic', { product: i1.tonic, produktpreis: i1.tonicpreis });
    var peelingInfo = homecareInfoFor('peeling', { product: i1.peeling, produktpreis: i1.peelingpreis });
    var serumInfo = homecareInfoFor('serum', { product: i1.serum, produktpreis: i1.serumpreis });
    var augencremeInfo = homecareInfoFor('augencreme', { product: i1.augencreme, produktpreis: i1.augencremepreis });
    var maskeInfo = homecareInfoFor('maske', { product: i1.maske, produktpreis: i1.maskepreis });
    var sonnenschutzInfo = homecareInfoFor('sonnenschutz', { product: i1.sonnenschutz, produktpreis: i1.sonnenschutzpreis });
    if (reinigungInfo) lines.push('- Reinigung: ' + productLine(reinigungInfo));
    if (tonicInfo) lines.push('- Tonic: ' + productLine(tonicInfo));
    if (serumInfo) lines.push('- Serum: ' + productLine(serumInfo));
    if (augencremeInfo) lines.push('- Augencreme: ' + productLine(augencremeInfo));
    if (homeAM) lines.push('- Morgens: ' + productLine(homeAM));
    if (homePM) lines.push('- Abends: ' + productLine(homePM));
    if (sonnenschutzInfo) lines.push('- Sonnenschutz: ' + productLine(sonnenschutzInfo));
    if (peelingInfo) lines.push('- Peeling (1-2x/Woche): ' + productLine(peelingInfo));
    if (maskeInfo) lines.push('- Maske (1-2x/Woche): ' + productLine(maskeInfo));
    if (!reinigungInfo && !tonicInfo && !homeAM && !peelingInfo && !serumInfo && !augencremeInfo && !homePM && !maskeInfo && !sonnenschutzInfo) lines.push('- keine ausgewählt');
    return lines;
  }

  // Behandlung. Reiner Klartext per mailto:, da das für eine interne Notiz völlig reicht.
  function emailCrmHref() {
    var plan = getPlan();
    var risk = computeRiskDetails();
    var riskLabel = { gruen: 'Grundsätzlich geeignet', gelb: 'Fachlich prüfen', rot: 'Keine automatische Freigabe' }[risk.level];
    var lines = [
      'Beauty Blueprint — CRM-Eintrag',
      '',
      'Datum: ' + formatDateDE(new Date()),
      'Beraterin: ' + (STATE.mitarbeiterin || '—'),
      'Kundin: ' + (STATE.kundeName || '—'),
      'Anlass: ' + (anlassText() || '—'),
      'Ziele: ' + zielText()
    ];
    if (painpointText()) lines.push('Genannte Anliegen: ' + painpointText());
    lines.push('');
    lines.push('Sicherheitscheck: ' + riskLabel);
    if (risk.triggers.length) {
      risk.triggers.forEach(function (t) { lines.push('- ' + t.frage); });
    } else {
      lines.push('- keine Punkte bejaht');
    }
    lines.push('');
    lines = lines.concat(planSummaryLines(plan, true));
    lines.push('');
    lines.push('Buchungslink:');
    lines.push(BOOKING_URL);
    var body = lines.join('\n');
    var subject = '[CRM] Beauty Blueprint – ' + (STATE.kundeName || 'Kundin') + ' – ' + formatDateDE(new Date());
    return 'mailto:info@beautylounge-neuss.de?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);

  // Kopiert die formatierte Kunden-Mail (inkl. echtem Hyperlink hinter dem Buchungs-Button)
  // als HTML in die Zwischenablage und öffnet danach das Mailprogramm mit vorausgefülltem
  // Betreff — die Mitarbeiterin muss dort nur noch die Kundin als Empfänger eintragen und
  // den Text einfügen (⌘V/Strg+V). Ist die Clipboard-API nicht verfügbar oder lehnt sie ab,
  // fällt die Funktion automatisch auf den bisherigen Klartext-mailto:-Weg zurück (dann
  // erscheint der Buchungslink wieder als sichtbare URL statt als Hyperlink).
  function sendKundeEmail(btn) {
    var html = buildKundeEmailHtml();
    var plain = buildKundeEmailPlain();
    var mailtoBlank = 'mailto:?subject=' + encodeURIComponent(kundeEmailSubject());
    var mailtoWithBody = mailtoBlank + '&body=' + encodeURIComponent(plain);
    var originalLabel = btn ? btn.textContent : null;
    function showLabel(text) {
      if (!btn) return;
      btn.textContent = text;
      setTimeout(function () { btn.textContent = originalLabel; }, 3000);
    }
    if (navigator.clipboard && window.ClipboardItem) {
      try {
        var item = new ClipboardItem({
          'text/html': new Blob([html], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        });
        navigator.clipboard.write([item]).then(function () {
          showLabel('In Zwischenablage kopiert ✓');
          window.location.href = mailtoBlank;
        }, function () {
          window.location.href = mailtoWithBody;
        });
        return;
      } catch (e) {
        // fällt durch zum Klartext-Fallback unten
      }
    }
    window.location.href = mailtoWithBody;
  }

  // ---------- PDF-Bericht: eigener, minimaler PDF-Schreiber ----------
  // Bewusst ohne externe Bibliothek (z.B. jsPDF) — stattdessen wird die PDF-Datei direkt als
  // Byte-Sequenz nach PDF-Spezifikation zusammengesetzt (Objekte, Content-Stream mit
  // Text-/Grafik-Operatoren, xref-Tabelle). Das Logo wird als vorab auf Weiß geflattetes JPEG
  // eingebettet (DCTDecode) — dafür ist kein PNG-Decoder nötig, das JPEG wird 1:1 durchgereicht.
  // Alle Texte laufen durch WinAnsiEncoding (Latin-1-kompatibel), damit deutsche Umlaute korrekt
  // erscheinen.
  function base64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function stringToBytes(str) {
    var bytes = new Uint8Array(str.length);
    for (var i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xFF;
    return bytes;
  }

  // Unicode-Codepoints oberhalb von 255, die WinAnsiEncoding (Windows-1252) trotzdem als
  // druckbares Zeichen kennt — allen voran das Euro-Zeichen (€), das in allen Preisangaben
  // vorkommt. Ohne diese Tabelle würde jeder Preis im PDF ein "?" statt "€" zeigen.
  var WIN1252_HIGH = {
    8364: 0x80, 8218: 0x82, 402: 0x83, 8222: 0x84, 8230: 0x85, 8224: 0x86, 8225: 0x87,
    710: 0x88, 8240: 0x89, 352: 0x8A, 8249: 0x8B, 338: 0x8C, 381: 0x8E, 8216: 0x91,
    8217: 0x92, 8220: 0x93, 8221: 0x94, 8226: 0x95, 8211: 0x96, 8212: 0x97, 732: 0x98,
    8482: 0x99, 353: 0x9A, 8250: 0x9B, 339: 0x9C, 382: 0x9E, 376: 0x9F
  };
  function pdfEscape(str) {
    var out = '';
    for (var i = 0; i < str.length; i++) {
      var code = str.charCodeAt(i);
      var c = code <= 255 ? code : (WIN1252_HIGH[code] !== undefined ? WIN1252_HIGH[code] : 63);
      var ch = String.fromCharCode(c);
      if (ch === '\\' || ch === '(' || ch === ')') out += '\\' + ch;
      else out += ch;
    }
    return out;
  }

  function pdfWrapText(text, maxWidth, fontSize) {
    var avgCharW = fontSize * 0.5;
    var maxChars = Math.max(8, Math.floor(maxWidth / avgCharW));
    if (text.length <= maxChars) return [text];
    var words = text.split(' ');
    var lines = [];
    var cur = '';
    words.forEach(function (w) {
      var test = cur ? cur + ' ' + w : w;
      if (test.length > maxChars && cur) { lines.push(cur); cur = w; }
      else cur = test;
    });
    if (cur) lines.push(cur);
    return lines;
  }

  function ByteWriter() {
    this.chunks = [];
    this.length = 0;
  }
  ByteWriter.prototype.writeString = function (str) {
    var b = stringToBytes(str);
    this.chunks.push(b);
    this.length += b.length;
  };
  ByteWriter.prototype.writeBytes = function (bytes) {
    this.chunks.push(bytes);
    this.length += bytes.length;
  };
  ByteWriter.prototype.toUint8Array = function () {
    var out = new Uint8Array(this.length);
    var offset = 0;
    this.chunks.forEach(function (c) { out.set(c, offset); offset += c.length; });
    return out;
  };

  function pad10(n) {
    var s = String(n);
    while (s.length < 10) s = '0' + s;
    return s;
  }

  // Baut den kompletten Bericht als PDF-Bytes. Layout entspricht dem Beauty-Blueprint-Screen:

  function formatDateDE(d) {
    var months = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

  function buildBeautyBlueprintPdfBytes() {

    var pages = [];

    function ensureSpace(h) {

    function setFill(hex) {

      curOps.push(r.toFixed(3) + ' ' + g.toFixed(3) + ' ' + b.toFixed(3) + ' rg');
    }
    function setStroke(hex) {
      var r = parseInt(hex.substr(0, 2), 16) / 255, g = parseInt(hex.substr(2, 2), 16) / 255, b = parseInt(hex.substr(4, 2), 16) / 255;
      curOps.push(r.toFixed(3) + ' ' + g.toFixed(3) + ' ' + b.toFixed(3) + ' RG');
    }
    function textAt(str, xPos, yPos, size, font, hex) {
      setFill(hex);
      curOps.push('BT /' + font + ' ' + size.toFixed(1) + ' Tf ' + xPos.toFixed(2) + ' ' + yPos.toFixed(2) + ' Td (' + pdfEscape(str) + ') Tj ET');
    }
    function text(str, x, size, font, hex) {
      textAt(str, x, y, size, font, hex);
    }
    function trackedTextAt(str, xPos, yPos, size, font, hex, spacing) {
      setFill(hex);
      // Tc (Zeichenabstand) ist Teil des Grafikstatus und bleibt über BT/ET hinweg aktiv —
      // muss danach explizit zurückgesetzt werden, sonst "erbt" jeder folgende text()-Aufruf
      // auf derselben Seite denselben Abstand.
      curOps.push('BT /' + font + ' ' + size.toFixed(1) + ' Tf ' + spacing.toFixed(2) + ' Tc ' + xPos.toFixed(2) + ' ' + yPos.toFixed(2) + ' Td (' + pdfEscape(str) + ') Tj 0 Tc ET');
    }
    function trackedWidth(str, size, spacing) {
      return str.length * size * 0.5 + Math.max(0, str.length - 1) * spacing;
    }
    function trackedTextCentered(str, size, font, hex, spacing) {
      var w = trackedWidth(str, size, spacing);
      trackedTextAt(str, (PAGE_W - w) / 2, y, size, font, hex, spacing);
    }
    function textCentered(str, size, font, hex) {
      var w = str.length * size * 0.5;
      text(str, (PAGE_W - w) / 2, size, font, hex);
    }
    function centeredWrapped(str, maxW, size, font, hex) {
      var lines = pdfWrapText(str, maxW, size);
      lines.forEach(function (l, i) {

    function rect(x, ry, w, h, hex) {

    }
    function circlePath(cx, cy, r) {

        (cx + r).toFixed(2) + ' ' + cy.toFixed(2) + ' m ' +
        (cx + r).toFixed(2) + ' ' + (cy + r * k).toFixed(2) + ' ' + (cx + r * k).toFixed(2) + ' ' + (cy + r).toFixed(2) + ' ' + cx.toFixed(2) + ' ' + (cy + r).toFixed(2) + ' c ' +
        (cx - r * k).toFixed(2) + ' ' + (cy + r).toFixed(2) + ' ' + (cx - r).toFixed(2) + ' ' + (cy + r * k).toFixed(2) + ' ' + (cx - r).toFixed(2) + ' ' + cy.toFixed(2) + ' c ' +
        (cx - r).toFixed(2) + ' ' + (cy - r * k).toFixed(2) + ' ' + (cx - r * k).toFixed(2) + ' ' + (cy - r).toFixed(2) + ' ' + cx.toFixed(2) + ' ' + (cy - r).toFixed(2) + ' c ' +
        (cx + r * k).toFixed(2) + ' ' + (cy - r).toFixed(2) + ' ' + (cx + r).toFixed(2) + ' ' + (cy - r * k).toFixed(2) + ' ' + (cx + r).toFixed(2) + ' ' + cy.toFixed(2) + ' c h'

    text('Kur-Gesamtpreis (' + kurSlotsForPdf.length + ' Monate)', tableX, 11.5, 'F2', WHITE);
    var totalX = tableX + tableW - kurGesamt.length * 11.5 * 0.55;
    text(kurGesamt, totalX, 11.5, 'F2', WHITE);
    y -= (totalBarH - 8);

    // Homecare-Routine
    sectionEyebrow('Für zuhause');
    heading('Homecare-Routine');
    plainLine('Morgens', { font: 'F2', size: 11, color: ROSE_DEEP });
    [reinigungInfo, tonicInfo, serumInfo, augencremeInfo, homeAM, sonnenschutzInfo].forEach(function (info) {
      if (info) bulletLine(productLine(info));
    });
    y -= 6;
    plainLine('Abends', { font: 'F2', size: 11, color: ROSE_DEEP });
    [reinigungInfo, tonicInfo, serumInfo, augencremeInfo, homePM].forEach(function (info) {
      if (info) bulletLine(productLine(info));
    });
    if (peelingInfo || maskeInfo) {
      y -= 6;
      plainLine('1-2x wöchentlich', { font: 'F2', size: 11, color: ROSE_DEEP });
      if (peelingInfo) bulletLine('Peeling: ' + productLine(peelingInfo));
      if (maskeInfo) bulletLine('Maske: ' + productLine(maskeInfo));
    }
    y -= 12;

    // Terminbuchung als CTA-Panel
    var pagesBeforeCta = pages.length;
    ensureSpace(104);
    var ctaH = 104;
    // Springt der Block auf eine frische, sonst leere Seite, wirkt er als ruhiger
    // Abschluss mittig auf der Seite statt oben klebend mit viel Leerraum darunter.
    if (pages.length > pagesBeforeCta) y = PAGE_H / 2 + ctaH / 2 + 60;
    var ctaTop = y, ctaBottom = ctaTop - ctaH;
    rect(tableX - 8, ctaBottom, tableW + 16, ctaH, BLUSH);
    y = ctaTop - 32;
    textCentered('Bereit für den nächsten Schritt?', 13, 'F4', ROSE_DEEP);
    y -= 38;
    var btnW = 220, btnH = 32, btnX = (PAGE_W - btnW) / 2, btnY = y - btnH;
    rect(btnX, btnY, btnW, btnH, INK);
    var btnLabel = 'Termin online buchen';
    var btnFontSize = 10.5;
    var btnLabelW = btnLabel.length * btnFontSize * 0.5;
    y = btnY + (btnH - btnFontSize * 0.7) / 2;
    text(btnLabel, (PAGE_W - btnLabelW) / 2, btnFontSize, 'F2', WHITE);
    linkTargets.push({ page: pages.length, x: btnX, y: btnY, w: btnW, h: btnH, url: BOOKING_URL });
    y = ctaBottom - 20;

    newPage();
    var pageCount = pages.length;
    for (var p = 1; p < pageCount; p++) footer(p, pageCount);

    // ---------- Serialisierung ----------
    var objs = [];
    function addObj(body) { objs.push(body); return objs.length; }

    var fontRegNum = addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    var fontBoldNum = addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    var fontSerifBoldNum = addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Times-Bold /Encoding /WinAnsiEncoding >>');
    var fontSerifItalicNum = addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Times-Italic /Encoding /WinAnsiEncoding >>');
    var logoBytes = base64ToBytes(LOGO_PDF_JPEG_B64);
    var imgNum = addObj({
      stream: logoBytes,
      dict: '<< /Type /XObject /Subtype /Image /Width ' + LOGO_PDF_W + ' /Height ' + LOGO_PDF_H +
        ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + logoBytes.length + ' >>'
    });
    var photoImgNum = null;
    if (consultantPhotoB64) {
      var photoBytes = base64ToBytes(consultantPhotoB64);
      photoImgNum = addObj({
        stream: photoBytes,
        dict: '<< /Type /XObject /Subtype /Image /Width ' + TEAM_PHOTO_PDF_SIZE + ' /Height ' + TEAM_PHOTO_PDF_SIZE +
          ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + photoBytes.length + ' >>'
      });
    }

    var pagesNum = objs.length + 1; objs.push(null); // reserviert, wird unten befüllt

    var fontsDict = '<< /F1 ' + fontRegNum + ' 0 R /F2 ' + fontBoldNum + ' 0 R /F3 ' + fontSerifBoldNum + ' 0 R /F4 ' + fontSerifItalicNum + ' 0 R >>';
    var xObjectDict = '<< /Im1 ' + imgNum + ' 0 R' + (photoImgNum ? ' /Im2 ' + photoImgNum + ' 0 R' : '') + ' >>';
    var pageNums = [];
    pages.forEach(function (ops, idx) {
      var contentStr = ops.join('\n') + '\n';
      var cNum = addObj({ stream: stringToBytes(contentStr), dict: '<< /Length ' + contentStr.length + ' >>' });
      var annotNums = linkTargets.filter(function (l) { return l.page === idx; })
        .map(function (l) {
          var actionNum = addObj('<< /Type /Action /S /URI /URI (' + pdfEscape(l.url) + ') >>');
          return addObj('<< /Type /Annot /Subtype /Link /Rect [' + l.x.toFixed(2) + ' ' + l.y.toFixed(2) + ' ' +
            (l.x + l.w).toFixed(2) + ' ' + (l.y + l.h).toFixed(2) + '] /Border [0 0 0] /A ' + actionNum + ' 0 R >>');
        });
      var pageDict = '<< /Type /Page /Parent ' + pagesNum + ' 0 R /MediaBox [0 0 ' + PAGE_W.toFixed(2) + ' ' + PAGE_H.toFixed(2) +
        '] /Resources << /Font ' + fontsDict + ' /XObject ' + xObjectDict + ' >>' +
        ' /Contents ' + cNum + ' 0 R' +
        (annotNums.length ? ' /Annots [' + annotNums.map(function (n) { return n + ' 0 R'; }).join(' ') + ']' : '') + ' >>';
      pageNums.push(addObj(pageDict));
    });
    objs[pagesNum - 1] = '<< /Type /Pages /Kids [' + pageNums.map(function (n) { return n + ' 0 R'; }).join(' ') + '] /Count ' + pageNums.length + ' >>';
    var catalogNum = addObj('<< /Type /Catalog /Pages ' + pagesNum + ' 0 R >>');

    var w = new ByteWriter();
    w.writeString('%PDF-1.4\n');
    var offsets = [0];
    for (var n = 1; n <= objs.length; n++) {
      offsets[n] = w.length;
      var o = objs[n - 1];
      if (o && typeof o === 'object' && o.stream) {
        w.writeString(n + ' 0 obj\n' + o.dict + '\nstream\n');
        w.writeBytes(o.stream);
        w.writeString('\nendstream\nendobj\n');
      } else {
        w.writeString(n + ' 0 obj\n' + o + '\nendobj\n');
      }
    }
    var xrefStart = w.length;
    w.writeString('xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n');
    for (var n2 = 1; n2 <= objs.length; n2++) w.writeString(pad10(offsets[n2]) + ' 00000 n \n');
    w.writeString('trailer\n<< /Size ' + (objs.length + 1) + ' /Root ' + catalogNum + ' 0 R >>\nstartxref\n' + xrefStart + '\n%%EOF');
    return w.toUint8Array();
  }

  // Erzeugt die PDF-Datei und stößt den Download an. Auf GitHub Pages/im echten Browser
  // gibt es kein window.claude, dort läuft es direkt über den klassischen Blob-Download.
  // Im Claude-Artifact-Vorschaufenster blockiert die Sandbox skript-ausgelöste Downloads
  // über <a download> grundsätzlich — dort läuft es stattdessen über die downloads-Fähigkeit
  // der Vorschau (window.claude.use('downloads')), die dem Betrachter eine Bestätigung zeigt.
  function downloadPdfReport(btn) {
    var bytes = buildBeautyBlueprintPdfBytes();
    var fileName = 'Beauty-Blueprint-' + (STATE.kundeName || 'Kundin').replace(/[^\w\-]+/g, '_') + '.pdf';
    function markDone() {
      if (btn) btn.outerHTML = '<span class="sub" style="margin:0">PDF heruntergeladen ✓</span>';
    }
    function fallbackBlobDownload() {
      var blob = new Blob([bytes], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      markDone();
    }
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(function (downloads) {
        if (!downloads) { fallbackBlobDownload(); return; }
        downloads.save({ filename: fileName, data: bytes }).then(markDone, function (err) {
          if (err && err.code === 'declined') return; // Nutzer hat abgelehnt, nicht erneut versuchen
          fallbackBlobDownload();
        });
      }, fallbackBlobDownload);
    } else {
      fallbackBlobDownload();
    }
  }

  function treatLine(info) {
    var extra = [info.dauer, info.preis].filter(Boolean).join(' · ');
    return extra ? info.behandlung + ' (' + extra + ')' : info.behandlung;
  }

  function productLine(info) {
    return info.produktpreis ? info.product + ' (' + info.produktpreis + ')' : info.product;
  }

  function needReason(needName) {
    var parts = ANALYSE_ITEMS.filter(function (it) { return it.need === needName; }).map(function (it) {
      var v = STATE.analyse[it.key];
      if (!v) return null;
      return it.label + ' (' + SCALE4_LABELS[v] + ')';
    }).filter(Boolean);
    return parts.length ? parts.join(', ') : 'Geringe Ausprägung, aber relativ höchste Priorität';
  }

  function familyFor(needName) {
    return PROGRAM_FAMILIES.filter(function (f) { return f.needs.indexOf(needName) > -1; })[0] ||
      { name: needName, needs: [needName] };
  }

  // Der komplette Plan: "active" sind die von der Mitarbeiterin per Klick ausgewählten
  // Behandlungen, in genau der Reihenfolge, in der sie angeklickt wurden (nicht nach
  // System-Priorität) — das treibt die Nummerierung auf den Karten, den 6-Monats-Kurplan,
  // das Beauty Blueprint und die E-Mail. "ranked" bleibt die (auf 5 gedeckelte) Vorschlagsliste
  // zur Auswahl. "Programm" dient nur noch als grober Kontext-Name.
  function getPlan() {
    var ranked = rankedTreatmentOptions();
    var active = STATE.rec.behandlungOrder.map(function (need, i) {
      var info = NEED_INFO[need];
      return { prio: i + 1, need: need, behandlung: info.behandlung, dauer: info.dauer, preis: info.preis };
    });
    var family = familyFor((active[0] || ranked[0]).need);
    return { family: family, active: active, ranked: ranked };
  }

  // Für Übersichten (Beauty Blueprint, E-Mail): dieselbe Behandlung mehrfach hintereinander
  // aufzulisten wäre verwirrend — hier stattdessen einmal je Behandlung mit "×N", wenn sie
  // mehrfach ausgewählt wurde. Der Kurplan selbst (Monat 1-6) bleibt unverändert die volle,
  // unverdichtete Reihenfolge.
  function groupedActive(plan) {
    var order = [];
    var byNeed = {};
    plan.active.forEach(function (r) {
      if (!byNeed[r.need]) { byNeed[r.need] = { need: r.need, behandlung: r.behandlung, dauer: r.dauer, preis: r.preis, count: 0 }; order.push(byNeed[r.need]); }
      byNeed[r.need].count++;
    });
    return order;
  }

  // Löst den tatsächlich anzuzeigenden Homecare-Eintrag für "am" (morgens) oder
  // "pm" (abends) auf: entfernt -> null, von der Mitarbeiterin ausgewählt -> dieses
  // Produkt, sonst der System-Vorschlag (baseInfo, z.B. aus NEED_INFO).
  function homecareInfoFor(slot, baseInfo) {
    var s = STATE.rec.homecare[slot];
    if (s.status === 'entfernt') return null;
    if (s.product) return { product: s.product.name, produktpreis: s.product.preis };
    return baseInfo;
  }

  // 6-Monats-Kurplan: alle im Behandlungsplan ausgewählten Behandlungen werden im Kreis auf die
  // Monate verteilt, in genau der Klick-Reihenfolge der Mitarbeiterin — wählt sie eine
  // Behandlung mehrfach an (z. B. ASA gleich 3x), taucht sie entsprechend öfter im Kurplan auf.
  // Der Plan hat immer mindestens KUR_MONTHS_MIN Monate (repeat-fill bei wenigen Behandlungen);
  // sind mehr Behandlungen ausgewählt, wächst der Plan auf genau diese Anzahl Monate mit —
  // jede ausgewählte Behandlung bekommt dann ihren eigenen Monat statt aus dem Plan zu fallen.
  // Jeder Termin bleibt einzeln editierbar (Suche, Zurücksetzen, Entfernen).
  var KUR_MONTHS_MIN = 6;

  function kurMonthsCount(plan) {
    return Math.max(KUR_MONTHS_MIN, plan.active.length || 1);
  }

  // Wächst STATE.rec.kur bei Bedarf nach, ohne bestehende Termine (inkl. manueller
  // Überschreibungen) anzutasten — nur Schrumpfen findet nie statt, überzählige Slots
  // bleiben einfach ungenutzt liegen, falls später wieder weniger Behandlungen aktiv sind.
  function ensureKurSlots(months) {
    while (STATE.rec.kur.length < months) {
      STATE.rec.kur.push({ status: 'aktiv', override: null, searchOpen: false });
    }
  }

  function kurDefaultSlots(plan) {
    var pool = plan.active.length ? plan.active : [plan.ranked[0]];
    var months = kurMonthsCount(plan);
    ensureKurSlots(months);
    var slots = [];
    for (var m = 0; m < months; m++) {
      slots.push(pool[m % pool.length]);
    }
    return slots;
  }

  function kurInfoFor(idx, baseInfo) {
    var s = STATE.rec.kur[idx];
    if (s.status === 'entfernt') return null;
    if (s.override) return { behandlung: s.override.name, dauer: s.override.dauer, preis: s.override.preis };
    return baseInfo;
  }

  // Preis-String ("239 €" oder "72,50 €") in eine Zahl umwandeln bzw. wieder zurück —
  // Grundlage für die Kur-Gesamtsumme, die der Kundin mitgeteilt werden kann.
  function parsePrice(str) {
    if (!str) return 0;
    var n = parseFloat(String(str).replace(/[^\d,.]/g, '').replace(',', '.'));
    return isNaN(n) ? 0 : n;
  }
  function formatPrice(n) {
    return (Math.round(n * 100) % 100 === 0 ? n.toFixed(0) : n.toFixed(2).replace('.', ',')) + ' €';
  }

  // Summe aller (noch aktiven) Kur-Termine — zeigt der Mitarbeiterin/Kundin, was die
  // gesamte 6-Monats-Kur kostet, nicht nur die einzelne Behandlung.
  function kurTotal(plan) {
    var sum = 0;
    kurDefaultSlots(plan).forEach(function (baseInfo, idx) {
      var info = kurInfoFor(idx, baseInfo);
      if (info) sum += parsePrice(info.preis);
    });
    return sum;
  }

  // Alle Beauty-Needs, für die in der Hautanalyse tatsächlich etwas beobachtet wurde (avg > 0),
  // als priorisierte Liste geeigneter Behandlungen — Grundlage für die Schnellauswahl im
  // Kurplan, damit die Mitarbeiterin nicht erst tippen muss, um die passenden Optionen zu sehen.
  // Wie viele Behandlungsoptionen der Empfehlungen-Screen maximal zur Auswahl anbietet —
  // bewusst knapp gehalten, statt bis zu 9 Needs auf einmal zu zeigen.
  var MAX_BEHANDLUNGS_OPTIONEN = 5;

  function rankedTreatmentOptions() {
    var needs = computeNeeds();
    var list = needs.filter(function (n) { return n.avg > 0; });
    // Fallback, falls noch keine Hautanalyse-Antworten vorliegen: die (aus computeNeeds())
    // relativ höchste Priorität wird trotzdem als Ausgangspunkt gezeigt, statt eine leere
    // Liste — needReason() markiert diesen Fall bereits als "geringe Ausprägung".
    if (!list.length) list = needs[0] ? [needs[0]] : [{ need: 'Hydration', avg: 0 }];
    return list.slice(0, MAX_BEHANDLUNGS_OPTIONEN).map(function (n, i) {
      var info = NEED_INFO[n.need];
      return { prio: i + 1, need: n.need, behandlung: info.behandlung, dauer: info.dauer, preis: info.preis };
    });
  }

  // ASA Peel Fruchtsäure darf laut Studiolution-Kur-Konzept nur einmalig oder als direkt
  // aufeinanderfolgende 3er-Kur eingeplant werden (siehe "ASA Fruchtsäure KUR" im Katalog).
  function isAsaPeel(name) {
    var n = (name || '').toLowerCase();
    return n.indexOf('asa') > -1 && n.indexOf('peel') > -1 && n.indexOf('kur') === -1;
  }

  function kurAsaWarning(kurSlots) {
    var idxs = [];
    kurSlots.forEach(function (baseInfo, idx) {
      var info = kurInfoFor(idx, baseInfo);
      if (info && isAsaPeel(info.behandlung)) idxs.push(idx);
    });
    if (idxs.length <= 1) return null;
    var monthsText = idxs.map(function (i) { return i + 1; }).join(', ');
    if (idxs.length === 3 && idxs[2] - idxs[0] === 2) return null;
    return idxs.length === 3
      ? 'ASA Peel Fruchtsäure ist 3x eingeplant (Monat ' + monthsText + '), aber nicht direkt hintereinander. Als 3er-Kur sollte sie ohne Unterbrechung stattfinden.'
      : 'ASA Peel Fruchtsäure ist ' + idxs.length + 'x eingeplant (Monat ' + monthsText + '). Sie ist nur als Einzelbehandlung oder als direkt aufeinanderfolgende 3er-Kur vorgesehen.';
  }

  function zielText() {
    if (!STATE.ziel.length) return 'Allgemeine Hautverbesserung';
    return STATE.ziel.map(function (k) {
      var z = ZIELE.filter(function (z) { return z.key === k; })[0];
      return z ? z.label : k;
    }).join(', ');
  }

  function painpointText() {
    if (!STATE.painpoint.length) return '';
    return STATE.painpoint.map(function (k) {
      var p = PAIN_POINTS.filter(function (p) { return p.key === k; })[0];
      return p ? p.label : k;
    }).join(', ');
  }

  function anlassText() {
    if (!STATE.anlass) return '';
    var a = ANLASS.filter(function (a) { return a.key === STATE.anlass; })[0];
    return a ? a.label : STATE.anlass;
  }


  function renderEmpfehlungen() {
    var plan = getPlan();
    // Live-Hinweis, sobald die aktuelle Auswahl zu einer laufenden Aktion passt — anders
    // als das Popup auf dem Beauty-Blueprint-Screen kein Dialog zum Wegklicken, sondern ein
    // Banner, das mit jeder Auswahländerung erscheint oder wieder verschwindet.
    var relevantAktionEmpf = findRelevantAktion(plan);
    var i1 = NEED_INFO[(plan.active[0] || plan.ranked[0]).need];
    var i2 = plan.active[1] ? NEED_INFO[plan.active[1].need] : i1;

    // Jede zur Hautanalyse passende Behandlung steht gleichwertig zur Wahl, ohne erzwungene
    // Phase-1/Phase-2/Beobachten-Rolle — die Mitarbeiterin entscheidet per Klick, welche
    // davon tatsächlich übernommen werden.
    function behandlungCard(r) {
      var order = STATE.rec.behandlungOrder;
      // Eine Behandlung kann mehrfach gewählt werden (z. B. eine 3er-Kur) — statt einer
      // einzelnen Pille mit "×N" zeigt die Karte dann für jede Wahl einen eigenen Kreis mit
      // der tatsächlichen Position im Klick-Verlauf (z. B. "1" und "3", wenn dazwischen eine
      // andere Behandlung an Position 2 gewählt wurde).
      var positions = [];
      order.forEach(function (n, i) { if (n === r.need) positions.push(i + 1); });
      var selected = positions.length > 0;
      return '<div class="rec-card' + (selected ? ' selected' : '') + '">' +
        (selected
          ? '<span class="rec-badges">' + positions.map(function (p) { return '<span class="rec-number-badge">' + p + '</span>'; }).join('') + '</span>'
          : '<span class="rec-kicker">Nicht ausgewählt</span>') +
        '<span class="rec-name">' + esc(r.behandlung) + '</span>' +
        '<span style="font-size:.8125rem;color:var(--text-soft)">' + esc([r.dauer, r.preis].filter(Boolean).join(' · ')) + '</span>' +
        '<p class="sub" style="margin:0;font-size:.8125rem">' + esc(needReason(r.need)) + '</p>' +
        '<div class="rec-round-row">' +
          '<button class="rec-round-btn add' + (selected ? ' active' : '') + '" onclick="__bb.select(\'behandlung-add\',\'' + r.need + '\')" title="' + (selected ? 'Nochmal wählen' : 'Auswählen') + '" aria-label="' + (selected ? 'Nochmal wählen' : 'Auswählen') + '">+</button>' +
          (selected ? '<button class="rec-round-btn remove" onclick="__bb.select(\'behandlung-remove\',\'' + r.need + '\')" title="Entfernen" aria-label="Entfernen">−</button>' : '') +
        '</div></div>';
    }

    // Homecare-Produkt für Morgens/Abends: das System schlägt das zur Priorität passende
    // Produkt schon vor (baseInfo), die Mitarbeiterin kann es aber über die Suche gegen
    // jedes der 364 echten KLAPP-Produkte austauschen oder den Schritt ganz entfernen.
    function homecareSlotCard(slot, label, baseInfo) {
      var s = STATE.rec.homecare[slot];
      var removed = s.status === 'entfernt';
      var display = s.product ? { product: s.product.name, produktpreis: s.product.preis } : baseInfo;
      return '<div class="rec-card">' +
        '<span class="rec-kicker">Homecare · ' + label + '</span>' +
        '<span class="rec-name" style="' + (removed ? 'text-decoration:line-through;opacity:.5' : '') + '">' + esc(productLine(display)) + '</span>' +
        (s.product && !removed ? '<p class="sub" style="margin:0;font-size:.75rem">Von dir ausgewählt — <a href="#" onclick="__bb.select(\'homecare-reset-product\',\'' + slot + '\');return false;" style="color:var(--rose-deep)">Systemvorschlag verwenden</a></p>' : '') +
        '<div class="rec-toggle" style="flex-wrap:wrap">' +
          (removed ? '' : '<button onclick="__bb.select(\'homecare-toggle-search\',\'' + slot + '\')">' + (s.searchOpen ? 'Suche schließen' : 'Anderes Produkt wählen') + '</button>') +
          '<button class="' + (removed ? '' : 'active') + '" onclick="__bb.select(\'homecare-toggle-status\',\'' + slot + '\')">' + (removed ? 'Entfernt — wiederherstellen' : 'Übernommen') + '</button>' +
        '</div>' +
        (s.searchOpen && !removed ?
          '<div class="product-search">' +
            '<input type="text" class="text-input" placeholder="Produkt suchen …" oninput="__bb.filterProducts(\'' + slot + '\', this.value)" />' +
            '<div class="product-results" id="product-results-' + slot + '"></div>' +
          '</div>' : '') +
      '</div>';
    }

    // 6-Monats-Kurplan: ein Termin pro Monat, Vorschlag aus kurDefaultSlots() (Hauptbehandlung
    // + zwei Auflockerungs-Termine). Beim Öffnen der Suche stehen zuerst die priorisierten,
    // zur Hautanalyse passenden Behandlungen als Ein-Klick-Optionen bereit; alternativ frei
    // aus allen 152 echten Studiolution-Behandlungen tippen.
    function kurSlotCard(idx, baseInfo, ranked) {
      var s = STATE.rec.kur[idx];
      var removed = s.status === 'entfernt';
      var display = s.override ? { behandlung: s.override.name, dauer: s.override.dauer, preis: s.override.preis } : baseInfo;
      return '<div class="rec-card">' +
        '<span class="rec-kicker">Monat ' + (idx + 1) + '</span>' +

  // =====================================================================================

  // Alle Preise sind intern reine Zahlen; formatiert wird nur bei der Ausgabe (formatCurrency).

  var BEST_CONFIG = {
    approver: 'Svenja',            // nur diese Person darf Bestellungen freigeben/abschließen und E-Mails an die Hersteller auslösen

  ];
  var BEST_PROMOS = [
    { key: 'none', label: 'Keine Aktion', threshold: 0 }, { key: '3+1', label: '3 + 1', threshold: 3 },
    { key: '5+1', label: '5 + 1', threshold: 5 }, { key: '6+1', label: '6 + 1', threshold: 6 }, { key: '10+2', label: '10 + 2', threshold: 10, free: 2 },
    { key: 'custom', label: 'Individuell', threshold: 0 }
  ];
  var BEST_STEP_LABELS = ['Marke', 'Produkte', 'Verwendung & Menge', 'Warenkorb', 'WKZ', 'Zusammenfassung'];

  // ---------- Hilfsfunktionen: Zahlen, Speicher ----------
  function round2(n) { return Math.round((n + 1e-9) * 100) / 100; }
  var BEST_FMT = (typeof Intl !== 'undefined') ? new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }) : null;
  function formatCurrency(value) {
    var v = round2(Number(value) || 0);
    if (BEST_FMT) return BEST_FMT.format(v).replace(/ /g, ' ');
    return v.toFixed(2).replace('.', ',') + ' €';
  }
  function bestLoad(key, fallback) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
  }
  function bestSave(key, val) { try { window.localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* ohne Speicher weiterarbeiten */ } }

  // ---------- Berechnungen (reine Funktionen) ----------
  function promoThreshold(promotionType, customThreshold) {
    if (promotionType === 'custom') return Math.floor(Number(customThreshold)) || 0;
    var p = BEST_PROMOS.filter(function (x) { return x.key === promotionType; })[0];
    return p ? p.threshold : 0;
  }
  function promoFree(promotionType) { var p = BEST_PROMOS.filter(function (x) { return x.key === promotionType; })[0]; return (p && p.free) || 1; }
  // quantityFree = floor(quantityPaid / threshold) × Gratisstücke je Paket (3+1/5+1/6+1 = 1, 10+2 = 2)
  function calculateFreeQuantity(quantityPaid, promotionType, customThreshold) {
    var t = promoThreshold(promotionType, customThreshold);
    if (!t || t < 1 || quantityPaid < 1) return 0;
    return Math.floor(quantityPaid / t) * promoFree(promotionType);
  }
  function calculateLineCost(item) { return round2(item.quantityPaid * item.unitPurchasePrice); } // Gratisware zählt nicht
  function calculateOrderTotal(items) { return round2(items.reduce(function (s, i) { return s + calculateLineCost(i); }, 0)); }
  // Wert der kostenlosen Aktionsware (nur Information, nie Teil des Bestellwerts)
  function calculateFreeGoods(items) { return round2(items.reduce(function (s, i) { return s + i.quantityFree * i.unitPurchasePrice; }, 0)); }
  // WKZ-Basis: nur Ware OHNE Aktion. Zeilen mit gewählter Aktion (z. B. 6+1 = 7 Stück) zählen
  // komplett nicht zum WKZ — weder die bezahlten noch die Gratisstücke.
  function calculateWKZBase(items) { return round2(items.reduce(function (s, i) { return s + (i.promotionType === 'none' ? i.quantityPaid * i.unitPurchasePrice : 0); }, 0)); }
  function bestPromoSize(promo) { return promoThreshold(promo, 0); }
  // Marken-Regeln: Verwendungen und Aktionen je Marke; WKZ gibt es nur bei KLAPP
  var BEST_BRAND_RULES = {
    KLAPP: { purposes: ['sale', 'tester', 'cabin'], promos: ['none', '6+1', '5+1', '3+1'], wkz: true },
    GEHWOL: { purposes: ['sale', 'cabin'], promos: ['none', '10+2'], wkz: false },
    Alessandro: { purposes: ['sale', 'tester', 'cabin'], promos: ['none', '10+2'], wkz: false }
  };
  function bestPurposesFor(brand) { return (BEST_BRAND_RULES[brand] || BEST_BRAND_RULES.KLAPP).purposes; }
  function bestPromosFor(brand) { return (BEST_BRAND_RULES[brand] || BEST_BRAND_RULES.KLAPP).promos; }
  function bestHasWkz(brand) { return !!(BEST_BRAND_RULES[brand] || {}).wkz; }
  // Tester bekommen immer den Nachlass auf den EK (voreingestellt 20 %).
  function bestItemPrice(p, purpose) {
    return purpose === 'tester' ? round2(p.purchasePrice * (1 - BEST_CONFIG.testerDiscountPercent / 100)) : p.purchasePrice;
  }
  function calculateWKZAmount(base, ratePercent) { return round2(base * (Number(ratePercent) || 0) / 100); }
  function calculateWKZUsed(wkzItems) { return round2(wkzItems.reduce(function (s, i) { return s + i.quantity * i.unitPurchasePrice; }, 0)); }
  function calculateWKZRemaining(wkzAmount, wkzUsed) { return round2(wkzAmount - wkzUsed); }

  function bestRecalc(item) {
    item.quantityFree = calculateFreeQuantity(item.quantityPaid, item.promotionType, item.customThreshold);
  }
