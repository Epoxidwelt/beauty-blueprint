    overflow: hidden;

  }

  .content {

    overflow-y: auto;
    padding: 0.5rem 2.2rem 2rem;
    display: flex;
    flex-direction: column;
  }

  .eyebrow {

  .grid {

  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }

  .card {

  .card.disabled { opacity: 0.45; cursor: not-allowed; }

  .scale4 .card.selected .level-fill span.on { background: var(--rose-deep); }

    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    background: var(--anthrazit);
    color: var(--warmweiss);
    border: none;
    border-radius: 8px;
    padding: 0.85rem 1.3rem;
    cursor: pointer;

  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary[disabled] { opacity: 0.35; cursor: not-allowed; }

  .btn-ghost {
    font-family: var(--font-body);
    font-size: 0.8125rem;
    background: transparent;
    color: var(--text-soft);
    border: 1px solid var(--border);

  .btn-ghost:hover { border-color: var(--border-strong); color: var(--text); }

  .footer-actions {

  .badge .dot2 { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .text-input {
    font-family: var(--font-body);

  .avatar-row { display: flex; gap: 0.7rem; flex-wrap: wrap; }
  .avatar-card {
    width: 108px;

  .avatar-circle {

  .avatar-card:hover .avatar-circle { border-color: var(--rose-deep); transform: translateY(-2px); }
  .avatar-name { font-size: 0.8125rem; color: var(--text); }

  .summary-list { display: flex; flex-direction: column; gap: 0.55rem; margin: 0 0 1rem; }
  .summary-row {
    display: flex; justify-content: space-between; gap: 1rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.875rem;
  }
  .summary-row .k { color: var(--text-soft); }
  .summary-row .v { color: var(--text); font-weight: 600; text-align: right; }

  .rec-card {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .rec-kicker { font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rose-deep); }
  .rec-name { font-family: var(--font-display); font-size: 1.15rem; color: var(--text); }
  .rec-toggle {
    display: flex; gap: 0.4rem; margin-top: 0.2rem;
  }
  .rec-toggle button {
    font-family: var(--font-body);
    font-size: 0.75rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-soft);
    border-radius: 999px;
    padding: 0.3rem 0.7rem;
    cursor: pointer;
  }
  .rec-toggle button.active { background: var(--anthrazit); color: var(--warmweiss); border-color: var(--anthrazit); }

  .blueprint-hero {
    font-family: var(--font-display);
    font-size: 2rem;
    font-style: italic;
    color: var(--anthrazit);
    margin: 0.2rem 0 0.1rem;
    text-wrap: balance;
  }
  .divider { height: 1px; background: var(--border-strong); margin: 1.1rem 0; border: none; }

  .routine-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .routine-col h3 { font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--rose-deep); margin: 0 0 0.5rem; }
  .routine-col ol { margin: 0; padding-left: 1.1rem; font-size: 0.875rem; color: var(--text); display: flex; flex-direction: column; gap: 0.3rem; }

  .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; flex: 1; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2.5px solid var(--border);
    border-top-color: var(--rose-deep);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
    * { transition-duration: 0.01ms !important; }
  }

  @media (max-width: 640px) {
    .device { aspect-ratio: 3 / 4.3; max-height: none; padding: 8px; border-radius: 16px; }
    .screen { border-radius: 9px; }
    .content { padding: 0.5rem 1.2rem 1.6rem; }
    .grid.cols-3, .grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
    .routine-cols { grid-template-columns: 1fr; }
  }
</style>

  ];
  var SCALE4_LABELS = ['Nicht vorhanden', 'Leicht', 'Mittel', 'Stark'];
  var NEED_INFO = {

  };
  var MITARBEITERINNEN = ['Lena', 'Sophie', 'Mara'];

  var PHASE_RANGE = {
    kunde: [2, 12], ziel: [12, 20], painpoint: [20, 28], anlass: [28, 34],

  var path = ['login'];
  var pointer = 0;

  function goTo(id) {
    path = path.slice(0, pointer + 1);
    path.push(id);
    pointer++;

  }
  function goBack() {
    if (pointer > 0) { pointer--; render(); }

  function replaceTop(id) {
    path[pointer] = id;

  window.__bb = { goTo: goTo, goBack: goBack, replaceTop: replaceTop, state: STATE, select: selectHandler, input: inputHandler };

  function selectHandler(kind, key, extra) {

      var order = ['aktiv', 'ersetzt', 'entfernt'];
      var cur = STATE.rec[key];
      var next = order[(order.indexOf(cur) + 1) % order.length];
      STATE.rec[key] = next;
      render();
    }
  }
  function inputHandler() {}

  function toggleMulti(arr, key) {
    var idx = arr.indexOf(key);
    if (idx === -1) arr.push(key); else arr.splice(idx, 1);
  }

    if (idx + 1 < items.length) goTo(prefix + ':' + (idx + 1));

  }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function topbar(mode, percent, contextText) {
    var backDisabled = pointer === 0 ? 'disabled' : '';
    return '' +
      '<div class="topbar">' +
        '<button class="back-btn" ' + backDisabled + ' onclick="__bb.goBack()" aria-label="Zurück">&#8592;</button>' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + percent + '%"></div></div>' +
        '<div class="context-label">' + esc(contextText || '') + '</div>' +
      '</div>';
  }

  function screenWrap(mode, percent, contextText, bodyHtml, center) {
    var el = document.getElementById('screen');
    el.setAttribute('data-mode', mode);
    el.innerHTML = topbar(mode, percent, contextText) + '<div class="content' + (center ? ' center' : '') + '">' + bodyHtml + '</div>';
  }

  function phasePercent(phase, idx, count) {
    var r = PHASE_RANGE[phase];
    if (idx === undefined) return r[1];
    return Math.round(r[0] + (idx + 1) / count * (r[1] - r[0]));
  }

  function contextLabel() {
    var parts = [];
    if (STATE.mitarbeiterin) parts.push(STATE.mitarbeiterin);
    if (STATE.kundeName) parts.push('Kundin: ' + STATE.kundeName);
    return parts.join(' · ');
  }

  // ---------- Screens ----------

  function renderLogin() {
    var body = '' +
      '<p class="eyebrow">Anmeldung</p>' +
      '<h1 class="q">Wer berät heute?</h1>' +
      '<div class="avatar-row">' +
      MITARBEITERINNEN.map(function (n) {
        return '<button class="avatar-card" onclick="__bb.select(\'mitarbeiterin\',\'' + n + '\')">' +
          '<span class="avatar-circle">' + n.charAt(0) + '</span>' +
          '<span class="avatar-name">' + n + '</span>' +
        '</button>';
      }).join('') +
      '</div>';
    screenWrap('brand', 0, '', body, true);
  }

  function renderKundeWahl() {
    var hasOffen = false;
    var body = '' +
      '<p class="eyebrow">Neue Beratung</p>' +
      '<h1 class="q">Kundin auswählen</h1>' +
      '<div class="grid cols-2">' +
        '<button class="card center-tap" onclick="__bb.goTo(\'kunde-neu\')">Neue Kundin</button>' +
        '<button class="card center-tap" onclick="__bb.goTo(\'kunde-bestehend\')">Bestehende Kundin</button>' +
        '<button class="card center-tap disabled" disabled>Offene Beratung fortsetzen<br><span style="font-size:.75rem;color:var(--text-soft)">Keine vorhanden</span></button>' +
      '</div>';
    screenWrap('dezent', phasePercent('kunde', 0, 3), contextLabel(), body);
  }

  function renderKundeBestehend() {
    var body = '' +
      '<p class="eyebrow">Bestehende Kundin</p>' +
      '<h1 class="q">Wen berätst du?</h1>' +
      '<div class="grid cols-2">' +
      BESTEHENDE_KUNDINNEN.map(function (n) {
        return '<button class="card" onclick="__bb.select(\'kunde-bestehend\',\'' + n + '\')"><span>' + n + '</span></button>';
      }).join('') +
      '</div>';
    screenWrap('dezent', phasePercent('kunde', 1, 3), contextLabel(), body);
  }

  function renderKundeNeu() {
    var body = '' +
      '<p class="eyebrow">Neue Kundin</p>' +
      '<h1 class="q">Wie heißt die Kundin?</h1>' +
      '<input id="kunde-name-input" class="text-input" type="text" placeholder="Vor- und Nachname" value="' + esc(STATE.kundeName) + '" />' +
      '<div class="footer-actions">' +
        '<button class="btn-primary" onclick="__bb.select(\'kunde-neu-weiter\')">Weiter</button>' +
      '</div>';
    screenWrap('dezent', phasePercent('kunde', 2, 3), contextLabel(), body);
  }

  function renderZiel() {
    var body = '' +
      '<p class="eyebrow">Schritt 1 · Ziel</p>' +
      '<h1 class="q">Was möchte ' + (STATE.kundeName ? esc(STATE.kundeName) : 'die Kundin') + ' erreichen?</h1>' +
      '<p class="sub">Mehrfachauswahl möglich — antippen zum Auswählen.</p>' +
      '<div class="grid cols-3">' +
      ZIELE.map(function (z) {
        var sel = STATE.ziel.indexOf(z.key) > -1;
        return '<button class="card' + (sel ? ' selected' : '') + '" onclick="__bb.select(\'ziel\',\'' + z.key + '\')"><span>' + z.label + '</span><span class="dot"></span></button>';
      }).join('') +
      '</div>' +
      '<div class="footer-actions">' +
        '<button class="btn-primary" ' + (STATE.ziel.length ? '' : 'disabled') + ' onclick="__bb.goTo(\'painpoint\')">Weiter</button>' +
      '</div>';
    screenWrap('neutral', phasePercent('ziel'), contextLabel(), body);
  }

  function renderPainpoint() {
    var body = '' +
      '<p class="eyebrow">Schritt 2 · Pain Point</p>' +
      '<h1 class="q">Was stört sie daran besonders?</h1>' +
      '<div class="grid cols-3">' +
      PAIN_POINTS.map(function (p) {
        var sel = STATE.painpoint.indexOf(p.key) > -1;
        return '<button class="card' + (sel ? ' selected' : '') + '" onclick="__bb.select(\'painpoint\',\'' + p.key + '\')"><span>' + p.label + '</span><span class="dot"></span></button>';
      }).join('') +
      '</div>' +
      '<div class="footer-actions">' +
        '<button class="btn-primary" ' + (STATE.painpoint.length ? '' : 'disabled') + ' onclick="__bb.goTo(\'anlass\')">Weiter</button>' +
      '</div>';
    screenWrap('neutral', phasePercent('painpoint'), contextLabel(), body);
  }

  function renderAnlass() {
    var body = '' +
      '<p class="eyebrow">Schritt 3 · Anlass & Zeitrahmen</p>' +
      '<h1 class="q">Gibt es einen bestimmten Anlass?</h1>' +
      '<div class="grid cols-3">' +
      ANLASS.map(function (a) {
        return '<button class="card center-tap" onclick="__bb.select(\'anlass\',\'' + a.key + '\')">' + a.label + '</button>';
      }).join('') +
      '</div>';
    screenWrap('neutral', phasePercent('anlass'), contextLabel(), body);
  }

  function renderYesNoStep(prefix, items, phase, title) {
    var idx = currentFlowScreen(prefix);
    var item = items[idx];
    var current = STATE[prefix][item.key];
    var optionsHtml;
    if (item.type === 'yesno') {
      optionsHtml = '<div class="row-choice">' +
        ['Ja', 'Nein'].map(function (opt) {
          var sel = current === opt;
          return '<button class="card' + (sel ? ' selected' : '') + '" onclick="__bb.select(\'' + prefix + '\',\'' + item.key + '\',\'' + opt + '\')">' + opt + '</button>';
        }).join('') + '</div>';
    } else if (item.type === 'scale3') {
      optionsHtml = '<div class="row-choice">' +
        item.options.map(function (opt) {
          var sel = current === opt;
          return '<button class="card' + (sel ? ' selected' : '') + '" onclick="__bb.select(\'' + prefix + '\',\'' + item.key + '\',\'' + opt + '\')">' + opt + '</button>';
        }).join('') + '</div>';
    } else {
      var sel = current === 'Ja';
      optionsHtml = '<div class="row-choice">' +
        ['Ja', 'Nein'].map(function (opt) {
          var s = current === opt;
          return '<button class="card' + (s ? ' selected' : '') + '" onclick="__bb.select(\'' + prefix + '\',\'' + item.key + '\',\'' + opt + '\')">' + opt + '</button>';
        }).join('') + '</div>';
    }
    var body = '' +
      '<p class="eyebrow">' + title + ' · Frage ' + (idx + 1) + ' von ' + items.length + '</p>' +
      '<h2 class="q">' + item.frage + '</h2>' +
      optionsHtml;
    screenWrap('neutral', phasePercent(phase, idx, items.length), contextLabel(), body, true);
  }

  function computeRisk() {
    var maxRisk = 'gruen';
    SAFETY_ITEMS.forEach(function (it) {
      if (STATE.sicherheit[it.key] === 'Ja') {
        if (it.risk === 'rot') maxRisk = 'rot';
        else if (it.risk === 'gelb' && maxRisk !== 'rot') maxRisk = 'gelb';
      }
    });
    return maxRisk;
  }

  function renderSicherheitSummary() {
    var risk = computeRisk();
    var label = { gruen: 'Grundsätzlich geeignet', gelb: 'Fachlich prüfen', rot: 'Keine automatische Freigabe' }[risk];
    var body = '' +
      '<p class="eyebrow">Sicherheitscheck · Ergebnis</p>' +
      '<h1 class="q">Sicherheitsstufe</h1>' +
      '<div class="badge ' + risk + '"><span class="dot2"></span>' + label + '</div>' +
      '<p class="sub" style="margin-top:1rem;">Die endgültige Entscheidung bleibt bei dir — das System schlägt nur vor.</p>' +
      '<div class="footer-actions">' +
        '<button class="btn-primary" onclick="__bb.goTo(\'analyse:0\')">Weiter zur Hautanalyse</button>' +
      '</div>';
    screenWrap('neutral', phasePercent('sicherheit'), contextLabel(), body, true);
  }

  function renderAnalyseStep() {
    var idx = currentFlowScreen('analyse');
    var item = ANALYSE_ITEMS[idx];
    var current = STATE.analyse[item.key];
    var body = '' +
      '<p class="eyebrow">Fachanalyse · ' + (idx + 1) + ' von ' + ANALYSE_ITEMS.length + '</p>' +
      '<h2 class="q">' + item.label + '</h2>' +
      '<div class="scale4">' +
      SCALE4_LABELS.map(function (lbl, i) {
        var sel = current === i;
        var dots = '';
        for (var d = 0; d < 4; d++) dots += '<span class="' + (d <= i ? 'on' : '') + '"></span>';
        return '<button class="card' + (sel ? ' selected' : '') + '" onclick="__bb.select(\'analyse\',\'' + item.key + '\',' + i + ')">' +
          '<div class="level-fill">' + dots + '</div><span>' + lbl + '</span></button>';
      }).join('') +
      '</div>';
    screenWrap('neutral', phasePercent('analyse', idx, ANALYSE_ITEMS.length), contextLabel(), body, true);
  }

  function renderAuswertung() {
    screenWrap('dezent', phasePercent('ergebnis', 0, 5), contextLabel(),
      '<div class="loading-wrap"><div class="spinner"></div><p style="font-size:.875rem;color:var(--text-soft)">Strategie wird erstellt …</p></div>', true);
    setTimeout(function () { if (path[pointer] === 'auswertung') goTo('strategy'); }, 1400);
  }

  function computeNeeds() {
    var scores = {};
    ANALYSE_ITEMS.forEach(function (it) {
      var v = STATE.analyse[it.key];
      if (v === undefined) v = 0;
      if (!scores[it.need]) scores[it.need] = { sum: 0, count: 0 };
      scores[it.need].sum += v;
      scores[it.need].count += 1;
    });
    var arr = Object.keys(scores).map(function (need) {
      return { need: need, avg: scores[need].sum / scores[need].count };
    });
    arr.sort(function (a, b) { return b.avg - a.avg; });
    return arr;
  }

  function zielText() {
    if (!STATE.ziel.length) return 'Allgemeine Hautverbesserung';
    return STATE.ziel.map(function (k) {
      var z = ZIELE.filter(function (z) { return z.key === k; })[0];
      return z ? z.label : k;
    }).join(', ');
  }

  function renderStrategy() {
    var needs = computeNeeds();
    var top3 = needs.slice(0, 3);
    var body = '' +
      '<p class="eyebrow">Beauty Strategy</p>' +
      '<h1 class="q">Die fachliche Strategie</h1>' +
      '<div class="summary-list">' +
        '<div class="summary-row"><span class="k">Kundenziel</span><span class="v">' + esc(zielText()) + '</span></div>' +
        '<div class="summary-row"><span class="k">Hauptpriorität</span><span class="v">' + (top3[0] ? esc(top3[0].need) : '—') + '</span></div>' +
        '<div class="summary-row"><span class="k">Zweite Priorität</span><span class="v">' + (top3[1] ? esc(top3[1].need) : '—') + '</span></div>' +
        '<div class="summary-row"><span class="k">Dritte Priorität</span><span class="v">' + (top3[2] ? esc(top3[2].need) : '—') + '</span></div>' +
      '</div>' +
      '<div class="footer-actions">' +
        '<button class="btn-primary" onclick="__bb.goTo(\'empfehlungen\')">Weiter zu den Empfehlungen</button>' +
      '</div>';
    screenWrap('dezent', phasePercent('ergebnis', 2, 5), contextLabel(), body);
  }

  function renderEmpfehlungen() {
    var needs = computeNeeds();
    var top3 = needs.slice(0, 3);
    var n1 = top3[0] ? NEED_INFO[top3[0].need] : NEED_INFO['Hydration'];
    var n2 = top3[1] ? NEED_INFO[top3[1].need] : NEED_INFO['Barrier Repair'];
    var n3 = top3[2] ? NEED_INFO[top3[2].need] : NEED_INFO['Radiance'];

    function card(kicker, name, key) {
      var st = STATE.rec[key];
      return '<div class="rec-card">' +
        '<span class="rec-kicker">' + kicker + '</span>' +
        '<span class="rec-name" style="' + (st === 'entfernt' ? 'text-decoration:line-through;opacity:.5' : '') + '">' + esc(name) + '</span>' +
        '<div class="rec-toggle">' +
          '<button class="' + (st === 'aktiv' ? 'active' : '') + '" onclick="__bb.select(\'rec-toggle\',\'' + key + '\')">' + (st === 'aktiv' ? 'Übernommen' : st === 'ersetzt' ? 'Ausgetauscht' : 'Entfernt') + '</button>' +
        '</div></div>';
    }

    var body = '' +
      '<p class="eyebrow">Empfehlungen</p>' +
      '<h1 class="q">Vorschläge zur Prüfung</h1>' +
      '<p class="sub">Antippen wechselt zwischen Übernehmen / Austauschen / Entfernen.</p>' +
      '<div class="grid cols-2">' +
        card('Hauptbehandlung', n1.behandlung, 'haupt') +
        card('Ergänzung', n2.behandlung, 'erg') +
        card('Alternative', n3.behandlung, 'alt') +
        card('Homecare', n1.product, 'home') +
      '</div>' +
      '<div class="footer-actions">' +
        '<button class="btn-primary" onclick="__bb.goTo(\'blueprint\')">Beauty Blueprint erstellen</button>' +
      '</div>';
    screenWrap('dezent', phasePercent('ergebnis', 3, 5), contextLabel(), body);
  }

  function renderBlueprint() {
    var needs = computeNeeds();
    var top3 = needs.slice(0, 3);
    var n1 = top3[0] ? NEED_INFO[top3[0].need] : NEED_INFO['Hydration'];
    var n2 = top3[1] ? NEED_INFO[top3[1].need] : NEED_INFO['Barrier Repair'];
    var n3 = top3[2] ? NEED_INFO[top3[2].need] : NEED_INFO['Radiance'];
    var body = '' +
      '<p class="eyebrow">Beauty Blueprint</p>' +
      '<p class="blueprint-hero">' + esc(STATE.kundeName || 'Kundin') + '</p>' +
      '<p class="sub" style="margin-top:0">' + esc(zielText()) + '</p>' +
      '<hr class="divider"/>' +
      '<div class="summary-list">' +
        '<div class="summary-row"><span class="k">Hauptpriorität</span><span class="v">' + (top3[0] ? esc(top3[0].need) : '—') + '</span></div>' +
        '<div class="summary-row"><span class="k">Hauptbehandlung</span><span class="v">' + esc(n1.behandlung) + '</span></div>' +
        '<div class="summary-row"><span class="k">Ergänzung</span><span class="v">' + esc(n2.behandlung) + '</span></div>' +
        '<div class="summary-row"><span class="k">Alternative</span><span class="v">' + esc(n3.behandlung) + '</span></div>' +
        '<div class="summary-row"><span class="k">Nächster Checkpoint</span><span class="v">in 4 Wochen</span></div>' +
      '</div>' +
      '<div class="routine-cols">' +
        '<div class="routine-col"><h3>Morgens</h3><ol><li>Reinigung</li><li>' + esc(n1.product) + '</li><li>Tagespflege</li><li>SPF</li></ol></div>' +
        '<div class="routine-col"><h3>Abends</h3><ol><li>Reinigung</li><li>' + esc(n2.product) + '</li><li>Serum</li><li>Nachtpflege</li></ol></div>' +
      '</div>' +
      '<div class="footer-actions">' +
        '<button class="btn-primary" onclick="__bb.goTo(\'abschluss\')">Freigeben & abschließen</button>' +
      '</div>';
    screenWrap('brand', phasePercent('ergebnis', 4, 5), contextLabel(), body);
  }

  function renderAbschluss() {
    var body = '' +
      '<p class="eyebrow">Abgeschlossen</p>' +
      '<h1 class="q">Beauty Blueprint gespeichert</h1>' +
      '<p class="sub">' + esc(STATE.kundeName || 'Die Kundin') + ' erhält ihren persönlichen Plan. Ein Bericht kann optional erstellt werden.</p>' +
      '<div class="footer-actions">' +
        '<button class="btn-ghost" onclick="this.outerHTML=\'<span class=&quot;sub&quot; style=&quot;margin:0&quot;>Bericht vorbereitet ✓</span>\'">Bericht als PDF vorbereiten</button>' +
        '<button class="btn-primary" onclick="__bb.goTo(\'kunde-wahl\')">Neue Beratung starten</button>' +
      '</div>';
    screenWrap('brand', 100, contextLabel(), body, true);
  }

  function render() {
    var id = path[pointer];
    if (id === 'login') return renderLogin();
    if (id === 'kunde-wahl') return renderKundeWahl();
    if (id === 'kunde-bestehend') return renderKundeBestehend();
    if (id === 'kunde-neu') return renderKundeNeu();
    if (id === 'ziel') return renderZiel();
    if (id === 'painpoint') return renderPainpoint();
    if (id === 'anlass') return renderAnlass();
    if (id.indexOf('lifestyle:') === 0) return renderYesNoStep('lifestyle', LIFESTYLE_ITEMS, 'lifestyle', 'Lifestyle & Pflege');
    if (id.indexOf('sicherheit:') === 0) return renderYesNoStep('sicherheit', SAFETY_ITEMS, 'sicherheit', 'Sicherheitscheck');
    if (id === 'sicherheit-summary') return renderSicherheitSummary();
    if (id.indexOf('analyse:') === 0) return renderAnalyseStep();
    if (id === 'auswertung') return renderAuswertung();
    if (id === 'strategy') return renderStrategy();
    if (id === 'empfehlungen') return renderEmpfehlungen();
    if (id === 'blueprint') return renderBlueprint();
    if (id === 'abschluss') return renderAbschluss();
  }

  render();
})();
</script>
